<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Administração: pessoas, perfis, obras de cada um, convites e atividade.">
<meta name="theme-color" content="#22425c">
<title>Administração · Ferramentas da Obra</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-apple.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Obra">
<link rel="icon" href="icones/principal.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
/* cores e fontes comuns: estilo.css; aqui só as desta página */

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand{background:var(--navy);color:var(--brand-ink);position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:min(46%,560px);background:var(--petrol);clip-path:polygon(64px 0,100% 0,100% 100%,0 100%);z-index:0}
.brand-in{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1180px;margin:0 auto;padding:12px 16px}
.logo{display:block;color:inherit}.logo img{height:40px;width:40px;display:block}
.ttl{display:grid;border-left:1px solid rgba(255,255,255,.25);padding-left:16px;min-width:0}
.ttl .kick{font:600 .66rem var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-soft)}
.ttl h1{font:700 1.4rem/1.1 var(--f-disp);margin:0}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:6px 11px;font:600 .82rem var(--f-body);display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none}
.hbtn:hover{background:rgba(255,255,255,.2)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 48px;display:grid;gap:14px}
.muted{color:var(--muted);font-size:.88rem}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.9rem}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:7px;padding:8px 14px;font:600 .9rem var(--f-body);white-space:nowrap}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 14px;font:600 .9rem var(--f-body);color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.barra{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 11px;font:600 .82rem var(--f-body);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.alerta{border-color:var(--warn);color:var(--warn)}
a.tab{text-decoration:none;margin-left:auto}
.lbl{font:600 .68rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{margin:0;font-size:.82rem;color:var(--muted)}
.ruim{color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:600 .85rem var(--f-body);color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button:disabled{opacity:.55;cursor:default}
.grupo{display:grid;gap:5px}
.ovl{position:fixed;inset:0;z-index:80;background:rgba(10,20,30,.5);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);color:var(--ink);border-radius:12px;max-width:440px;width:100%;padding:16px 18px;display:grid;gap:10px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.sheet h3{margin:0;font:700 1.1rem var(--f-disp)}.sheet p{margin:0}
.sheet-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.chip b{font-family:var(--f-mono);font-weight:600;margin-left:4px}
.busca{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 11px;min-width:0}
.pessoas{display:grid;gap:10px}
.p{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px 12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.p.pend{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:700 1rem var(--f-disp)}
.pi{display:grid;gap:4px;min-width:0}
.pi .nm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pi input.nome{background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 6px;margin-left:-6px;font:700 1.02rem var(--f-body);min-width:0;flex:1 1 180px}
.pi input.nome:hover,.pi input.nome:focus{border-color:var(--line);background:var(--bg)}
.pi .em{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.pi .info{font-size:.78rem;color:var(--muted)}
.pill{font:600 .7rem var(--f-body);padding:1px 8px;border-radius:10px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neu{background:var(--bg);color:var(--muted)}
.pc{grid-column:2/-1;display:grid;gap:6px;border-top:1px solid var(--line-2);padding-top:10px}
.dsc{display:flex;flex-wrap:wrap;gap:5px}
.dsc button{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 10px;font:600 .8rem var(--f-body);color:var(--muted)}
.dsc button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dsc button:disabled{opacity:.4;cursor:default}
.pa{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;border-top:1px dashed var(--line-2);padding-top:8px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;max-width:760px}
.form .full{grid-column:1/-1}
.fld{display:grid;gap:4px}
.fld label,.fld .l{font:600 .7rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
.msg{font-size:.86rem}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.ativ{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px}
.ativ div{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:.9rem}
.ativ div:last-child{border-bottom:0}
.ativ time{font:500 .78rem var(--f-mono);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 15px;border-radius:8px;font-size:.88rem;z-index:50;max-width:calc(100% - 32px)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px;align-content:start}
.box h3{margin:0;font:700 .82rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.uso{display:grid;gap:4px}.uso-t{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}.uso-t span{color:var(--muted)}
.uso-b{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}.uso-b i{display:block;height:100%}
.lix{display:grid;gap:4px}
.lix div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;border-top:1px solid var(--line-2);padding-top:6px;font-size:.88rem}
.lix div .btn,.lix div a.btn{margin-left:auto}
.vazio{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center}
@media (max-width:720px){
  .brand::after{display:none}.ttl{border-left:0;padding-left:0}.hctl{margin-left:0;width:100%}
  .p{grid-template-columns:40px minmax(0,1fr)}.pc,.pa{grid-column:1/-1}a.tab{margin-left:0}
  .form{grid-template-columns:1fr}.ativ div{grid-template-columns:1fr;gap:2px}
}
.aviso-pf p{margin:0}
.aviso-pf{display:grid;gap:8px;justify-items:start;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:8px;padding:9px 11px;font-size:.86rem;margin:4px 0}
</style>
</head>
<body>
<header class="brand"><div class="brand-in">
  <a class="logo" href="index.html" aria-label="Início"><img src="icones/principal.svg" alt="" width="40" height="40"></a>
  <div class="ttl"><span class="kick">Ferramentas da Obra</span><h1>Administração</h1></div>
  <div class="hctl"><a class="hbtn" href="index.html">← Obras</a></div>
</div></header>
<main id="main"><p class="muted">Carregando…</p></main>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script src="config.js"></script>
<script src="nuvem.js"></script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms || 4000); }
const fmtDia = s => s ? new Date(s).toLocaleDateString('pt-BR') : '';
const fmtDH = s => { if (!s) return ''; const d = new Date(s); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const iniciais = n => String(n || '').trim().split(/[\s.@_-]+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
// perfis: um por pessoa; diz o que ela vê e faz em todo o sistema
const PERFIS = [
  ['admin', 'Administrador', 'Tudo, em todas as obras, e esta Administração.'],
  ['engenharia', 'Engenharia', 'Edita Risco, Concretagem e Fachadas. Abre, aprova e fecha pendências. Registra as personalizações e libera as frentes.'],
  ['seguranca', 'Segurança', 'Técnicos de segurança do trabalho. Edita o Mapa de Risco e registra pendências oficiais direto, sem passar pela Engenharia; avalia e fecha as de segurança. Não vê Concretagem nem Fachadas.'],
  ['campo', 'Campo', 'Equipes que corrigem. Pendências dos seus ofícios (marca como corrigida e sugere novas) e as personalizações que afetam o seu serviço, para dar “Estou ciente”.'],
  ['consulta', 'Consulta', 'Só visualiza os mapas, as pendências e as cerâmicas, sem alterar nada.'],
  ['almoxarifado', 'Almoxarifado', 'Só a ferramenta Cerâmicas: recebe os pallets (dados da etiqueta) e registra as entregas lendo o código do pallet pelo celular.']
];
const rotPerfil = v => (PERFIS.find(p => p[0] === v) || [, v || 'Sem acesso'])[1];
const descPerfil = v => (PERFIS.find(p => p[0] === v) || [, , ''])[2];
const BANCO_ESPERADO = 20;   // versão do banco.sql que esta tela espera

let NV = null, sb = null, LISTA = [], DISC = [], OBRAS = [], LOG = null, ABA = 'pessoas', FILTRO = 'todos', BUSCA = '', EU = '', VERSAO = null;
const nomeDe = e => { const u = LISTA.find(x => x.email === String(e || '').toLowerCase()); return (u && u.nome) || (NV ? NV.pessoas.nome(e) : String(e || '').split('@')[0]); };
const nomeObra = id => (OBRAS.find(o => o.id === id) || { nome: id }).nome;
const site = () => location.href.replace(/[^/]*$/, '');
const perfilDe = u => u.perfil || (u.papel ? (u.admin ? 'admin' : u.cargo === 'encarregado' ? 'campo' : u.cargo || (u.papel === 'editor' ? 'engenharia' : 'consulta')) : '');
const aguardando = u => u.tem_conta && !perfilDe(u);
const conviteAberto = u => u.tem_conta && !u.confirmado;
const semObra = u => perfilDe(u) && perfilDe(u) !== 'admin' && !(u.obras || []).length;
// rascunho de quem está virando Campo (precisa marcar o ofício antes de salvar)
const RASC = {};

/* ---------------- chamadas ---------------- */
async function carregar() {
  try { const r = await sb.from('pend_listas').select('valor,extra,ordem').eq('tipo', 'disciplina').order('ordem'); if (!r.error) DISC = r.data || []; } catch (e) {}
  try { OBRAS = await NV.obras.listar(); } catch (e) { OBRAS = []; }
  await NV.pessoas.carregar();
  LISTA = await NV.administracao.listar();
}
async function funcaoUsuarios(acao, email) {
  const { data: { session } } = await sb.auth.getSession();
  const C = window.MAPA_CONFIG || {}; const base = String(C.supabaseUrl || '').replace(/\/+$/, '');
  let r;
  try { r = await fetch(base + '/functions/v1/usuarios', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: C.supabaseAnonKey, Authorization: 'Bearer ' + (session && session.access_token) }, body: JSON.stringify({ acao, email, redirect: site() + 'index.html' }) }); }
  catch (e) { const x = new Error('A função "usuarios" não respondeu. Ela já foi publicada no Supabase? (veja o README)'); x.semFuncao = true; throw x; }
  const j = await r.json().catch(() => ({}));
  if (r.status === 404) { const x = new Error('A função "usuarios" ainda não foi publicada no Supabase (veja o README).'); x.semFuncao = true; throw x; }
  if (!r.ok) throw new Error(j.erro || j.message || ('erro ' + r.status));
  return j;
}
async function linkSenha(email) {
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: site() + 'index.html' });
  if (error) throw error;
  try { await sb.rpc('admin_registrar', { p_alvo: email, p_acao: 'senha', p_detalhe: 'link para criar/redefinir a senha' }); } catch (e) {}
}

/* ---------------- confirmação dentro da página ---------------- */
function confirmar(titulo, texto, botao, perigo) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'ovl';
    d.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cfT"><h3 id="cfT">${esc(titulo)}</h3><p>${texto}</p>
      <div class="sheet-f"><button class="btn ghost" type="button" data-n>Cancelar</button><button class="btn ${perigo ? 'danger' : ''}" type="button" data-s>${esc(botao)}</button></div></div>`;
    const fim = v => { d.remove(); document.removeEventListener('keydown', esc_); res(v); };
    const esc_ = ev => { if (ev.key === 'Escape') fim(false); };
    d.addEventListener('click', ev => { if (ev.target === d) fim(false); });
    d.querySelector('[data-n]').onclick = () => fim(false);
    d.querySelector('[data-s]').onclick = () => fim(true);
    document.addEventListener('keydown', esc_);
    document.body.appendChild(d); d.querySelector('[data-s]').focus();
  });
}

/* ---------------- tela ---------------- */
function render() {
  const velho = VERSAO === null || VERSAO < BANCO_ESPERADO;
  $('main').innerHTML = `
    ${velho ? `<div class="aviso"><b>O banco de dados precisa ser atualizado</b>${VERSAO ? ' (versão ' + VERSAO + ' de ' + BANCO_ESPERADO + ')' : ''}. No Supabase, abra <b>SQL Editor → New query</b>, cole o arquivo <b>banco.sql</b> inteiro e clique em <b>Run</b>. Depois recarregue esta página.</div>` : ''}
    <div class="tabs"><button class="tab" data-aba="pessoas" aria-pressed="${ABA === 'pessoas'}">Pessoas</button><button class="tab" data-aba="convidar" aria-pressed="${ABA === 'convidar'}">+ Convidar pessoa</button><button class="tab" data-aba="atividade" aria-pressed="${ABA === 'atividade'}">Atividade</button><button class="tab" data-aba="dados" aria-pressed="${ABA === 'dados'}">Dados</button><a class="tab" href="listas.html" title="Ofícios, tipos de problema e funcionários sem login">Ofícios e listas →</a></div>
    <div id="corpo"></div>`;
  $('main').querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { ABA = b.dataset.aba; render(); });
  if (ABA === 'convidar') telaConvidar(); else if (ABA === 'atividade') telaAtividade(); else if (ABA === 'dados') telaDados(); else telaPessoas();
}
const FILTROS = {
  todos: ['Todos', () => true], aguardando: ['Aguardando liberação', aguardando], convite: ['Convite não aceito', conviteAberto],
  admin: ['Administrador', u => perfilDe(u) === 'admin'], engenharia: ['Engenharia', u => perfilDe(u) === 'engenharia'],
  seguranca: ['Segurança', u => perfilDe(u) === 'seguranca'], campo: ['Campo', u => perfilDe(u) === 'campo'],
  consulta: ['Consulta', u => perfilDe(u) === 'consulta'], almoxarifado: ['Almoxarifado', u => perfilDe(u) === 'almoxarifado'], semobra: ['Sem obra', semObra]
};
function telaPessoas() {
  const q = BUSCA.trim().toLowerCase();
  const vis = LISTA.filter(FILTROS[FILTRO][1]).filter(u => !q || (u.email + ' ' + (u.nome || '') + ' ' + (u.oficios || u.disciplinas || []).join(' ') + ' ' + (u.obras || []).map(nomeObra).join(' ')).toLowerCase().includes(q))
    .sort((a, b) => (+aguardando(b) - +aguardando(a)) || String(a.nome || a.email).localeCompare(String(b.nome || b.email), 'pt-BR'));
  // filtros com zero pessoas ficam escondidos (menos "Todos" e o que está marcado)
  $('corpo').innerHTML = `<div class="barra">${Object.entries(FILTROS).map(([k, [t, f]]) => { const n = LISTA.filter(f).length; if (!n && k !== 'todos' && k !== FILTRO) return '';
      return `<button class="chip ${(k === 'aguardando' || k === 'convite' || k === 'semobra') && n ? 'alerta' : ''}" data-f="${k}" aria-pressed="${FILTRO === k}">${t}<b>${n}</b></button>`; }).join('')}</div>
    <div class="barra"><input class="busca" id="busca" type="search" placeholder="Buscar por nome, e-mail, ofício ou obra…" value="${esc(BUSCA)}" aria-label="Buscar pessoa"></div>
    <div class="pessoas">${vis.length ? vis.map(pessoaHtml).join('') : '<div class="vazio muted">Ninguém com este filtro.</div>'}</div>`;
  const C = $('corpo');
  C.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { FILTRO = b.dataset.f; telaPessoas(); });
  $('busca').oninput = e => { BUSCA = e.target.value; clearTimeout(telaPessoas.t); telaPessoas.t = setTimeout(() => { telaPessoas(); const b = $('busca'); b.focus(); b.setSelectionRange(b.value.length, b.value.length); }, 250); };
  ligarPessoas(C);
}
const chipsOficios = (sel, attr) => DISC.map(d => d.valor).concat(sel.filter(x => !DISC.some(d => d.valor === x)))
  .map(v => `<button type="button" ${attr}="${esc(v)}" aria-pressed="${sel.includes(v)}">${esc(v)}</button>`).join('');
const chipsObras = (sel, attr) => OBRAS.length ? OBRAS.map(o => `<button type="button" ${attr}="${esc(o.id)}" aria-pressed="${sel.includes(o.id)}">${esc(o.nome)}</button>`).join('')
  : '<span class="muted">Nenhuma obra cadastrada ainda.</span>';
function pessoaHtml(u) {
  const i = LISTA.indexOf(u), sou = u.email === EU, pend = aguardando(u), r = RASC[u.email];
  const pf = r ? r.perfil : perfilDe(u), ofs = r ? r.oficios : (u.oficios || u.disciplinas || []), obs = u.obras || [];
  const badges = [pend ? '<span class="pill warn">aguardando liberação</span>' : '', conviteAberto(u) ? '<span class="pill warn">convite não aceito</span>' : '',
    !u.tem_conta ? '<span class="pill neu">liberado, sem conta ainda</span>' : '', sou ? '<span class="pill ok">você</span>' : '',
    semObra(u) ? '<span class="pill warn">sem obra</span>' : '',
    u.avisos ? `<span class="pill ok" title="Aparelhos com avisos ligados">🔔 ${u.avisos}</span>` : ''].join('');
  const info = [u.tem_conta ? 'conta criada em ' + fmtDia(u.criado_em) : '', u.ultimo_acesso ? 'último acesso em ' + fmtDH(u.ultimo_acesso) : (u.tem_conta ? 'ainda não entrou' : ''), u.pendencias ? u.pendencias + ' pendência(s) registrada(s)' : ''].filter(Boolean).join(' · ');
  const perfis = `<div class="seg" role="radiogroup" aria-label="Perfil de ${esc(u.email)}">${PERFIS.map(([v, t]) => `<button type="button" role="radio" data-perfil="${i}" data-v="${v}" aria-checked="${pf === v}" ${sou ? 'disabled' : ''}>${t}</button>`).join('')}</div>
    <p class="hint">${pf ? esc(descPerfil(pf)) : 'Escolha o perfil para liberar o acesso.'}${sou ? ' Para mudar o seu próprio perfil, peça a outro administrador.' : ''}</p>`;
  const oficios = pf === 'campo' || pf === 'seguranca' ? `<div class="grupo"><span class="lbl">Ofícios${pf === 'seguranca' ? ' (opcional: para receber as pendências do ofício)' : ''}${r ? ' <b class="ruim">· marque ao menos um para salvar</b>' : ''}</span><div class="dsc" role="group" aria-label="Ofícios">${chipsOficios(ofs, 'data-of')}</div></div>` : '';
  // Campo com ofício de segurança: o perfil certo é Segurança
  const errado = pf === 'campo' && !sou && ofs.some(o => /segur/i.test(o)) ? `<div class="aviso-pf"><p>Tem o ofício <b>${esc(ofs.find(o => /segur/i.test(o)))}</b>, mas está no perfil Campo: só vê Pendências e o que registra passa pela Engenharia. No perfil <b>Segurança</b> passa a editar o Mapa de Risco e a registrar pendências oficiais direto. O ofício continua marcado.</p><button type="button" class="btn sm" data-paraseg="${i}">Mudar para Segurança</button></div>` : '';
  const obras = pf && pf !== 'admin' ? `<div class="grupo"><span class="lbl">Obras${obs.length ? ' · ' + obs.length + ' de ' + OBRAS.length : ''}</span><div class="dsc" role="group" aria-label="Obras">${chipsObras(obs, 'data-ob')}</div></div>`
    : pf === 'admin' ? '<p class="hint">Administrador vê todas as obras.</p>' : '';
  const acoes = [u.tem_conta && !sou ? `<button class="btn sm ghost" data-senha="${i}" type="button">Enviar link de senha</button>` : '',
    (!u.tem_conta || conviteAberto(u)) ? `<button class="btn sm ghost" data-conv="${i}" type="button">${u.tem_conta ? 'Reenviar convite' : 'Enviar convite'}</button>` : '',
    !sou && perfilDe(u) && u.tem_conta ? `<button class="btn sm ghost" data-bloq="${i}" type="button">Bloquear acesso</button>` : '',
    !sou ? `<button class="btn sm danger" data-exc="${i}" type="button">${u.tem_conta ? 'Excluir conta' : 'Remover'}</button>` : ''].join('');
  return `<article class="p${pend ? ' pend' : ''}" data-email="${esc(u.email)}">
    <span class="av" aria-hidden="true">${esc(iniciais(u.nome || u.email))}</span>
    <div class="pi"><div class="nm"><input class="nome" data-nome="${i}" maxlength="80" value="${esc(u.nome || '')}" placeholder="${esc(u.email.split('@')[0])} (sem nome)" aria-label="Nome de ${esc(u.email)}">${badges}</div>
      <span class="em">${esc(u.email)}</span>${info ? `<span class="info">${esc(info)}</span>` : ''}</div>
    <div class="pc"><span class="lbl">Perfil</span>${perfis}${errado}${oficios}${obras}</div>
    ${acoes ? `<div class="pa">${acoes}</div>` : ''}
  </article>`;
}
async function salvarPerfil(u, perfil, oficios, obras, txt) {
  try { await NV.administracao.definirPerfil(u.email, perfil, oficios, obras); delete RASC[u.email]; LOG = null; await recarregar(); if (txt) toast(txt); }
  catch (e) { toast('Não foi possível: ' + e.message, 6000); await recarregar(); }
}
function ligarPessoas(C) {
  const L = i => LISTA[+i];
  C.querySelectorAll('[data-perfil]').forEach(b => b.onclick = async () => { const u = L(b.dataset.perfil), v = b.dataset.v, atual = perfilDe(u);
    if (v === atual && !RASC[u.email]) return;
    // Campo precisa de ao menos um ofício: espera marcar antes de salvar
    if (v === 'campo' && !(u.oficios || u.disciplinas || []).length) { RASC[u.email] = { perfil: 'campo', oficios: [] }; telaPessoas(); toast('Marque os ofícios de ' + (u.nome || u.email) + '.'); return; }
    delete RASC[u.email];
    if (atual === 'admin' && v !== 'admin' && !(await confirmar('Tirar o administrador?', esc(u.nome || u.email) + ' deixa de ver a Administração e passa a ver só as obras marcadas no cartão.', 'Mudar para ' + rotPerfil(v)))) { telaPessoas(); return; }
    if (v === 'admin' && !(await confirmar('Tornar administrador?', esc(u.nome || u.email) + ' passa a ver todas as obras e esta Administração, e pode mudar o perfil de qualquer pessoa.', 'Tornar administrador'))) { telaPessoas(); return; }
    // quem é liberado agora e só existe uma obra já entra nela
    const obras = !atual && OBRAS.length === 1 ? [OBRAS[0].id] : null;
    await salvarPerfil(u, v, null, obras, (u.nome || u.email) + ': ' + rotPerfil(v) + '.'); });
  C.querySelectorAll('[data-of]').forEach(b => b.onclick = async () => { const art = b.closest('[data-email]'); const u = LISTA.find(x => x.email === art.dataset.email), v = b.dataset.of;
    const r = RASC[u.email]; const ds = (r ? r.oficios : (u.oficios || u.disciplinas || [])).slice(); const k = ds.indexOf(v); if (k >= 0) ds.splice(k, 1); else ds.push(v);
    if (!ds.length && (r ? r.perfil : perfilDe(u)) === 'campo') { if (r) { r.oficios = []; telaPessoas(); } else toast('Quem é de Campo precisa de ao menos um ofício.'); return; }
    const pfAtual = r ? r.perfil : perfilDe(u);
    if (!ds.length && pfAtual === 'seguranca') { await salvarPerfil(u, 'seguranca', [], null, (u.nome || u.email) + ': sem ofício.'); return; }
    await salvarPerfil(u, pfAtual === 'seguranca' ? 'seguranca' : 'campo', ds, null, (u.nome || u.email) + ': ' + ds.join(', ') + '.'); });
  C.querySelectorAll('[data-paraseg]').forEach(b => b.onclick = async () => { const u = L(b.dataset.paraseg);
    await salvarPerfil(u, 'seguranca', null, null, (u.nome || u.email) + ': Segurança.'); });
  C.querySelectorAll('[data-ob]').forEach(b => b.onclick = async () => { const art = b.closest('[data-email]'); const u = LISTA.find(x => x.email === art.dataset.email), v = b.dataset.ob;
    const os = (u.obras || []).slice(); const k = os.indexOf(v); if (k >= 0) os.splice(k, 1); else os.push(v);
    await salvarPerfil(u, perfilDe(u), null, os, (u.nome || u.email) + (k >= 0 ? ' saiu de ' : ' entrou em ') + nomeObra(v) + '.'); });
  C.querySelectorAll('[data-nome]').forEach(inp => inp.onchange = async () => { const u = L(inp.dataset.nome), n = inp.value.trim();
    try { await NV.pessoas.salvarNome(u.email, n); u.nome = n; toast('Nome salvo.'); } catch (e) { toast('Não foi possível salvar o nome: ' + e.message, 6000); } });
  C.querySelectorAll('[data-senha]').forEach(b => b.onclick = async () => { const u = L(b.dataset.senha);
    if (!(await confirmar('Enviar link de senha?', 'Vai para <b>' + esc(u.email) + '</b> um e-mail com o link para criar ou redefinir a senha.', 'Enviar'))) return; b.disabled = true;
    try { await linkSenha(u.email); LOG = null; toast('Link enviado para ' + u.email + '.'); } catch (e) { toast('Não foi possível enviar: ' + e.message, 6000); } b.disabled = false; });
  C.querySelectorAll('[data-conv]').forEach(b => b.onclick = async () => { const u = L(b.dataset.conv); b.disabled = true;
    try { const r = await funcaoUsuarios('convidar', u.email); LOG = null; toast(r.existia ? 'A conta já existia: enviei o link para criar a senha.' : 'Convite enviado para ' + u.email + '.', 6000); await recarregar(); }
    catch (e) { toast(e.message, 8000); b.disabled = false; } });
  C.querySelectorAll('[data-bloq]').forEach(b => b.onclick = async () => { const u = L(b.dataset.bloq);
    if (!(await confirmar('Bloquear o acesso?', esc(u.nome || u.email) + ' continua com o login, mas deixa de ver qualquer obra até você escolher um perfil de novo. O que a pessoa registrou continua.', 'Bloquear', true))) return;
    await salvarPerfil(u, 'nenhum', null, null, 'Acesso bloqueado.'); });
  C.querySelectorAll('[data-exc]').forEach(b => b.onclick = async () => { const u = L(b.dataset.exc);
    const ok = await confirmar(u.tem_conta ? 'Excluir a conta?' : 'Remover a liberação?', u.tem_conta ? 'A conta de <b>' + esc(u.email) + '</b> deixa de existir e a pessoa perde o acesso. As pendências e registros feitos por ela continuam.' : 'O e-mail <b>' + esc(u.email) + '</b> deixa de estar liberado.', u.tem_conta ? 'Excluir conta' : 'Remover', true);
    if (!ok) return; b.disabled = true;
    try {
      if (u.tem_conta) await funcaoUsuarios('excluir', u.email); else await NV.administracao.definirPerfil(u.email, 'nenhum');
      LOG = null; toast(u.tem_conta ? 'Conta excluída.' : 'Liberação removida.'); await recarregar();
    } catch (e) { toast((e.semFuncao ? '' : 'Não foi possível: ') + e.message, 8000); b.disabled = false; } });
}

function telaConvidar() {
  let pf = 'engenharia', ofs = [], obs = OBRAS.length === 1 ? [OBRAS[0].id] : [];
  $('corpo').innerHTML = `<form class="form" id="fC" autocomplete="off">
    <p class="muted full" style="margin:0">A pessoa recebe um e-mail para criar a senha e já entra com o perfil e as obras escolhidos aqui. Se ela já tiver conta, recebe um link para criar ou redefinir a senha.</p>
    <div class="fld"><label for="cEmail">E-mail *</label><input id="cEmail" type="email" required placeholder="colega@empresa.com"></div>
    <div class="fld"><label for="cNome">Nome</label><input id="cNome" maxlength="80" placeholder="Como aparece para a equipe"></div>
    <div class="fld full"><span class="l">Perfil</span><div class="seg" id="cPerfil" role="radiogroup" aria-label="Perfil"></div><p class="hint" id="cDesc"></p></div>
    <div class="fld full" id="cOfBox"><span class="l" id="cOfL">Ofícios</span><div class="dsc" id="cOf"></div></div>
    <div class="fld full" id="cObBox"><span class="l">Obras</span><div class="dsc" id="cOb"></div></div>
    <label class="full" style="display:flex;gap:8px;align-items:center;font-size:.9rem"><input type="checkbox" id="cEnviar" checked> Enviar o convite por e-mail agora</label>
    <div class="full" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn" id="cOk" type="button">Convidar e liberar</button><span class="msg" id="cMsg"></span></div>
  </form>`;
  const desenhar = () => {
    $('cPerfil').innerHTML = PERFIS.map(([v, t]) => `<button type="button" role="radio" data-v="${v}" aria-checked="${pf === v}">${t}</button>`).join('');
    $('cDesc').textContent = descPerfil(pf);
    $('cOfBox').hidden = pf !== 'campo' && pf !== 'seguranca'; $('cOfL').textContent = pf === 'seguranca' ? 'Ofícios (opcional)' : 'Ofícios'; $('cObBox').hidden = pf === 'admin';
    $('cOf').innerHTML = chipsOficios(ofs, 'data-v'); $('cOb').innerHTML = chipsObras(obs, 'data-v');
    $('cPerfil').querySelectorAll('[data-v]').forEach(b => b.onclick = () => { pf = b.dataset.v; desenhar(); });
    $('cOf').querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const v = b.dataset.v, k = ofs.indexOf(v); if (k >= 0) ofs.splice(k, 1); else ofs.push(v); desenhar(); });
    $('cOb').querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const v = b.dataset.v, k = obs.indexOf(v); if (k >= 0) obs.splice(k, 1); else obs.push(v); desenhar(); });
  };
  desenhar();
  $('cOk').onclick = async () => {
    const msg = (t, ok) => { $('cMsg').className = 'msg ' + (ok ? 'ok' : 'err'); $('cMsg').textContent = t; };
    const email = $('cEmail').value.trim().toLowerCase(), nome = $('cNome').value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg('Escreva um e-mail válido.'); return; }
    if (pf === 'campo' && !ofs.length) { msg('Marque ao menos um ofício.'); return; }
    if (pf !== 'admin' && !obs.length) { msg('Marque ao menos uma obra.'); return; }
    if (LISTA.some(u => u.email === email && perfilDe(u)) && !(await confirmar('Pessoa já liberada', esc(email) + ' já tem acesso. Atualizar o perfil e as obras e reenviar o e-mail?', 'Atualizar'))) return;
    $('cOk').disabled = true; msg('Liberando…', true);
    try {
      await NV.administracao.definirPerfil(email, pf, pf === 'campo' || pf === 'seguranca' ? ofs : null, pf === 'admin' ? null : obs);
      if (nome) await NV.pessoas.salvarNome(email, nome);
      let aviso = 'Acesso liberado.';
      if ($('cEnviar').checked) {
        try { const r = await funcaoUsuarios('convidar', email); aviso = r.existia ? 'Acesso liberado. A conta já existia: enviei o link para criar/redefinir a senha.' : 'Acesso liberado e convite enviado para ' + email + '.'; }
        catch (e) { aviso = 'Acesso liberado, mas o convite não foi enviado: ' + e.message + ' Enquanto isso, convide pelo Supabase (Authentication → Users → Invite user).'; }
      }
      LOG = null; await recarregar(); ABA = 'pessoas'; FILTRO = 'todos'; BUSCA = email; render(); toast(aviso, 9000);
    } catch (e) { msg('Não foi possível: ' + e.message); $('cOk').disabled = false; }
  };
}

/* ---------------- dados: espaço usado, backup e lixeira ---------------- */
const fmtTam = b => !b ? '0 MB' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toLocaleString('pt-BR', { maximumFractionDigits: b < 1073741824 ? 1 : 2 }) + ' MB';
function baixar(nome, blob) { const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000); }
const carregarScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('não foi possível carregar ' + src)); document.head.appendChild(s); });
async function telaDados() {
  $('corpo').innerHTML = '<p class="muted">Carregando…</p>';
  const [uso, lix] = await Promise.all([sb.rpc('admin_uso'), sb.rpc('admin_lixeira')]);
  if (uso.error && lix.error) { $('corpo').innerHTML = '<div class="aviso">Para ver o espaço usado, o backup e a lixeira, rode o arquivo <b>banco.sql</b> no Supabase.</div>'; return; }
  const u = (uso.data || [])[0] || {};
  const barra = (v, lim, rot) => { const p = Math.min(100, Math.round(v / lim * 100)); return `<div class="uso"><div class="uso-t"><b>${rot}</b><span>${fmtTam(v)} de ${fmtTam(lim)} (${p}%)</span></div><div class="uso-b"><i style="width:${p}%;background:${p > 85 ? 'var(--bad)' : p > 65 ? 'var(--warn)' : 'var(--ok)'}"></i></div></div>`; };
  const L = lix.data || [];
  $('corpo').innerHTML = `<div class="cols2">
    <section class="box"><h3>Espaço usado (plano gratuito)</h3>
      ${barra(+u.arquivos_bytes || 0, 1073741824, 'Arquivos')}${barra(+u.banco_bytes || 0, 524288000, 'Banco de dados')}
      <p class="muted" style="margin:0">${u.arquivos_qtd || 0} arquivo(s): ${u.fotos_qtd || 0} foto(s) de pendência (${fmtTam(+u.fotos_bytes || 0)}), modelos IFC ${fmtTam(+u.modelos_bytes || 0)}. Cada foto ocupa cerca de 200 KB.</p></section>
    <section class="box"><h3>Backup</h3>
      <p class="muted" style="margin:0">Uma cópia automática dos dados é feita todo domingo de madrugada e guardada no Supabase (ficam as 8 últimas). Para guardar fora do Supabase, baixe as cópias aqui de vez em quando.</p>
      <div class="barra"><button class="btn" id="bkDados" type="button">Baixar os dados agora (JSON)</button><button class="btn ghost" id="bkArq" type="button">Baixar todos os arquivos (ZIP)</button></div>
      <div id="bkMsg" class="msg"></div><div id="bkLista"></div></section></div>
    <section class="box"><h3>Lixeira (${L.length})</h3>
      <p class="muted" style="margin:0">Obras e pendências excluídas e mapas resetados ficam aqui por 30 dias e depois são apagados de vez. Restaurar um mapa traz de volta o que foi apagado, sem tirar o que foi feito depois.</p>
      ${L.length ? `<div class="lix">${L.map((x, i) => { const dias = Math.max(0, 30 - Math.floor((Date.now() - new Date(x.excluida_em)) / 864e5));
        return `<div><span class="pill ${x.tipo === 'obra' ? 'bad' : x.tipo === 'painel' ? 'warn' : 'neu'}">${x.tipo === 'obra' ? 'obra' : x.tipo === 'painel' ? 'mapa' : 'pendência'}</span><b>${esc(x.titulo)}</b><span class="muted">${x.tipo !== 'obra' ? esc(nomeObra(x.obra)) + ' · ' : ''}excluída em ${fmtDH(x.excluida_em)}${x.excluida_por ? ' por ' + esc(nomeDe(x.excluida_por)) : ''} · some em ${dias} dia(s)</span><button class="btn sm ghost" data-rest="${i}" type="button">Restaurar</button></div>`; }).join('')}</div>` : '<p class="muted" style="margin:0">A lixeira está vazia.</p>'}</section>`;
  $('corpo').querySelectorAll('[data-rest]').forEach(b => b.onclick = async () => { const x = L[+b.dataset.rest]; b.disabled = true;
    const { error } = await sb.rpc('admin_restaurar', { p_tipo: x.tipo, p_id: x.id }); if (error) { toast('Não foi possível restaurar: ' + error.message, 6000); b.disabled = false; return; }
    LOG = null; toast((x.tipo === 'obra' ? 'Obra restaurada' : x.tipo === 'painel' ? 'Mapa restaurado' : 'Pendência restaurada') + '.'); telaDados(); });
  const msg = (t, ok) => { $('bkMsg').className = 'msg ' + (ok ? 'ok' : 'err'); $('bkMsg').textContent = t; };
  $('bkDados').onclick = async () => { $('bkDados').disabled = true; msg('Montando a cópia…', true);
    try { const j = await funcaoUsuarios('backup'); baixar('backup-obras-' + new Date().toISOString().slice(0, 10) + '.json', new Blob([JSON.stringify(j, null, 1)], { type: 'application/json' }));
      msg('Cópia baixada (' + Object.values(j.tabelas || {}).reduce((s, t) => s + t.length, 0) + ' registros; a lista de ' + (j.arquivos || []).length + ' arquivos vai junto).', true); LOG = null; listarBackups(); }
    catch (e) { msg(e.message); } $('bkDados').disabled = false; };
  $('bkArq').onclick = async () => { $('bkArq').disabled = true; msg('Listando os arquivos…', true);
    try {
      const { arquivos } = await funcaoUsuarios('arquivos'); const tot = arquivos.reduce((s, f) => s + (f.tamanho || 0), 0);
      if (!(await confirmar('Baixar todos os arquivos?', arquivos.length + ' arquivo(s), cerca de ' + fmtTam(tot) + ', num arquivo ZIP. Pode demorar alguns minutos.', 'Baixar ZIP'))) { msg(''); $('bkArq').disabled = false; return; }
      if (!window.JSZip) await carregarScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
      const zip = new JSZip(); let n = 0;
      for (const f of arquivos) { n++; msg('Baixando ' + n + ' de ' + arquivos.length + '…', true); try { const r = await fetch(f.url); if (r.ok) zip.file(f.nome, await r.blob()); } catch (e) { console.warn(f.nome, e); } }
      msg('Compactando…', true); const blob = await zip.generateAsync({ type: 'blob' }, m => msg('Compactando… ' + Math.round(m.percent) + '%', true));
      baixar('arquivos-obras-' + new Date().toISOString().slice(0, 10) + '.zip', blob); msg('ZIP baixado com ' + n + ' arquivo(s).', true); LOG = null;
    } catch (e) { msg(e.message); }
    $('bkArq').disabled = false; };
  listarBackups();
}
async function listarBackups() {
  const box = $('bkLista'); if (!box) return;
  try { const { backups } = await funcaoUsuarios('backups');
    box.innerHTML = backups.length ? '<p class="muted" style="margin:6px 0 2px">Cópias guardadas no Supabase:</p><div class="lix">' + backups.map(b => `<div><b>${esc(b.nome.replace('.json', ''))}</b><span class="muted">${fmtTam(b.tamanho)}</span><a class="btn sm ghost" href="${esc(b.url)}" download="backup-obras-${esc(b.nome)}" style="text-decoration:none">Baixar</a></div>`).join('') + '</div>'
      : '<p class="muted" style="margin:6px 0 0">Ainda não há cópias automáticas (a primeira sai no próximo domingo, ou ao baixar os dados agora).</p>'; }
  catch (e) { box.innerHTML = '<p class="muted" style="margin:6px 0 0">' + esc(e.message) + '</p>'; }
}

async function recarregar() { try { await carregar(); } catch (e) { toast('Não foi possível atualizar a lista: ' + e.message, 6000); } render(); }

(async function () {
  NV = await (window.NUVEM_PRONTA || Promise.resolve(null));
  if (!NV) { $('main').innerHTML = '<div class="vazio">A administração precisa do banco online.</div>'; return; }
  if (!NV.admin) { $('main').innerHTML = '<div class="vazio"><h3 style="margin:0 0 6px">Só administradores</h3><p class="muted" style="margin:0">Peça a um administrador para mudar o seu perfil.</p></div>'; return; }
  sb = NV.cliente; EU = String(NV.usuario.email).toLowerCase();
  VERSAO = await NV.administracao.versaoBanco();
  try { await carregar(); } catch (e) { $('main').innerHTML = '<div class="aviso">Não foi possível carregar as pessoas: ' + esc(e.message) + '</div>'; return; }
  const p = new URLSearchParams(location.search); if (p.get('filtro') && FILTROS[p.get('filtro')]) FILTRO = p.get('filtro');
  render();
})();
})();
</script>
