<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Pendências de obra: registro com fotos, correção, aprovação, histórico e relatórios.">
<meta name="theme-color" content="#22425c">
<title>Pendências de obra</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-apple.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Obra"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icones/pendencias.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
/* cores e fontes comuns: estilo.css; aqui só as desta página */
:root{
  --info:#2f6fb0; --info-soft:#dde9f6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --info:#7fb2e6; --info-soft:#17304a; color-scheme:dark}}
:root[data-theme="dark"]{
  --info:#7fb2e6; --info-soft:#17304a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px var(--f-body);-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* faixa da marca */
.brand{background:var(--navy);color:var(--brand-ink);position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:min(46%,560px);background:var(--petrol);clip-path:polygon(64px 0,100% 0,100% 100%,0 100%);z-index:0}
.brand-in{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1240px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px))}
.logo{display:block;color:inherit}
.logo img{height:40px;width:40px;display:block}
.ttl{display:grid;border-left:1px solid rgba(255,255,255,.25);padding-left:16px;min-width:0}
.ttl .kick{font:600 .66rem var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-soft)}
.ttl h1{font:700 1.35rem/1.1 var(--f-disp);margin:0}
.ttl .obra{font-size:.82rem;color:#d4e4ee}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:6px 11px;font:600 .82rem var(--f-body);display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none}
.hbtn:hover{background:rgba(255,255,255,.2)}
.modechip{font:500 .7rem var(--f-mono);color:#d4e4ee;border:1px dashed rgba(255,255,255,.35);border-radius:12px;padding:2px 8px;white-space:nowrap}
.modechip.off{border-color:#f0a93a;color:#f7cf8d}

main{max-width:1240px;margin:0 auto;padding:14px 16px 24px;display:grid;gap:14px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.86rem;color:var(--muted)}
.crumbs .lnk{margin-left:auto}
.crumbs a{font-weight:600;text-decoration:none;color:var(--accent)} .crumbs a:hover{text-decoration:underline}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:8px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 22px;font:700 .92rem var(--f-body);color:var(--ink);min-width:84px}
.tab:hover{border-color:var(--accent)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs .sp{flex:1}
.tabs #bPdf{border-radius:9px;padding:9px 18px;color:var(--ink);border-color:var(--line);background:var(--panel)}
.tabs #bPdf:hover{border-color:var(--accent)}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:.9rem}
.aviso.info{background:var(--accent-soft);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.92rem}
.muted{color:var(--muted);font-size:.88rem}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:7px;padding:8px 14px;font:600 .9rem var(--f-body);white-space:nowrap}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:default}

/* filtros */
.filtros{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:12px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frot{font-size:.88rem;color:var(--muted);margin-right:6px}
.chip{background:none;border:1px solid var(--line);border-radius:16px;padding:5px 10px;font:500 .84rem var(--f-body);color:var(--ink);white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.chip b{font-family:var(--f-body);font-weight:600;margin-left:2px}
.fsel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:500 .88rem var(--f-body);max-width:100%;min-height:38px}
.frow .fs{display:contents}.frow .fs>span{display:none}
.frow .fs .fsel{flex:0 0 auto;width:126px}
.fsels{display:contents}
.frow.f1 .fsel{width:auto;max-width:170px}
.fsel.on{border-color:var(--accent);background:var(--accent-soft)}
.lh-d{display:flex;gap:12px;align-items:center}
.lh-d .lnk{margin:0}
.lh-d .fsel{min-height:32px;padding:5px 8px;font-size:.84rem}
.filtros .bFil{color:var(--ink);border-color:var(--line);background:var(--panel)}
.filtros .frot{margin-right:0}
.filtros{padding:10px 12px;gap:10px}
.fsep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px}
.busca{flex:1 1 220px;max-width:none;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 11px;color:var(--muted);min-height:40px}
.busca input{flex:1;border:0;background:none;outline:0;padding:9px 0;min-width:0;color:var(--ink)}
.busca:focus-within{border-color:var(--accent)}
.lnk{background:none;border:0;color:var(--accent);font:600 .88rem var(--f-body);padding:4px 2px;margin-left:auto}
.lnk:hover{text-decoration:underline}
.bFil b{background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;font-size:.75rem;margin-left:4px}
.so-cel{display:none!important}
#tabBody{display:grid;gap:12px;min-width:0}
.lhead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:2px}
.ruim{color:var(--bad)}
.lhead h2{margin:0;font:700 1rem var(--f-body)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .fsel{width:100%}
.btn.grande{flex:1;padding:11px 14px}
.filtros-ovl .sheet>footer .btn.ghost{padding:11px 18px}

/* lista */
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{display:grid;grid-template-columns:76px minmax(0,1fr) auto;grid-template-rows:1fr auto;gap:8px 12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 12px 10px;text-align:left;width:100%;color:inherit;transition:border-color .12s,background .12s}
.card:hover{border-color:var(--accent);background:var(--accent-soft)}
.card.pri-critica{border-left-color:var(--bad)} .card.pri-alta{border-left-color:var(--warn)}
.th{width:76px;height:76px;border-radius:7px;background:var(--bg);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.7rem;position:relative}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .n{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.62);color:#fff;font:600 .66rem var(--f-body);border-radius:4px;padding:0 4px}
.cb{display:grid;gap:2px;min-width:0;align-content:start}
.l0{display:flex;flex-wrap:wrap;gap:2px 5px;align-items:center;font-size:.78rem;color:var(--muted)}
.l0 .num{font:600 .8rem var(--f-body);color:var(--muted)}
.l0 .stt{font-weight:600}
.stt.st-avaliacao{color:var(--accent)} .stt.st-aberta{color:var(--muted)} .stt.st-em_correcao{color:var(--warn)} .stt.st-corrigida{color:var(--info)} .stt.st-fechada{color:var(--ok)}
.l0 .inc{color:var(--warn);font-weight:600}
.cb .loc{font:700 .98rem/1.25 var(--f-body);overflow-wrap:anywhere;margin-top:1px}
.cb .sub{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.cr{display:flex;gap:6px;align-items:flex-start}
.prib{font:600 .74rem var(--f-body);padding:2px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.prib.pri-critica{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.prib.pri-alta{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chev{color:var(--accent);font:600 1.2rem/1 var(--f-body)}
.cft{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;align-items:center;font-size:.84rem;border-top:1px solid var(--line-2);padding-top:7px}
.cft .muted{font-size:.8rem}
.cft .ok{color:var(--ok);font-weight:600}
.pill{font:600 .7rem var(--f-body);padding:1px 8px;border-radius:10px;white-space:nowrap;border:1px solid transparent}
.st-avaliacao{background:var(--accent-soft);color:var(--accent)} .st-aberta{background:var(--bad-soft);color:var(--bad)} .st-em_correcao{background:var(--warn-soft);color:var(--warn)}
.st-corrigida{background:var(--info-soft);color:var(--info)} .st-fechada{background:var(--ok-soft);color:var(--ok)}
.stt{background:none!important}
.p-critica{border-color:var(--bad);color:var(--bad)} .p-alta{border-color:var(--warn);color:var(--warn)} .p-media{border-color:var(--line);color:var(--muted)} .p-baixa{border-color:var(--line-2);color:var(--muted)}
.tag{font:600 .68rem var(--f-body);padding:1px 7px;border-radius:10px;background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.tag.venc{border-style:solid;border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.tag.inc{border-color:var(--warn);color:var(--warn)}
.tag.fila{border-color:var(--info);color:var(--info)}
.tag.err{border-style:solid;border-color:var(--bad);color:var(--bad)}
.vazio{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.vazio h3{margin:0;font:700 1.15rem var(--f-disp)}

/* ficha da pendência */
.ficha-ovl .sheet{width:min(1060px,100%)}
.fi-mais{position:relative}
.ficha-ovl .sheet>header .x{border:1px solid var(--line);border-radius:8px;min-width:38px;height:38px;display:grid;place-items:center;font-size:1.25rem;color:var(--ink)}
.ficha-ovl .sheet>header .x:hover{border-color:var(--accent)}
.ficha-ovl .sheet>header .fi-volta{display:none}
.fi-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:5;min-width:170px;display:grid;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.fi-menu button{background:none;border:0;border-radius:5px;padding:9px 11px;text-align:left;font:500 .92rem var(--f-body);color:var(--ink)}
.fi-menu button:hover{background:var(--accent-soft)} .fi-menu button.ruim{color:var(--bad)} .fi-menu button.ruim:hover{background:var(--bad-soft)}
.fi{display:grid;gap:16px}
.fi section{display:grid;gap:8px;align-content:start;min-width:0}
.fi h3{margin:0;font:700 1.15rem var(--f-disp)}
.fi-top{display:grid;gap:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.fi-tit{margin:0;font:700 1.6rem/1.2 var(--f-disp);overflow-wrap:anywhere}
.fi-loc{margin:0;font:600 1rem var(--f-body);color:var(--accent)}
.fi-pills{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.88rem;margin:2px 0}
.fi-pr,.fi-st{font:600 .8rem var(--f-body);padding:3px 10px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.fi-pr.pri-critica{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)} .fi-pr.pri-alta{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.fi-st.st-avaliacao{border-color:var(--accent)} .fi-st.st-aberta{border-color:var(--bad)} .fi-st.st-em_correcao{border-color:var(--warn)} .fi-st.st-corrigida{border-color:var(--info)} .fi-st.st-fechada{border-color:var(--ok)}
.fi-pills .inc{color:var(--warn);font-weight:600}
.fi-tipo{margin:0;color:var(--muted)}
.fi-desc{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.fi-resp{display:grid;gap:1px;margin-top:4px}
.fi-l,.fi-kv dt{font-size:.78rem;color:var(--muted)}
.fi-resp b{font-weight:600}
.fi-kv{display:flex;flex-wrap:wrap;gap:6px 22px;margin:2px 0 0}
.fi-kv div{display:grid;gap:1px;min-width:0;max-width:100%}
.fi-kv dd{margin:0;font-size:.88rem;overflow-wrap:anywhere;white-space:pre-wrap}
.fi-meio{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.fi-meio.so,.fi-meio.pl-grande{grid-template-columns:1fr}
.fi-fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fi-fb{display:grid;gap:8px;align-content:start;justify-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;min-height:110px}
.fi-fl{justify-self:start;font:600 .8rem var(--f-body);color:var(--muted)}
.fi-fb .fotos{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;width:100%}
.fi-fb .fotos .ft{width:100%;height:170px}
.fi-fb .fotos .ft img{object-fit:cover}
.fi-sem{align-self:center;margin:auto 0}
.fi-add{width:100%}
.fi-sub{margin:-4px 0 0}
.fi-pl{position:relative}
.fi-pl .pl-sc{max-height:200px}
.pl-grande .fi-pl .pl-sc{max-height:min(70vh,640px)}
.fi-amp{position:absolute;right:10px;bottom:46px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.fi-at .com{grid-template-columns:1fr auto;align-items:stretch}
.fi-at .com textarea{min-height:42px;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.fi-hist{display:grid;gap:10px;border-left:2px solid var(--line);margin-left:4px;padding-left:14px}
.fi-hist div{position:relative;font-size:.9rem}
.fi-hist div::before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.fi-hist small{display:block;color:var(--muted);font-size:.78rem}
.fi-hist .cm{display:block;background:var(--bg);border-radius:6px;padding:6px 9px;margin-top:4px}
.ficha-ovl .sheet>footer .btn{padding:10px 18px}
.ficha-ovl .sheet>footer:not(:has(.btn)){display:none}
@media (max-width:640px){
  .ficha-ovl{padding:0}
  .ficha-ovl .sheet{max-height:100dvh;height:100dvh;border-radius:0}
  .ficha-ovl .sheet>header .fi-volta{display:grid}
  .ficha-ovl #ovlX{display:none}
  .fi-tit{font-size:1.35rem}
  .fi-meio{grid-template-columns:1fr}
  .ficha-ovl .sheet>footer{flex-wrap:nowrap}
  .ficha-ovl .sheet>footer .btn{flex:1 1 auto}
  .ficha-ovl .sheet>footer .btn.ghost:first-of-type{flex:0 0 auto}
}
/* marcar na foto */
.fotos .ft .ft-ed{position:absolute;left:3px;bottom:3px;top:auto;right:auto;width:auto;height:auto;border-radius:6px;padding:2px 6px;font:600 .68rem/1.3 var(--f-body);background:rgba(0,0,0,.66);color:#fff;border:0}
.anot{position:fixed;inset:0;z-index:60;background:#0b141b;display:grid;grid-template-rows:auto minmax(0,1fr) auto;color:#fff;touch-action:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.an-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px}
.an-top .btn.ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.an-area{display:grid;place-items:center;min-height:0;padding:4px 8px;overflow:hidden}
.an-area canvas{max-width:100%;max-height:100%;touch-action:none;border-radius:4px;cursor:crosshair;display:block}
.an-bar{display:grid;gap:8px;padding:8px 12px 12px;background:#14222e}
.an-ferr{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.an-ferr button{display:grid;justify-items:center;gap:2px;min-width:58px;padding:6px 6px 4px;border-radius:9px;border:1px solid rgba(255,255,255,.18);background:none;color:#d4e4ee;font:600 .7rem var(--f-body)}
.an-ferr button[aria-pressed="true"]{background:#62aed3;border-color:#62aed3;color:#06202e}
.an-cores{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.an-cores [data-c]{width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid rgba(255,255,255,.35);padding:0}
.an-cores [data-c][aria-pressed="true"]{outline:3px solid #62aed3;outline-offset:2px}
.an-desf{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;font:600 .82rem var(--f-body);margin-left:6px}
.an-dica{margin:0;text-align:center;font-size:.76rem;color:#9fb6c6}
/* botão flutuante */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--accent);color:var(--accent-ink);border:0;border-radius:28px;padding:14px 20px;font:700 1rem var(--f-body);box-shadow:0 8px 24px rgba(0,0,0,.28)}

/* resumo */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;text-align:left;color:inherit}
.tile b{font:700 1.8rem/1 var(--f-disp)}
.tile span{font-size:.84rem;color:var(--muted)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;min-width:0;overflow:auto}
.box h3{margin:0;font:700 .82rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
table.t{border-collapse:collapse;width:100%;font-size:.86rem}
table.t th,table.t td{padding:5px 6px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left;white-space:normal}
table.t th{font:600 .72rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bl{display:grid;gap:4px}
.bl button{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;text-align:left;background:none;border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;color:inherit}
.bl button small{grid-column:1/-1;color:var(--muted)}

/* janelas */
.overlay{position:fixed;inset:0;background:rgba(6,20,30,.5);display:grid;place-items:center;padding:12px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:calc(100dvh - 24px);display:grid;grid-template-rows:auto 1fr auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.sheet>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet>header h3{margin:0;font:700 1.2rem var(--f-disp);flex:1}

<header class="brand"><div class="brand-in">

<script>
(function () {
'use strict';
/* ======================= utilidades ======================= */
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms || 4000); }
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoje = () => iso(new Date());
const somaDias = (s, n) => { const [y, m, d] = s.split('-').map(Number); const x = new Date(y, m - 1, d); x.setDate(x.getDate() + n); return iso(x); };
const fmtD = s => { if (!s) return '—'; const [y, m, d] = String(s).slice(0, 10).split('-'); return d + '/' + m + '/' + y; };
const fmtDH = s => { if (!s) return '—'; const d = new Date(s); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const clone = o => JSON.parse(JSON.stringify(o));
const semRede = e => !navigator.onLine || /Failed to fetch|NetworkError|network|fetch|Load failed|conex/i.test(String((e && (e.message || e.error_description)) || e));

const ST = { avaliacao: 'Em avaliação', aberta: 'Aberta', em_correcao: 'Em correção', corrigida: 'Corrigida', fechada: 'Fechada' };
const ST_ORD = ['avaliacao', 'aberta', 'em_correcao', 'corrigida', 'fechada'];
// sem ofício escolhido (sugestão de quem é de campo ou pendência que a Segurança ainda vai avaliar)
const A_DEFINIR = 'A definir';
const PRI = { critica: ['Crítica', 1], alta: ['Alta', 3], media: ['Média', 7], baixa: ['Baixa', 15] };
const PRI_ORD = ['critica', 'alta', 'media', 'baixa'];
const PAV_PADRAO = ['Térreo', 'Pavimento 02', 'Pavimento 03', 'Pavimento 04', 'Pavimento 05', 'Pavimento 06', 'Pavimento 07', 'Pavimento 08', 'Pavimento 09', 'Pavimento 10', 'Pavimento 11', 'Cobertura'].map(n => ({ nome: n, unidades: [] }));

/* ======================= estado ======================= */
let NV = null, sb = null, OBRA = null, OBRA_NOME = '';
let L = { problema: [], disciplina: [], comodo: [], servico: [], local: [] };   // listas
let CFG = { pavimentos: [] };                                                    // pavimentos e unidades
let PEND = [];        // pendências do servidor (com fotos e eventos)
let PLANTAS = {};     // pavimento -> planta (imagem gerada pelo Mapa de Risco a partir do IFC)
let FILA = [];        // operações aguardando envio (deste aparelho)
let FUNC = [];        // funcionários da obra (Listas e regras → Funcionários)
let PERSZ = [];       // personalizações dos apartamentos (aviso na ficha e no cadastro)
let TAB = 'lista';
const F = { st: new Set(['avaliacao', 'aberta', 'em_correcao', 'corrigida']), pav: '', disc: '', resp: '', tipo: '', pri: '', blq: false, inc: false, venc: false, fila: false, minhas: false, paraMim: false, meu: false, ord: 'pri', q: '' };
const euEmail = () => String((NV && NV.usuario && NV.usuario.email) || '').toLowerCase();
const minha = p => String(p.criado_por || '').toLowerCase() === euEmail();
// funcionários que podem corrigir num cargo; e se a pendência foi escolhida para mim
const funcsDe = cargo => FUNC.filter(f => f.ativo !== false && (f.cargos || []).includes(cargo));
const paraMim = p => !!p.responsavel && FUNC.some(f => f.id === p.responsavel && String(f.email || '').toLowerCase() === euEmail());
// quem é de campo: as escolhidas para ele, as do ofício sem ninguém escolhido e as sugestões dele
const doMeu = p => minha(p) || !p.responsavel || paraMim(p);

/* ======================= quem pode o quê (o banco confere de novo) ======================= */
const cargo = () => NV && NV.cargo;
// perfil: admin | engenharia | seguranca | campo | consulta
const perfil = () => !NV ? '' : NV.perfil || ({ engenharia: 'engenharia', seguranca: 'seguranca', encarregado: 'campo' }[NV.cargo]) || (NV.admin ? 'admin' : 'consulta');
const engenharia = () => ['admin', 'engenharia'].includes(perfil());
// quem é de campo registra como sugestão (a Engenharia avalia); Consulta só vê
const podeCriar = () => ['admin', 'engenharia', 'seguranca', 'campo'].includes(perfil());
const sugere = () => perfil() === 'campo';
const quemAvalia = p => p.seguranca ? 'a Segurança do Trabalho' : 'a Engenharia';
const ehSegTipo = t => { const e = (L.problema.find(x => x.valor === t) || {}).extra || {}; return e.seguranca === true || e.disciplina === 'Segurança'; };
// listas e regras: as da obra (ou o padrão da empresa). Itens desativados não aparecem no formulário.
const LO = window.ListasObra;
const ativos = t => LO.ativos(L[t]).map(x => x.valor);
const prazoDe = k => ((CFG.regras || {}).prazos || LO.PRAZOS)[k];
const obrig = k => !!((CFG.regras || {}).obrigatorios || {})[k];
const editor = p => engenharia() || (perfil() === 'seguranca' && p.seguranca);
// avalia, fecha e reprova: Segurança nas de segurança, Engenharia nas outras (administrador: todas)
const fecha = p => perfil() === 'admin' || (p.seguranca ? perfil() === 'seguranca' : perfil() === 'engenharia');
const nomeDe = e => NV && NV.pessoas ? NV.pessoas.nome(e) : String(e || 'alguém').split('@')[0];

/* ======================= IndexedDB: fila, fotos e cópia para usar sem sinal ======================= */
// No iPhone (Safari) o IndexedDB falha de vários jeitos: modo privado, Modo de Bloqueio e, principalmente,
// depois que a câmera abre a página vai para segundo plano e o Safari derruba a conexão; na volta, gravar ou
// abrir de novo pode ficar esperando para sempre. Por isso: cada operação tem prazo, a conexão é refeita
// quando cai e, se mesmo assim não der, os dados ficam na memória desta página (e são enviados com sinal).
// As fotos são guardadas como bytes (ArrayBuffer), que o Safari relê sem problema na hora de enviar.
const comPrazo = (pr, ms, nome) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error((nome || 'operação') + ' demorou demais')), ms))]);
let IDB = null, SEM_IDB = false; const MEM = { fila: new Map(), blobs: new Map(), cache: new Map() };
function idb() {
  if (IDB) return IDB;
  const pr = comPrazo(new Promise((res, rej) => { let r; try { r = indexedDB.open('pendencias_obra', 1); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => { const d = r.result; for (const s of ['fila', 'blobs', 'cache']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
    r.onsuccess = () => { const d = r.result; d.onclose = () => { if (IDB === pr) IDB = null; }; d.onversionchange = () => { d.close(); if (IDB === pr) IDB = null; }; res(d); };
    r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('IndexedDB bloqueado')); }), 2000, 'abrir o armazenamento');
  IDB = pr; pr.catch(() => { if (IDB === pr) IDB = null; }); return pr;
}
// roda uma operação; se a conexão caiu ou travou, reabre e tenta mais uma vez; depois desiste (null)
async function noIdb(fn) {
  if (SEM_IDB) return { ok: false };
  for (let i = 0; i < 2; i++) {
    try { const d = await idb(); const v = await comPrazo(new Promise((res, rej) => fn(d, res, rej)), 2000, 'gravar no aparelho'); return { ok: true, v }; }
    catch (e) { console.warn('IndexedDB', e); IDB = null; }
  }
  SEM_IDB = true;   // falhou mesmo reabrindo: nesta página usa só a memória (volta a usar o aparelho ao recarregar)
  return { ok: false };
}
// voltou para a página (ex.: depois da câmera): abre uma conexão nova em vez de reaproveitar a que o Safari pode ter derrubado
document.addEventListener('visibilitychange', () => { if (!document.hidden && IDB) { const velho = IDB; IDB = null; velho.then(d => { try { d.close(); } catch (e) {} }).catch(() => {}); } });
window.addEventListener('pageshow', () => { IDB = null; });
const paraBytes = async b => {
  try { const buf = await comPrazo(b.arrayBuffer ? b.arrayBuffer() : new Response(b).arrayBuffer(), 5000, 'ler a foto'); return { _bytes: buf, type: b.type || 'image/jpeg' }; }
  catch (e) { return await comPrazo(new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res({ _bytes: fr.result, type: b.type || 'image/jpeg' }); fr.onerror = () => rej(fr.error); fr.readAsArrayBuffer(b); }), 5000, 'ler a foto').catch(() => b); }
};
const deBytes = v => v && v._bytes ? new Blob([v._bytes], { type: v.type }) : v;
async function idbPut(st, k, v) {
  if (st === 'blobs' && v instanceof Blob) v = await paraBytes(v);
  MEM[st].set(k, v);   // a memória sempre tem a versão mais nova; o aparelho guarda para depois
  const r = await noIdb((d, res, rej) => { const t = d.transaction(st, 'readwrite'); t.objectStore(st).put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('gravação cancelada')); });
  if (r.ok && st !== 'fila') MEM[st].delete(k);   // a fila fica também na memória (é pequena)
}
async function idbGet(st, k) {
  let v = MEM[st].has(k) ? MEM[st].get(k) : null;
  if (v == null) { const r = await noIdb((d, res, rej) => { const q = d.transaction(st).objectStore(st).get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => rej(q.error); }); if (r.ok) v = r.v; }
  return st === 'blobs' ? deBytes(v) : v;
}
async function idbDel(st, k) { MEM[st].delete(k); await noIdb((d, res, rej) => { const t = d.transaction(st, 'readwrite'); t.objectStore(st).delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
async function idbAll(st) {
  const m = new Map();
  const r = await noIdb((d, res, rej) => { const o = new Map(); const q = d.transaction(st).objectStore(st).openCursor();
    q.onsuccess = () => { const c = q.result; if (c) { o.set(c.key, c.value); c.continue(); } else res(o); }; q.onerror = () => rej(q.error); });
  if (r.ok) for (const [k, v] of r.v) m.set(k, v);
  for (const [k, v] of MEM[st]) m.set(k, v);   // o que está na memória vale por cima
  return [...m.values()];
}

/* ======================= fotos: reduz para 1600 px e JPEG ======================= */
async function comprimir(arq) {
  const url = URL.createObjectURL(arq); const img = new Image();
  try { await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('não foi possível ler a imagem')); img.src = url; }); }
  finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
  // o iPhone limita a memória de desenho: libera cada canvas e, se falhar, tenta menor
  for (const lado of [1600, 1200, 900]) {
    const sc = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.naturalWidth * sc)); cv.height = Math.max(1, Math.round(img.naturalHeight * sc));
    const ctx = cv.getContext('2d'); if (!ctx) continue;
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const b = await new Promise(r => { try { cv.toBlob(r, 'image/jpeg', .75); } catch (e) { r(null); } });
    cv.width = cv.height = 0;
    if (b && b.size) return b;
  }
  // último recurso: a própria foto, se já for JPEG e não for enorme
  if (/jpe?g/i.test(arq.type) && arq.size < 8e6) return arq;
  throw new Error('não foi possível reduzir a foto');
}
const URLS = new Map();   // caminho/fid -> objectURL
async function urlFoto(f) {
  const k = f.fid || f.caminho; if (URLS.has(k)) return URLS.get(k);
  let u = null;
  if (f.fid) { const b = await idbGet('blobs', f.fid); if (b) u = URL.createObjectURL(b); }
  if (!u && f.caminho && navigator.onLine) { try { u = await NV.blobUrl(f.caminho); } catch (e) { u = null; } }
  if (u) URLS.set(k, u); return u;
}
function pintarFotos(raiz) {
  (raiz || document).querySelectorAll('img[data-foto]').forEach(async img => {
    if (img.dataset.ok) return; img.dataset.ok = '1';
    const f = JSON.parse(img.dataset.foto); const u = await urlFoto(f);
    if (u) { img.src = u; img.hidden = false; const ph = img.parentElement.querySelector('.ph'); if (ph) ph.hidden = true; }
  });
}
// foto aberta em tela cheia: pinça amplia, um dedo arrasta a foto ampliada, toque fecha

/* ======================= marcar na foto: seta, círculo, retângulo, traço e texto ======================= */
// x = foto nova { blob, url, orig?, formas? }; o original fica guardado para poder marcar de novo
const ANOT_CORES = ['#e3241b', '#f5c400', '#1e88e5', '#ffffff', '#111111'];
const ANOT_FERR = [['seta', 'Seta', '<path d="M4 20 19 5M19 5h-8M19 5v8"/>'], ['circ', 'Círculo', '<ellipse cx="12" cy="12" rx="9" ry="7"/>'], ['ret', 'Retângulo', '<rect x="3.5" y="5.5" width="17" height="13" rx="1"/>'],
  ['livre', 'Traço livre', '<path d="M3 17c3-6 6 2 9-4s5-4 9-7"/>'], ['texto', 'Texto', '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>']];
function editarFoto(x) {
  return new Promise(async fim => {
    if (!x.orig) x.orig = x.blob;
    const formas = (x.formas || []).map(f => JSON.parse(JSON.stringify(f)));
    let ferr = 'seta', cor = ANOT_CORES[0], atual = null;
    const box = document.createElement('div'); box.className = 'anot'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Marcar na foto');
    box.innerHTML = `<div class="an-top"><button type="button" class="btn ghost" data-a="cancelar">Cancelar</button><b>Marcar na foto</b><button type="button" class="btn" data-a="ok">Pronto</button></div>
      <div class="an-area"><canvas></canvas></div>
      <div class="an-bar"><div class="an-ferr">${ANOT_FERR.map(([k, r, ic]) => `<button type="button" data-f="${k}" aria-pressed="${k === ferr}" title="${r}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic}</svg><span>${r.split(' ')[0]}</span></button>`).join('')}</div>
        <div class="an-cores">${ANOT_CORES.map(c => `<button type="button" data-c="${c}" aria-pressed="${c === cor}" style="--c:${c}" aria-label="Cor"></button>`).join('')}<button type="button" class="an-desf" data-a="desfazer" title="Desfazer">↶ Desfazer</button></div>
        <p class="an-dica">Arraste sobre a foto para marcar. No Texto, toque onde quer escrever.</p></div>`;
    document.body.appendChild(box);
    const cv = box.querySelector('canvas'), ctx = cv.getContext('2d');
    const url = URL.createObjectURL(x.orig); const img = new Image();
    try { await new Promise((r, j) => { img.onload = r; img.onerror = j; img.src = url; }); }
    catch (e) { box.remove(); URL.revokeObjectURL(url); toast('Não foi possível abrir a foto.'); fim(false); return; }
    cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    const lw = Math.max(4, Math.round(Math.max(cv.width, cv.height) / 140));
    const fonte = Math.max(18, Math.round(Math.max(cv.width, cv.height) / 26));
    const escuro = c => ['#ffffff', '#f5c400'].includes(c);
    function forma(f) {
      ctx.save(); ctx.strokeStyle = f.c; ctx.fillStyle = f.c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = lw;
      if (f.t === 'seta') { const [x1, y1] = f.a, [x2, y2] = f.b, ang = Math.atan2(y2 - y1, x2 - x1), h = lw * 4.5;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(x2 - h * Math.cos(ang - .45), y2 - h * Math.sin(ang - .45)); ctx.lineTo(x2 - h * Math.cos(ang + .45), y2 - h * Math.sin(ang + .45)); ctx.closePath(); ctx.fill(); }
      else if (f.t === 'circ') { ctx.beginPath(); ctx.ellipse((f.a[0] + f.b[0]) / 2, (f.a[1] + f.b[1]) / 2, Math.max(2, Math.abs(f.b[0] - f.a[0]) / 2), Math.max(2, Math.abs(f.b[1] - f.a[1]) / 2), 0, 0, Math.PI * 2); ctx.stroke(); }
      else if (f.t === 'ret') { ctx.strokeRect(Math.min(f.a[0], f.b[0]), Math.min(f.a[1], f.b[1]), Math.abs(f.b[0] - f.a[0]), Math.abs(f.b[1] - f.a[1])); }
      else if (f.t === 'livre') { ctx.beginPath(); f.p.forEach(([px, py], i) => i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.stroke(); }
      else if (f.t === 'texto') {
        ctx.font = `700 ${fonte}px system-ui, -apple-system, sans-serif`; ctx.textBaseline = 'top';
        const linhas = String(f.s).split('\n'), pad = fonte * .35, w = Math.max(...linhas.map(l => ctx.measureText(l).width)) + pad * 2, hh = linhas.length * fonte * 1.2 + pad * 1.6;
        const bx = Math.min(Math.max(0, f.a[0] - w / 2), cv.width - w), by = Math.min(Math.max(0, f.a[1] - hh / 2), cv.height - hh);
        ctx.fillRect(bx, by, w, hh); ctx.shadowBlur = 0; ctx.fillStyle = escuro(f.c) ? '#111' : '#fff';
        linhas.forEach((l, i) => ctx.fillText(l, bx + pad, by + pad * .8 + i * fonte * 1.2));
      }
      ctx.restore();
    }
    const pintar = () => { ctx.drawImage(img, 0, 0); formas.forEach(forma); if (atual) forma(atual); };
    pintar();
    const pos = ev => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) * cv.width / r.width, (ev.clientY - r.top) * cv.height / r.height]; };
    cv.addEventListener('pointerdown', ev => {
      ev.preventDefault(); const p = pos(ev);
      if (ferr === 'texto') {
        const s = (prompt('Texto para escrever na foto:') || '').trim(); if (s) { formas.push({ t: 'texto', a: p, s, c: cor }); pintar(); } return; }
      cv.setPointerCapture(ev.pointerId);
      atual = ferr === 'livre' ? { t: 'livre', p: [p], c: cor } : { t: ferr, a: p, b: p, c: cor };
    });
    cv.addEventListener('pointermove', ev => { if (!atual) return; const p = pos(ev); if (atual.t === 'livre') atual.p.push(p); else atual.b = p; pintar(); });
    const solta = () => { if (!atual) return; const f = atual; atual = null;
      const util = f.t === 'livre' ? f.p.length > 2 : Math.hypot(f.b[0] - f.a[0], f.b[1] - f.a[1]) > lw * 2;
      if (util) formas.push(f); pintar(); };
    cv.addEventListener('pointerup', solta); cv.addEventListener('pointercancel', solta);
    const sair = ok => { box.remove(); URL.revokeObjectURL(url); cv.width = cv.height = 0; fim(ok); };
    box.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { ferr = b.dataset.f; box.querySelectorAll('[data-f]').forEach(z => z.setAttribute('aria-pressed', String(z === b))); });
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cor = b.dataset.c; box.querySelectorAll('[data-c]').forEach(z => z.setAttribute('aria-pressed', String(z === b))); });
    box.querySelector('[data-a="desfazer"]').onclick = () => { formas.pop(); pintar(); };
    box.querySelector('[data-a="cancelar"]').onclick = () => sair(false);
    box.querySelector('[data-a="ok"]').onclick = async () => {
      if (!formas.length) { x.formas = []; if (x.blob !== x.orig) { URL.revokeObjectURL(x.url); x.blob = x.orig; x.url = URL.createObjectURL(x.orig); } sair(true); return; }
      pintar(); const b = await new Promise(r => { try { cv.toBlob(r, 'image/jpeg', .85); } catch (e) { r(null); } });
      if (!b) { toast('Não foi possível salvar a marcação. Tente de novo.'); return; }
      URL.revokeObjectURL(x.url); x.blob = b; x.url = URL.createObjectURL(b); x.formas = formas; sair(true);
    };
  });
}

async function enviarFotos(op) {

    if (b) { const { error } = await sb.storage.from((window.MAPA_CONFIG || {}).bucket || 'arquivos').upload(caminho, b, { contentType: 'image/jpeg', upsert: false }); if (error && !jaExiste(error)) throw error; }

    if (e2 && !jaExiste(e2)) throw e2;

// banco ainda sem as colunas novas (falta rodar banco.sql): envia sem elas
const semEquipe = e => /equipe|responsavel/i.test((e && e.message) || '');

async function executar(op) {

      let { error } = await sb.from('pendencias').insert(row);
      for (let k = 0; k < 2 && error && semEquipe(error); k++) { tiraNovas(row, error); ({ error } = await sb.from('pendencias').insert(row)); }
      if (error && !jaExiste(error)) throw error; op.criada = true; await idbPut('fila', op.k, op); }
    await enviarFotos(op);
  } else if (op.op === 'fotos') await enviarFotos(op);
  else if (op.op === 'editar') { const c = Object.assign({}, op.campos); let { error } = await sb.from('pendencias').update(c).eq('id', op.id);
    for (let k = 0; k < 2 && error && semEquipe(error); k++) { tiraNovas(c, error); ({ error } = await sb.from('pendencias').update(c).eq('id', op.id)); } if (error) throw error; }
  else if (op.op === 'status') { const { error } = await sb.rpc('pendencia_mudar', { p_id: op.id, p_para: op.para, p_comentario: op.comentario || null }); if (error) throw error; }
  else if (op.op === 'comentario') { const { error } = await sb.rpc('pendencia_comentar', { p_id: op.id, p_texto: op.texto }); if (error) throw error; }
  else if (op.op === 'excluir') {
    // vai para a lixeira (30 dias); sem a lixeira no banco, apaga de vez como antes
    const { error } = await sb.rpc('pendencia_excluir', { p_id: op.id });
    if (error && !/pendencia_excluir|function|schema cache/i.test(error.message || '')) throw error;
    if (error) {
      const p = PEND.find(x => x.id === op.id);
      const { error: e2 } = await sb.from('pendencias').delete().eq('id', op.id); if (e2) throw e2;
      const cam = ((p && p.pendencia_fotos) || []).map(f => f.caminho); if (cam.length) sb.storage.from('arquivos').remove(cam).catch(() => {});
    }
  }
}
async function sincronizar() {
  if (sincronizando || !navigator.onLine || !FILA.length) { status(); return; }
  sincronizando = true; status();
  let mudou = false; const travadas = new Set();
  try {
    for (const op of FILA.slice()) {
      if (travadas.has(op.id)) continue;   // uma operação com erro segura as seguintes da mesma pendência
      try { delete op.erro; await executar(op); await idbDel('fila', op.k); mudou = true; }
      catch (e) {
        if (semRede(e)) break;
        op.erro = (e && e.message) || 'erro'; await idbPut('fila', op.k, op); travadas.add(op.id); console.warn('envio', op, e);
      }
    }
  } finally { sincronizando = false; }
  await carregarFila();
  if (mudou) { try { await carregarServidor(); } catch (e) { console.warn(e); } }
  render(); reabrirDetalhe();
}

const COR_ST = { avaliacao: '#6a5acd', aberta: '#c23b2f', em_correcao: '#b86e00', corrigida: '#2f6fb0', fechada: '#23804a' };
// pins: [{u, v, cor, id, rot}] com u, v de 0 a 1 sobre a imagem
// pav: nome da planta do IFC (plantaDe(pavimento))
function plantaBox(pav, pins, marcavel) {
  const pl = PLANTAS[pav]; if (!pl) return '';
  // marcavel: true = toque marca o local; 'ficha' = só mostra, já aproximado no alfinete
  const ficha = marcavel === 'ficha'; if (ficha) marcavel = false;
  return `<div class="pl" data-pav="${esc(pav)}"><div class="pl-sc"><div class="pl-in${marcavel ? ' marca' : ''}${ficha ? ' ficha' : ''}" style="width:100%">
      <img alt="Planta" data-planta="${esc(pav)}" draggable="false">
      ${pins.map(p => `<span class="pin" style="left:${(p.u * 100).toFixed(3)}%;top:${(p.v * 100).toFixed(3)}%;--c:${p.cor}" ${p.id ? `data-pin="${esc(p.id)}" role="button" tabindex="0"` : ''} title="${esc(p.tit || p.rot || '')}">${p.rot ? `<b>${esc(p.rot)}</b>` : ''}</span>`).join('')}
    </div></div>
    <div class="pl-bar"><button type="button" class="btn sm ghost" data-z="-" aria-label="Diminuir">−</button><button type="button" class="btn sm ghost" data-z="+" aria-label="Aumentar">+</button>${marcavel ? '<span class="muted">Toque na planta para marcar o local.</span>' : ''}</div></div>`;
}
async function pintarPlantas(raiz) {
  for (const img of raiz.querySelectorAll('img[data-planta]')) {
    const u = await urlPlanta(PLANTAS[img.dataset.planta]);
    if (u) img.src = u; else { const pl = img.closest('.pl'); if (pl) pl.innerHTML = '<p class="muted" style="margin:0">Planta indisponível sem sinal (abra com internet uma vez).</p>'; }
  }
  raiz.querySelectorAll('.pl').forEach(pl => { const inn = pl.querySelector('.pl-in'); if (!inn) return;
    // pinça: amplia a planta em volta do ponto entre os dedos
    const scx = pl.querySelector('.pl-sc');
    if (window.AppObra && AppObra.pinca && scx && !scx.dataset.pincaOk) { scx.dataset.pincaOk = '1'; AppObra.pinca(scx, (k, x, y) => {
      const w = parseFloat(inn.style.width) || 100, nw = Math.max(100, Math.min(500, w * k)); if (nw === w) return;
      const r = scx.getBoundingClientRect(), px = x - r.left, py = y - r.top, fx = (scx.scrollLeft + px) / scx.scrollWidth, fy = (scx.scrollTop + py) / scx.scrollHeight;
      inn.style.width = nw + '%'; scx.scrollLeft = fx * scx.scrollWidth - px; scx.scrollTop = fy * scx.scrollHeight - py; }); }
    pl.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { const w = parseFloat(inn.style.width) || 100; const sc = pl.querySelector('.pl-sc'); const cx = (sc.scrollLeft + sc.clientWidth / 2) / sc.scrollWidth, cy = (sc.scrollTop + sc.clientHeight / 2) / sc.scrollHeight;
      inn.style.width = Math.max(100, Math.min(500, w * (b.dataset.z === '+' ? 1.6 : 1 / 1.6))) + '%';
      requestAnimationFrame(() => { sc.scrollLeft = cx * sc.scrollWidth - sc.clientWidth / 2; sc.scrollTop = cy * sc.scrollHeight - sc.clientHeight / 2; }); });
    // abre já aproximado no alfinete (ficha)
    const pin = inn.querySelector('.pin'); if (pin && inn.classList.contains('ficha')) {
      inn.style.width = '220%'; const img = inn.querySelector('img');
      const centra = () => { const sc = pl.querySelector('.pl-sc'); sc.scrollLeft = pin.offsetLeft - sc.clientWidth / 2; sc.scrollTop = pin.offsetTop - sc.clientHeight / 2; };
      if (img.complete) requestAnimationFrame(centra); else img.addEventListener('load', centra, { once: true }); }
  });
}
const uvParaXY = (pl, u, v) => [+(pl.bb[0] + u * (pl.bb[2] - pl.bb[0])).toFixed(3), +(pl.bb[3] - v * (pl.bb[3] - pl.bb[1])).toFixed(3)];

// encaminhar: quem avalia abre a pendência "em avaliação" para escolher quem corrige e encaminhar
function formPend(id, encaminhar) {
  const ed = id ? itens().find(p => p.id === id) : null;
  if (ed && !editor(ed)) return;
  // a Segurança vê os tipos de segurança (se a lista tiver algum); os outros perfis veem todos
  const segTipos = LO.ativos(L.problema).filter(t => ehSegTipo(t.valor));
  const tiposOk = perfil() === 'seguranca' && segTipos.length ? segTipos : LO.ativos(L.problema);
  const f = ed ? clone(ed) : { pavimento: '', local_tipo: '', unidade: '', comodo: '', tipo: tiposOk.length === 1 ? tiposOk[0].valor : '', disciplina: '', equipe: '', prioridade: '', descricao: '', causador: '', bloqueios: [], prazo: '', observacoes: '' };
  if (!ed && f.tipo) f.disciplina = ((L.problema.find(x => x.valor === f.tipo) || {}).extra || {}).disciplina || '';
  if (f.disciplina === A_DEFINIR) f.disciplina = '';
  // de segurança do trabalho? (a Segurança registra sempre como de segurança)
  f.seg = ed ? !!ed.seguranca : perfil() === 'seguranca' || ehSegTipo(f.tipo);
  // como o formulário funciona:
  //   'sugestao': quem é de campo sugere (a Engenharia avalia; ofício opcional)

  // quem vai corrigir: '' = não escolhido, '*' = todos do cargo, ou o id do funcionário

        <div class="fotos">${(ed ? ed.fotos.filter(x => x.tipo === 'antes') : []).map(x => `<span class="ft"><img data-zoom alt="Foto" data-foto='${esc(JSON.stringify(x))}' hidden></span>`).join('')}${novas.map((x, i) => `<span class="ft"><img data-zoom alt="Foto nova" src="${x.url}"><button type="button" data-rm="${i}" aria-label="Remover foto">×</button><button type="button" class="ft-ed" data-ed="${i}">✏️ Marcar</button></span>`).join('')}</div>${novas.length ? '<p class="muted" style="margin:0">Toque em <b>✏️ Marcar</b> para circular, apontar com seta ou escrever na foto.</p>' : ''}

async function gerarRelFoto(arr, o, prog) {

  const AZUL = [16, 58, 92], CINZA = [96, 110, 122], TINTA = [20, 30, 40];
  const quando = new Date(); const dataTxt = fmtD(iso(quando));

  const ordPav = n => { const i = CFG.pavimentos.findIndex(x => x.nome === n); return i < 0 ? 999 : i; };
  arr = arr.slice().sort((a, b) => ordPav(a.pavimento) - ordPav(b.pavimento) || (a.numero || 1e9) - (b.numero || 1e9));
  let logoInfo = null; if (o.logo) { const im = new Image(); await new Promise(r => { im.onload = r; im.onerror = r; im.src = o.logo; }); if (im.naturalWidth) logoInfo = { d: o.logo, r: im.naturalWidth / im.naturalHeight }; }
  // cabeçalho de cada página; devolve onde começa o conteúdo
  const cab = () => {
    let y = 8;
    if (logoInfo) { let h = 22, w = h * logoInfo.r; if (w > 80) { w = 80; h = w / logoInfo.r; } pdf.addImage(logoInfo.d, 'PNG', (W - w) / 2, y + (22 - h) / 2, w, h); y += 25; }
    else { pdf.setFont('helvetica', 'bold'); pdf.setFontSize(15); pdf.setTextColor(...AZUL); pdf.text(String(OBRA_NOME), W / 2, y + 12, { align: 'center' }); y += 18; }
    pdf.setFillColor(...AZUL); pdf.rect(M - 3, y, W - 2 * M + 6, 1.4, 'F'); y += 9;
    pdf.setTextColor(...TINTA); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(12.5); pdf.text(o.tit.toUpperCase(), W / 2, y, { align: 'center' }); y += 8;
    const linha = (rot, val, yy) => { pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9.5); pdf.text(rot, M, yy); const w0 = pdf.getTextWidth(rot + ' '); pdf.setFont('helvetica', 'normal');
      const ls = pdf.splitTextToSize(String(val), W - 2 * M - w0 - (rot === 'Obra:' ? 40 : 0)); pdf.text(ls, M + w0, yy); return ls.length; };
    linha('Obra:', OBRA_NOME, y);
    pdf.setFont('helvetica', 'bold'); const dw = pdf.getTextWidth(dataTxt); pdf.setFont('helvetica', 'normal'); pdf.text(dataTxt, W - M, y, { align: 'right' }); pdf.setFont('helvetica', 'bold'); pdf.text('Data:', W - M - dw - 1.5, y, { align: 'right' });
    y += 6;
    if (o.end) { y += (linha('Endereço:', o.end, y) - 1) * 4.2 + 6; }
    if (o.obj) { y += (linha('Objeto:', o.obj, y) - 1) * 4.2 + 6; }
    return y + 4;
  };
  const rodape = (pag, tot) => { pdf.setFillColor(...AZUL); pdf.rect(M - 3, H - 14, W - 2 * M + 6, 1.4, 'F');
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.5); pdf.setTextColor(...CINZA);
    pdf.text('Gerado em ' + fmtDH(quando.toISOString()) + ' por ' + nomeDe(NV.usuario.email), M, H - 9); pdf.text('Página ' + pag + ' de ' + tot, W - M, H - 9, { align: 'right' }); };
  // monta as "células": cada foto da pendência é uma célula; pendência sem foto também ganha uma
  const celulas = []; let n = 0;
  for (const p of arr) {
    n++; prog('Preparando ' + n + ' de ' + arr.length + '…', n / arr.length * .8);
    const fotos = p.fotos.filter(f => f.tipo === 'antes').concat(o.depois ? p.fotos.filter(f => f.tipo === 'depois') : []);
    const ims = [];
    for (const f of fotos) { const im = await fotoParaPdf(f, 1000).catch(() => null); if (im) ims.push(Object.assign(im, { tipo: f.tipo })); }
    if (o.planta) { const pl = await plantaParaPdf(p).catch(() => null); if (pl) ims.push(pl); }
    const tit = n + '. ' + rotLocal(p) + ' - ' + (String(p.descricao || '').trim() || p.tipo);
    const info = [(p.numero ? 'Pendência #' + p.numero : 'Pendência') + ' · ' + p.tipo + ' · ' + PRI[p.prioridade][0] + ' · ' + ST[p.status],
      [p.prazo && p.status !== 'fechada' ? (vencida(p) ? 'Venceu em ' : 'Prazo ') + fmtD(p.prazo) : '', p.disciplina && p.disciplina !== A_DEFINIR ? 'Corrige: ' + [p.disciplina, rotQuemCorrige(p)].filter(Boolean).join(' – ') : ''].filter(Boolean).join(' · ')].filter(Boolean);
    if (!ims.length) celulas.push({ tit, info, im: null });
    ims.forEach((im, i) => celulas.push({ tit: tit + (i ? ' (' + (im.tipo === 'depois' ? 'depois' : im.tipo === 'planta' ? 'local na planta' : i + 1) + ')' : ''), info: i ? [] : info, im }));
  }
  // 2 colunas × 2 linhas por página
  const CW = (W - 2 * M - 10) / 2, FH = 80;
  let pag = 0, y0 = 0, i = 0;
  while (i < celulas.length) {
    if (pag) pdf.addPage(); pag++; y0 = cab();
    const alt = (H - 18 - y0) / 2;
    for (let lin = 0; lin < 2 && i < celulas.length; lin++) {
      for (let col = 0; col < 2 && i < celulas.length; col++, i++) {
        const c = celulas[i], x = M + col * (CW + 10), yt = y0 + lin * alt;
        pdf.setTextColor(...TINTA); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10);
        const lt = pdf.splitTextToSize(c.tit, CW).slice(0, 2); pdf.text(lt, x + CW / 2, yt + 4, { align: 'center' });
        const yf = yt + 4 + lt.length * 4.4, hf = Math.min(FH, alt - (yf - yt) - 12);
        if (c.im) { const r = c.im.w / c.im.h; let w = CW, h = w / r; if (h > hf) { h = hf; w = h * r; } pdf.addImage(c.im.d, 'JPEG', x + (CW - w) / 2, yf, w, h); }
        else { pdf.setDrawColor(200, 207, 213); pdf.setLineDashPattern([1.5, 1.5], 0); pdf.rect(x + CW * .15, yf, CW * .7, Math.min(30, hf)); pdf.setLineDashPattern([], 0); pdf.setFontSize(8.5); pdf.setTextColor(...CINZA); pdf.text('sem foto', x + CW / 2, yf + Math.min(30, hf) / 2 + 1, { align: 'center' }); }
        if (c.info.length) { pdf.setFontSize(7.8); pdf.setTextColor(...CINZA); let yi = yf + (c.im ? Math.min(hf, (CW / (c.im.w / c.im.h))) : Math.min(30, hf)) + 4;
          for (const l of c.info) { const ls = pdf.splitTextToSize(l, CW).slice(0, 2); pdf.text(ls, x + CW / 2, yi, { align: 'center' }); yi += ls.length * 3.4; } }
      }
    }
    prog('Montando a página ' + pag + '…', .8 + .2 * i / celulas.length);
  }
  const tot = pdf.getNumberOfPages(); for (let k = 1; k <= tot; k++) { pdf.setPage(k); rodape(k, tot); }
  const nome = 'Relatorio_' + String(OBRA_NOME).replace(/[^\wÀ-ú]+/g, '_') + '_' + hoje().replace(/-/g, '') + '.pdf';
  const b = pdf.output('blob'); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}

// planta inteira do pavimento, com o alfinete no local (para o relatório individual)
async function plantaInteira(p) {
  const pl = p.ponto && PLANTAS[p.ponto.pav]; if (!pl) return null;
  const u = await urlPlanta(pl); if (!u) return { erro: true };
  const img = new Image(); await new Promise(r => { img.onload = r; img.onerror = r; img.src = u; }); if (!img.naturalWidth) return { erro: true };
  const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)); const cv = document.createElement('canvas');
  cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc); const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
  const px = p.ponto.u * cv.width, py = p.ponto.v * cv.height, rr = Math.max(9, cv.width / 70);

}
// junta tudo o que o relatório precisa de uma pendência, com as imagens já carregadas
async function prepararPend(p, comPlanta, contar) {

  const antes = p.fotos.filter(f => f.tipo === 'antes').sort(ord), depois = p.fotos.filter(f => f.tipo === 'depois').sort(ord);
  // o que vale é o que aconteceu depois da última reabertura ou reprovação
  const evs = (p.eventos || []).slice().sort(ord); let ini = 0;
  evs.forEach((e, i) => { if (e.acao === 'status' && e.para === 'aberta' && (e.de === 'corrigida' || e.de === 'fechada')) ini = i + 1; });
  const depoisDe = evs.slice(ini);
  const cor = depoisDe.filter(e => e.para === 'corrigida').pop(), fec = depoisDe.filter(e => e.para === 'fechada').pop();
  const desc = String(p.descricao || '').trim(), descTitulo = desc && desc.length <= 90 && !desc.includes('\n');

}
async function gerarRelPadrao(modelo, arr, o, prog) {
  if (!window.RelatorioPDF) throw new Error('o módulo de relatório não carregou; recarregue a página');
  const ordPav = n => { const i = CFG.pavimentos.findIndex(x => x.nome === n); return i < 0 ? 999 : i; };
  arr = arr.slice().sort((a, b) => ordPav(a.pavimento) - ordPav(b.pavimento) || (a.numero || 1e9) - (b.numero || 1e9));
  let falhas = 0; const dados = [];
  for (let i = 0; i < arr.length; i++) { prog('Carregando fotos ' + (i + 1) + ' de ' + arr.length + '…', i / arr.length * .9); dados.push(await prepararPend(arr[i], modelo === 'individual', () => falhas++)); }
  let logo = null; if (o.logo) { const im = new Image(); await new Promise(r => { im.onload = r; im.onerror = r; im.src = o.logo; }); if (im.naturalWidth) logo = { d: o.logo, r: im.naturalWidth / im.naturalHeight, tipo: /^data:image\/jpe?g/.test(o.logo) ? 'JPEG' : 'PNG' }; }
  prog('Montando o PDF…', .95);
  const { pdf, layout } = RelatorioPDF.gerar(modelo, dados, { obra: OBRA_NOME, endereco: o.endereco, empresa: o.empresa, logo, emissao: fmtD(hoje()), resumo: o.resumo });
  const nome = 'Pendencias_' + (modelo === 'individual' ? 'individual' : 'consolidado') + '_' + String(OBRA_NOME).replace(/[^\wÀ-ú]+/g, '_') + (arr.length === 1 && arr[0].numero ? '_' + arr[0].numero : '') + '_' + hoje().replace(/-/g, '') + '.pdf';
  const b = pdf.output('blob'); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
  window.__ultimoRelatorio = { modelo, layout, paginas: pdf.getNumberOfPages() };   // para conferir as posições nos testes
  return { falhas, layout };
}

async function fotoParaPdf(f, lado) {
  const u = await urlFoto(f); if (!u) return null;
  const img = new Image(); await new Promise(r => { img.onload = r; img.onerror = r; img.src = u; }); if (!img.naturalWidth) return null;
  const sc = Math.min(1, (lado || 700) / Math.max(img.naturalWidth, img.naturalHeight)); const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); const d = cv.toDataURL('image/jpeg', .8); cv.width = cv.height = 0; return { d, w: Math.round(img.naturalWidth * sc), h: Math.round(img.naturalHeight * sc) };
}
// recorte da planta em volta do local marcado, com o alfinete
async function plantaParaPdf(p) {
  const pl = p.ponto && PLANTAS[p.ponto.pav]; if (!pl) return null;
  const u = await urlPlanta(pl); if (!u) return null;
  const img = new Image(); await new Promise(r => { img.onload = r; img.onerror = r; img.src = u; }); if (!img.naturalWidth) return null;
  const W = img.naturalWidth, H = img.naturalHeight, lado = Math.max(260, Math.min(W, H) * .45);
  const cx = p.ponto.u * W, cy = p.ponto.v * H; const x0 = Math.max(0, Math.min(W - lado, cx - lado / 2)), y0 = Math.max(0, Math.min(H - lado * .7, cy - lado * .35));
  const cw = Math.min(lado, W), ch = Math.min(lado * .7, H);
  const cv = document.createElement('canvas'); cv.width = 600; cv.height = Math.round(600 * ch / cw); const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, x0, y0, cw, ch, 0, 0, cv.width, cv.height);
  const px = (cx - x0) / cw * cv.width, py = (cy - y0) / ch * cv.height;
  g.fillStyle = COR_ST[p.status] || '#c23b2f'; g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.arc(px, py - 16, 12, 0, Math.PI * 2); g.moveTo(px - 9, py - 8); g.lineTo(px, py); g.lineTo(px + 9, py - 8); g.fill(); g.stroke();
  g.strokeStyle = '#8a949c'; g.lineWidth = 2; g.strokeRect(1, 1, cv.width - 2, cv.height - 2);
  return { d: cv.toDataURL('image/jpeg', .85), w: cv.width, h: cv.height, tipo: 'planta' };
}
async function gerarPdf(arr, g, stTxt, comFotos, prog) {
  const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', compress: true }); const W = 210, H = 297, M = 14;
  const quem = nomeDe(NV.usuario.email), quando = fmtDH(new Date().toISOString());
  let y = 0, pag = 0;
  const cab = () => { pag++; pdf.setFillColor(34, 66, 92); pdf.rect(0, 0, W, 16, 'F'); pdf.setTextColor(255); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(12); pdf.text('Pendências de obra · ' + OBRA_NOME, M, 10.5);
    pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8); pdf.text('Gerado em ' + quando + ' por ' + quem + ' · página ' + pag, W - M, 10.5, { align: 'right' }); pdf.setTextColor(20, 34, 46); y = 24; };
  const precisa = h => { if (y + h > H - 12) { pdf.addPage(); cab(); } };
  const linhas = (t, w, sz) => { pdf.setFontSize(sz); return pdf.splitTextToSize(String(t || ''), w); };
  cab();
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(15); pdf.text('Relatório de pendências', M, y); y += 6;
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(9.5); pdf.setTextColor(90, 107, 120);
  pdf.text('Status: ' + stTxt + ' · agrupado por ' + GRUPOS[g].toLowerCase() + ' · ' + arr.length + ' pendência' + (arr.length > 1 ? 's' : '') + ' · ' + arr.filter(vencida).length + ' vencida(s)', M, y); y += 8; pdf.setTextColor(20, 34, 46);
  const grupos = new Map(); for (const p of arr) { const k = p[g] || '—'; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(p); }
  const ordemG = g === 'pavimento' ? CFG.pavimentos.map(x => x.nome).filter(n => grupos.has(n)).concat([...grupos.keys()].filter(k => !CFG.pavimentos.some(x => x.nome === k))) : [...grupos.keys()].sort();
  let n = 0;
  for (const k of ordemG) {
    const lst = grupos.get(k).sort((a, b) => ST_ORD.indexOf(a.status) - ST_ORD.indexOf(b.status) || PRI_ORD.indexOf(a.prioridade) - PRI_ORD.indexOf(b.prioridade) || (a.numero || 0) - (b.numero || 0));
    precisa(14); pdf.setFillColor(220, 235, 242); pdf.rect(M, y - 5, W - 2 * M, 8, 'F'); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11.5); pdf.text(k + ' (' + lst.length + ')', M + 2, y + 0.5); y += 8;
    for (const p of lst) {
      n++; prog('Montando ' + n + ' de ' + arr.length + '…', n / arr.length);
      const info = [['Local', rotLocal(p)], ['Tipo', p.tipo], ['Corrige', rotResp(p)], ['Prioridade', PRI[p.prioridade][0] + (p.prazo ? ' · prazo ' + fmtD(p.prazo) + (vencida(p) ? ' (VENCIDA)' : '') : '')],
        ['Descrição', p.descricao || '—'], ['Trava', (p.bloqueios || []).map(b => b.servico + (b.local ? ' (' + b.local + ')' : '')).join('; ') || '—'], ['Observações', p.observacoes || '']].filter(x => x[1]);
      const ls = info.map(([a, b]) => linhas(b, W - 2 * M - 30, 9));
      let fimgs = [];
      { const pl = await plantaParaPdf(p).catch(() => null); if (pl) fimgs.push(pl); }
      if (comFotos) { const sel = p.fotos.filter(f => f.tipo === 'antes').slice(0, 3).concat(p.fotos.filter(f => f.tipo === 'depois').slice(0, 3));
        for (const f of sel) { const im = await fotoParaPdf(f).catch(() => null); if (im) fimgs.push(Object.assign(im, { tipo: f.tipo })); } }
      const hTxt = 7 + ls.reduce((s, l) => s + l.length * 4, 0); const hFt = fimgs.length ? 46 : 0;
      precisa(Math.min(hTxt + hFt + 4, H - 40));
      pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11); pdf.text((p.numero ? '#' + p.numero : 'nº pendente') + '  ·  ' + ST[p.status], M, y);
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5); pdf.setTextColor(90, 107, 120); pdf.text('Registrada em ' + fmtDH(p.criado_em) + ' por ' + nomeDe(p.criado_por), W - M, y, { align: 'right' }); pdf.setTextColor(20, 34, 46); y += 5.5;
      info.forEach(([a], i) => { precisa(ls[i].length * 4 + 1); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9); pdf.text(a + ':', M, y); pdf.setFont('helvetica', 'normal'); pdf.text(ls[i], M + 30, y); y += ls[i].length * 4; });
      if (fimgs.length) { precisa(46); let x = M; const hh = 40;
        for (const im of fimgs) { const r = im.w / im.h; let w = hh * r, h = hh; if (w > 54) { w = 54; h = 54 / r; } if (x + w > W - M) break; pdf.addImage(im.d, 'JPEG', x, y + 1, w, h); pdf.setFontSize(7.5); pdf.setTextColor(90, 107, 120); pdf.text(im.tipo === 'antes' ? 'Antes' : im.tipo === 'planta' ? 'Local (' + p.ponto.pav + ')' : 'Depois', x, y + hh + 4); pdf.setTextColor(20, 34, 46); x += w + 3; }
        y += hh + 6; }
      pdf.setDrawColor(211, 220, 227); pdf.line(M, y, W - M, y); y += 5;
    }
  }
  const nome = 'Pendencias_' + String(OBRA_NOME).replace(/[^\wÀ-ú]+/g, '_') + '_' + hoje().replace(/-/g, '') + '.pdf';
  const b = pdf.output('blob'); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}

/* ---------------- avisos (notificações neste aparelho) ---------------- */
const VAPID = (window.MAPA_CONFIG || {}).vapidPublica || '';
const b64u8 = s => { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function registroSW() { if (!('serviceWorker' in navigator)) return null; try { return await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 4000))]); } catch (e) { return null; } }
async function estadoAvisos() {
  if (!VAPID || !('Notification' in window) || !('PushManager' in window)) return { st: 'sem', reg: null };
  const reg = await registroSW(); if (!reg) return { st: 'sem', reg: null };
  const sub = await reg.pushManager.getSubscription().catch(() => null);
  return { st: sub ? 'ativo' : Notification.permission === 'denied' ? 'negado' : 'inativo', reg, sub };
}
async function marcarAvisos() { const e = await estadoAvisos(); $('bAvisos').innerHTML = 'Notificações' + (e.st === 'ativo' ? '<span class="mo-est">Ligadas</span>' : e.st === 'sem' ? '' : '<span class="mo-est off">Desligadas</span>'); }
async function formAvisos() {
  const ios = window.AppObra && AppObra.ehIOS, inst = window.AppObra && AppObra.instalado();
  openSheet('Avisos neste aparelho', '<p class="muted" style="margin:0">Verificando…</p>', '<button class="btn ghost" id="avC" type="button">Fechar</button>');
  $('avC').onclick = closeSheet;
  const e = await estadoAvisos();
  const pf = perfil();
  const oque = pf === 'campo' ? 'quando houver pendência nova ou reprovada nos seus ofícios, quando a Engenharia avaliar a sua sugestão, e um aviso diário das vencidas.'
    : pf === 'engenharia' || pf === 'admin' ? 'quando chegar uma sugestão para avaliar, quando uma pendência for marcada como corrigida, e um resumo diário (com as vencidas) às 8h.'

    : 'de pendências só nos perfis que trabalham nelas (o seu perfil é Consulta).';
  let corpo = `<p style="margin:0">Você recebe um aviso ${oque}</p>`;
  if (ios && !inst) corpo += `<div class="aviso">No iPhone, os avisos só funcionam com o app na Tela de Início: no Safari, toque em <b>Compartilhar</b> (o quadrado com a seta) → <b>Adicionar à Tela de Início</b>. Depois abra o painel pelo ícone novo e ative os avisos aqui.</div>`;
  else if (e.st === 'sem') corpo += '<div class="aviso">Este navegador não aceita avisos. No Android e no computador, use o Chrome ou o Edge.</div>';
  else if (e.st === 'negado') corpo += '<div class="aviso">Os avisos estão bloqueados para este site. Libere nas configurações do navegador (ícone de cadeado ao lado do endereço → Notificações → Permitir) e volte aqui.</div>';
  else corpo += `<p style="margin:0"><b>Situação:</b> ${e.st === 'ativo' ? '<span class="pill st-fechada">ligados neste aparelho</span>' : '<span class="pill st-aberta">desligados neste aparelho</span>'}</p>`;
  if (!inst && !ios) corpo += '<p class="muted" style="margin:0">Dica: instale o painel como app (botão “Instalar app” no topo, ou menu do navegador → Instalar) para abrir direto pelo ícone.</p>';
  $('ovlB').innerHTML = corpo;
  const pode = e.st === 'ativo' || e.st === 'inativo';
  $('ovlF').innerHTML = `<span class="msg" id="avMsg"></span><button class="btn ghost" id="avC" type="button">Fechar</button>${pode && e.st === 'ativo' ? '<button class="btn ghost" id="avOff" type="button">Desligar</button><button class="btn" id="avTeste" type="button">Enviar teste</button>' : ''}${pode && e.st === 'inativo' ? '<button class="btn" id="avOn" type="button">Ligar avisos</button>' : ''}`;
  $('avC').onclick = closeSheet;
  const msg = (t, ok) => { $('avMsg').className = 'msg ' + (ok ? 'ok' : 'err'); $('avMsg').textContent = t; };
  if ($('avOn')) $('avOn').onclick = async () => {
    $('avOn').disabled = true;
    try {
      const perm = await Notification.requestPermission(); if (perm !== 'granted') { msg('Permissão não concedida.'); $('avOn').disabled = false; return; }

      const j = sub.toJSON();
      const { error } = await sb.rpc('push_registrar', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_ua: navigator.userAgent });
      if (error) { await sub.unsubscribe().catch(() => {}); throw error; }

  };

      const { data: { session } } = await sb.auth.getSession();

      const r = await fetch(base + '/functions/v1/notificar', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: C.supabaseAnonKey, Authorization: 'Bearer ' + (session && session.access_token) },
        body: JSON.stringify({ tipo: 'teste', site: location.href.replace(/[^/]*$/, '') + 'pendencias.html?obra=' + encodeURIComponent(OBRA) }) });
      const j = await r.json().catch(() => ({}));
