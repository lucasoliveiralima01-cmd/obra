<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Planejamento da obra: médio prazo e PCP lidos do PDF, o que fazer em cada semana e dia, erros no planejamento, histórico e frentes de trabalho.">
<meta name="theme-color" content="#22425c">
<title>Planejamento</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-apple.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Obra"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icones/planejamento.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
/* cores e fontes comuns: estilo.css; aqui só as desta página */
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px var(--f-body);-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* faixa da marca */
.brand{background:var(--navy);color:var(--brand-ink);position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:min(46%,560px);background:var(--petrol);clip-path:polygon(64px 0,100% 0,100% 100%,0 100%);z-index:0}
.brand-in{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1240px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px))}
.logo{display:block;color:inherit}
.logo img{height:40px;width:40px;display:block}
.ttl{display:grid;border-left:1px solid rgba(255,255,255,.25);padding-left:16px;min-width:0}
.ttl h1{font:700 1.35rem/1.1 var(--f-disp);margin:0}
.ttl .obra{font-size:.82rem;color:#d4e4ee}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:6px 11px;font:600 .82rem var(--f-body);display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none}
.hbtn:hover{background:rgba(255,255,255,.2)}

main{max-width:1240px;margin:0 auto;padding:14px 16px 24px;display:grid;gap:14px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.86rem;color:var(--muted)}
.crumbs a{font-weight:600;text-decoration:none;color:var(--accent)} .crumbs a:hover{text-decoration:underline}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:8px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 18px;font:700 .92rem var(--f-body);color:var(--ink)}
.tab:hover{border-color:var(--accent)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab b{font-family:var(--f-body);margin-left:4px;opacity:.85}
.muted{color:var(--muted);font-size:.88rem}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:7px;padding:8px 14px;font:600 .9rem var(--f-body);white-space:nowrap}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--accent);font:600 .88rem var(--f-body);padding:4px 2px}
.lnk:hover{text-decoration:underline}

/* avisos no topo */
.alertas{display:grid;gap:8px}
.alerta{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bad-soft);border:1px solid var(--bad);border-radius:var(--r);padding:10px 12px;color:var(--ink)}
.alerta.info{background:var(--warn-soft);border-color:var(--warn)}
.alerta .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;font:700 .9rem var(--f-body)}
.alerta.info .ic{background:var(--warn)}
.alerta b{font-weight:700}
.alerta small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}

/* filtros */
.filtros{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.busca{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 11px;color:var(--muted);min-height:40px}
.busca input{flex:1;border:0;background:none;outline:0;padding:9px 0;min-width:0;color:var(--ink)}
.fsel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:500 .88rem var(--f-body);min-height:40px;max-width:100%}
.fsel.on{border-color:var(--accent);background:var(--accent-soft)}
.chip{background:none;border:1px solid var(--line);border-radius:16px;padding:6px 11px;font:500 .84rem var(--f-body);color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}

/* lista */
.grupo{display:grid;gap:8px}
.grupo>h2{margin:4px 0 0;font:700 1rem var(--f-disp);color:var(--muted);letter-spacing:.02em}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.card{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%;color:inherit;transition:border-color .12s,background .12s}
.card:hover{border-color:var(--accent);background:var(--accent-soft)}
.card.falta{border-left-color:var(--bad)} .card.ok{border-left-color:var(--ok)} .card.sol{border-left-color:var(--warn)}
.c-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.c-loc{font-size:.8rem;color:var(--muted)}
.c-tit{font:700 1rem/1.25 var(--f-body);overflow-wrap:anywhere}
.st{flex:none;font:600 .74rem var(--f-body);padding:2px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st-solicitada{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.st-aprovada{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.st-executada,.st-conferida{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.st-cancelada{text-decoration:line-through}
.svs{display:flex;flex-wrap:wrap;gap:5px}
.sv{font:600 .76rem var(--f-body);padding:2px 8px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.sv.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sv.falta{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.vazio{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.vazio h3{margin:0;font:700 1.15rem var(--f-disp)}

/* frentes */
.fr-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table.fr{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem}
table.fr th,table.fr td{padding:6px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);text-align:center;vertical-align:middle}
table.fr th{font:700 .8rem var(--f-disp);color:var(--muted);background:var(--panel);position:sticky;top:0}
table.fr th:first-child,table.fr td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);font-weight:600;min-width:120px;z-index:1}
.fc{display:grid;gap:2px;justify-items:center;width:100%;min-width:104px;background:none;border:1px solid transparent;border-radius:7px;padding:6px 4px;color:inherit}
.fc:hover{border-color:var(--accent);background:var(--accent-soft)}
.fc .s{font:600 .76rem var(--f-body);padding:1px 7px;border-radius:10px}
.fc .d{font-size:.74rem;color:var(--muted)}
.s-lib{background:var(--ok-soft);color:var(--ok)} .s-sol{background:var(--warn-soft);color:var(--warn)} .s-falta{background:var(--bad-soft);color:var(--bad)} .s-pronta{background:var(--accent-soft);color:var(--accent)} .s-nada{color:var(--muted)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}

/* botão flutuante */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--accent);color:var(--accent-ink);border:0;border-radius:28px;padding:14px 20px;font:700 1rem var(--f-body);box-shadow:0 8px 24px rgba(0,0,0,.28)}

/* janelas */
.overlay{position:fixed;inset:0;background:rgba(6,20,30,.5);display:grid;place-items:center;padding:12px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:calc(100dvh - 24px);display:grid;grid-template-rows:auto 1fr auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.sheet>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet>header h3{margin:0;font:700 1.2rem var(--f-disp);flex:1}
.sheet>header .x{background:none;border:1px solid var(--line);border-radius:8px;min-width:36px;height:36px;font-size:1.2rem;line-height:1;color:var(--ink)}
.sheet .body{overflow:auto;padding:14px 16px;display:grid;gap:14px;align-content:start}
.sheet>footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.sheet>footer:not(:has(.btn)){display:none}
.fld{display:grid;gap:5px}
.fld>label,.fld>.l{font:600 .72rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.req{color:var(--bad)}
.fld input:not([type=file]):not([type=checkbox]),.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
.fld textarea{min-height:64px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:600 .86rem var(--f-body);color:var(--ink);min-height:36px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.92rem}
.msg{font-size:.86rem;margin-right:auto}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.itens{display:grid;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:start;border:1px solid var(--line);border-radius:9px;padding:8px}
.item textarea{grid-column:1/-1;min-height:46px}
.item select,.item textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:100%;min-width:0}
.arqs{display:flex;flex-wrap:wrap;gap:8px}
.arq{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:var(--muted);text-align:center;padding:4px}
.arq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.arq .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:24px;height:24px;line-height:22px;padding:0}
.addarq{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:8px;padding:9px 13px;font:600 .9rem var(--f-body);color:var(--ink);cursor:pointer}
.addarq input{display:none}
/* ficha */
.fi-tit{margin:0;font:700 1.4rem/1.2 var(--f-disp);overflow-wrap:anywhere}
.fi-loc{margin:0;font:600 .98rem var(--f-body);color:var(--accent)}
.fi-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.86rem;color:var(--muted)}
.fi-desc{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.fi h4{margin:0;font:700 1.02rem var(--f-disp)}
.svc{display:grid;gap:6px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:9px;padding:10px 12px}
.svc.ok{border-left-color:var(--ok)} .svc.falta{border-left-color:var(--bad)}
.svc .h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between}
.svc .h b{font:700 .98rem var(--f-body)}
.svc .ins{margin:0;font-weight:600;white-space:pre-wrap}
.svc .ci{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.svc .ci.ok{color:var(--ok)} .svc .ci.falta{color:var(--bad)}
.viewer .vx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(20,30,40,.72);color:#fff;font:400 1.7rem/1 var(--f-body);display:grid;place-items:center;padding:0 0 3px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.viewer .vx:hover{background:rgba(20,30,40,.92)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:grid;place-items:center;padding:10px}
.viewer img{max-width:calc(100vw - 20px);max-height:calc(100dvh - 20px);object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 15px;border-radius:8px;font-size:.88rem;z-index:50;max-width:calc(100% - 32px)}
@media (max-width:640px){
  .brand::after{display:none}
  .ttl{border-left:0;padding-left:0}
  .hctl{width:auto;margin-left:auto;order:2}
  #bQuem{display:none}
  .lista{grid-template-columns:1fr}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
  .tabs{display:grid}
  .overlay{padding:0;place-items:end stretch}
  .sheet{border-radius:14px 14px 0 0;max-height:94dvh;width:100%}
  .item{grid-template-columns:1fr auto}
  .item select:nth-of-type(2){grid-column:1/2}
}
/* planejamento */
main>*,#tabBody>*{min-width:0}
.filtros .fsel{min-width:0;flex:1 1 150px;text-overflow:ellipsis}
.topo{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.topo .muted{flex:1 1 240px}
.tabs .seg{flex-wrap:wrap}
.tab.erro b{color:var(--bad)} .tab[aria-pressed="true"].erro b{color:#fff}
.semnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.semnav h2{margin:0;font:700 1.15rem var(--f-disp);flex:1;min-width:180px}
.semnav .btn{min-width:40px}
.secao{display:grid;gap:8px}
.secao>h3{margin:4px 0 0;font:700 1rem var(--f-disp);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.secao>h3 small{font:500 .82rem var(--f-body);color:var(--muted)}
.dias{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.dia{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px;align-content:start}
.dia.hoje{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dia>h4{margin:0;font:700 .98rem var(--f-disp);display:flex;justify-content:space-between;gap:8px}
.dia>h4 small{font:600 .74rem var(--f-body);color:var(--accent)}
.dia .sub{font:600 .7rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.vz{font-size:.84rem;color:var(--muted)}
.at{display:grid;grid-template-columns:5.6rem minmax(0,1fr) auto;gap:1px 8px;align-items:start;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:6px 9px;color:inherit;font-size:.84rem;line-height:1.25}
.at:hover{border-color:var(--accent)}
.at .mk{font:700 .72rem var(--f-body);padding:2px 6px;border-radius:6px;align-self:start;white-space:nowrap;text-align:center;justify-self:stretch}
.at>.sit{align-self:start;justify-self:stretch;text-align:center;padding:2px 3px;white-space:normal;font-size:.7rem}
@media (max-width:640px){.at .tg{grid-column:2/-1;grid-row:3;white-space:normal}}
.atw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:stretch}
.ck{border:1px solid var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:8px;min-width:40px;font:700 1.1rem var(--f-body);padding:0 8px}
.ck:hover{background:var(--ok);color:#fff}
.avw{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:9px;padding:9px 11px}
.avw.erro{border-left-color:var(--bad)} .avw.ajuste,.avw.ok{border-left-color:var(--accent)}
.avw .ac{display:flex;flex-wrap:wrap;gap:6px}
.avw p{margin:0;font-size:.88rem} .avw b{font-weight:700}
.toast .tb{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;margin-left:10px;padding:0}
.at .mk.ini{background:var(--accent-soft);color:var(--accent)} .at .mk.fim{background:var(--ok-soft);color:var(--ok)} .at .mk.pcp{background:var(--bg);color:var(--muted);border:1px solid var(--line)} .at .mk.and{background:var(--warn-soft);color:var(--warn)} .at .mk.atr{background:var(--bad-soft);color:var(--bad)}
.at b{font-weight:600;overflow-wrap:break-word;hyphens:auto}
.lst{display:grid;gap:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips .chip{flex:none}
.chip .n{font-weight:700;margin-left:4px;color:var(--accent)}
.chip[aria-pressed="true"] .n{color:inherit}
.chip.hj{border-color:var(--accent)}
details.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
details.box>summary{cursor:pointer;font:700 .95rem var(--f-disp);display:flex;gap:8px;align-items:center;list-style:none}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.box[open]>summary::before{transform:rotate(90deg)}
details.box>summary small{font:500 .8rem var(--f-body);color:var(--muted)}
details.box>.lst{margin-top:8px}
details.box.atr{border-left:4px solid var(--bad)}
details.box.atr>summary b{color:var(--bad)}
.at small{grid-column:2/-1;color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.at .tg{font-size:.74rem;color:var(--muted);white-space:nowrap}
.at.c-ini{border-left-color:var(--accent)} .at.c-and{border-left-color:var(--warn)} .at.c-fim{border-left-color:var(--ok)}
.secao>h3 .pt{width:10px;height:10px;border-radius:50%;display:inline-block;align-self:center}
.pt.ini{background:var(--accent)} .pt.and{background:var(--warn)} .pt.fim{background:var(--ok)} .pt.atr{background:var(--bad)}
.at.atr{border-left-color:var(--bad)} .at.err{border-left-color:var(--bad)} .at.at2{border-left-color:var(--warn)} .at.ok{border-left-color:var(--ok)}
.flags{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px}
.fl{font:600 .72rem var(--f-body);padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.fl.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)} .fl.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)} .fl.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)} .fl.info{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.notas{display:grid;gap:5px}
.nota{background:#fff6d6;border:1px solid #f0d77a;color:#5a4500;border-radius:7px;padding:6px 9px;font:600 .8rem var(--f-body)}
:root[data-theme="dark"] .nota{background:#3a3214;border-color:#7a6620;color:#f3e3a3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nota{background:#3a3214;border-color:#7a6620;color:#f3e3a3}}

<script>
/* =====================================================================
   Planejamento da obra
   - Médio prazo e PCP (plano semanal) vêm do PDF do planejamento: a Engenharia
     anexa cada versão nova, revisa o que o sistema não reconheceu e importa.
   - Semana: o que começa, termina e está no PCP em cada dia, o que preparar
     para a semana seguinte e o que está atrasado.
   - Médio prazo: todas as atividades, com situação, avisos de cada disciplina,
     histórico de datas (reprogramações) e ligação com serviço e pavimento.
   - Frentes de trabalho (serviço × pavimento): a data prevista vem do
     planejamento; a liberação depende do "Estou ciente" das Modificações.
   - Revisar: erros encontrados no planejamento (datas trocadas, ano errado,
     fora da sequência, ordem entre serviços).
   Quem vê e quem importa: banco.sql, passo 23.
   ===================================================================== */
(function () {
'use strict';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t, ms, acao) { const el = $('toast'); el.textContent = t; if (acao) { const b = document.createElement('button'); b.type = 'button'; b.className = 'tb'; b.textContent = acao[0]; b.onclick = () => { el.hidden = true; acao[1](); }; el.appendChild(b); } el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms || 4000); }
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const hoje = () => iso(new Date());
const dt = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const somaDias = (s, n) => { const x = dt(s); x.setDate(x.getDate() + n); return iso(x); };
const difDias = (a, b) => Math.round((dt(b) - dt(a)) / 864e5);
const segunda = s => { const x = dt(s); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return iso(x); };
const fmtD = s => { if (!s) return '—'; const [y, m, d] = String(s).slice(0, 10).split('-'); return d + '/' + m + '/' + y; };
const fmtDs = s => { if (!s) return ''; const [, m, d] = String(s).slice(0, 10).split('-'); return d + '/' + m; };
const fmtDH = s => { if (!s) return '—'; const d = new Date(s); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const DSEM = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const LO = window.ListasObra, PP = window.PlanoPDF, norm = PP.norm;
const PAV_PADRAO = ['Térreo', 'Pavimento 02', 'Pavimento 03', 'Pavimento 04', 'Pavimento 05', 'Pavimento 06', 'Cobertura'].map(n => ({ nome: n, unidades: [] }));
const AVISO_DIAS = 7;
const nPers = n => n + ' modifica' + (n > 1 ? 'ções' : 'ção');
const plural = (n, s, p) => n + ' ' + (n === 1 ? s : (p || s + 's'));

let NV = null, sb = null, OBRA = null, OBRA_NOME = '';
let L = { servico: [] }, CFG = { pavimentos: [] };
let VERS = [], ATV = [], HIST = null, PCP = [], MAPA = { servico: {}, local: {}, aviso: {} }, FRENTES = [], PERS = [];
let TAB = 'semana', SEM = segunda(hoje()), COLS_EXTRA = [];
const F = { q: '', grupo: '', pav: '', sit: '' };

const edita = () => NV && ['admin', 'engenharia'].includes(NV.perfil);
const ativos = t => LO.ativos(L[t] || []).map(x => x.valor);
const pavNomes = () => CFG.pavimentos.map(x => x.nome);
const nomeDe = e => NV && NV.pessoas ? NV.pessoas.nome(e) : String(e || 'alguém').split('@')[0];
const erroMsg = e => String((e && (e.message || e.error_description)) || e).replace(/^.*?:\s*(?=Falta|Só|Você|O PDF)/, '');
const ultimaMP = () => VERS.find(v => v.tipo === 'mp') || null;

/* ---------------- dados ---------------- */
async function carregar() {
  const [lp, lc, lo, lv, la, lm] = await Promise.all([
    sb.from('pend_listas').select('tipo,valor,ordem,extra').order('ordem'),
    sb.from('pend_config').select('pavimentos,listas').eq('obra', OBRA).maybeSingle(),
    NV.obras.obter(OBRA),
    sb.from('plan_versoes').select('*').eq('obra', OBRA).order('criado_em', { ascending: false }),
    sb.from('plan_atividades').select('*').eq('obra', OBRA),
    sb.from('plan_mapa').select('*').eq('obra', OBRA)
  ]);
  if (lv.error) { const e = new Error(lv.error.message); e.banco = /plan_|relation|schema cache/i.test(lv.error.message || ''); throw e; }
  if (!lo) { const e = new Error('obra não encontrada'); e.naoTem = true; throw e; }
  const c = (lc && lc.data) || {};
  L = LO.efetivas(LO.deTabela(lp.data || []), c.listas || null);
  CFG = { pavimentos: (c.pavimentos && c.pavimentos.length) ? c.pavimentos : PAV_PADRAO };
  OBRA_NOME = lo.nome; VERS = lv.data || []; ATV = la.data || [];
  MAPA = { servico: {}, local: {}, aviso: {} }; (lm.data || []).forEach(m => { if (MAPA[m.tipo]) MAPA[m.tipo][m.origem] = m.destino; });
  // PCP: a versão mais nova de cada semana (as 8 últimas semanas)
  const semanas = new Map(); VERS.filter(v => v.tipo === 'pcp').forEach(v => { if (!semanas.has(v.referencia)) semanas.set(v.referencia, v); });
  const ids = [...semanas.values()].slice(0, 8).map(v => v.id);
  const [lpc, lfr, lpe] = await Promise.all([
    ids.length ? sb.from('plan_pcp').select('*').in('versao', ids).order('ordem') : Promise.resolve({ data: [] }),
    sb.from('frentes').select('*').eq('obra', OBRA),
    sb.from('personalizacoes').select('*, pers_ciencias(*)').eq('obra', OBRA)
  ]);
  PCP = (lpc.data || []).map(i => Object.assign(i, { v: VERS.find(v => v.id === i.versao) }));
  FRENTES = lfr.error ? [] : (lfr.data || []); PERS = lpe.error ? [] : (lpe.data || []);
  HIST = null; AV_CACHE = null;
}
async function recarregar() { try { await carregar(); render(); } catch (e) { toast('Não foi possível atualizar: ' + (e.message || e)); } }
document.addEventListener('visibilitychange', () => { if (!document.hidden && NV && $('ovl').hidden) recarregar(); });

/* ---------------- situação de uma atividade (sempre em relação a hoje) ---------------- */
function situacao(a) {
  const h = hoje(), si = segunda(h), sf = somaDias(si, 4), ini = a.inicio, fim = a.termino;
  if (a.concluida) return ['conc', 'Concluída'];
  if (!ini && !fim) return ['nd', 'Sem data'];
  if (fim && uFim(fim) < h) return ['atr', 'Atrasada'];
  const i0 = ini || fim, f0 = fim || ini;
  if (i0 <= h && f0 >= h) return ['and', 'Em andamento'];
  if (i0 <= sf && f0 >= si) return ['sem', 'Esta semana'];
  if (i0 <= somaDias(h, 21)) return ['prox', 'Próximas'];
  return ['mais', 'Mais adiante'];
}
const rotAtv = a => a.atividade + (a.local ? ' · ' + a.local : '');
const datas = a => { if (a.inicio && a.termino) { const n = duracaoUtil(a); return fmtDs(a.inicio) + ' → ' + fmtDs(a.termino) + (n ? ' · ' + n + (n === 1 ? ' dia útil' : ' dias úteis') : ''); }
  return a.termino ? 'até ' + fmtDs(a.termino) : a.inicio ? 'de ' + fmtDs(a.inicio) : 'sem data'; };

/* ---------------- erros e pontos de atenção do planejamento ---------------- */
// regras de ordem entre serviços no mesmo pavimento (antes → depois). estrita: o seguinte não pode começar antes de o anterior terminar
const ORDEM = [
  [/DRYWALL ESTRUTURA/, /DRYWALL PLAQUEAMENTO/, false], [/DRYWALL PLAQUEAMENTO/, /DRYWALL FITAMENTO/, false],
  [/HIDRAULICA DRYWALL/, /DRYWALL PLAQUEAMENTO/, false], [/ELETRICA DRYWALL/, /DRYWALL PLAQUEAMENTO/, false],
  [/DRYWALL FITAMENTO/, /^PINTURA$/, false], [/IMPERMEABILIZACAO E MURETA BOX/, /^CERAMICA$/, true],
  [/PREPARACAO PARA IMPERMEABILIZACAO/, /IMPERMEABILIZACAO COM MANTA/, true], [/IMPERMEABILIZACAO COM MANTA/, /PROTECAO MECANICA|CONTRAPISO SOBRE IMPERMEABILIZACAO/, true]
];
const chLocal = r => (r.pavimentos && r.pavimentos.length ? r.pavimentos.join('+') : norm(r.local).replace(/[º°]/g, '').replace(/^(\d+)$/, n => String(+n)));
function verificar(linhas, ref) {
  const A = []; const nome = r => r.atividade + (r.local ? ' · ' + r.local : '');
  const add = (nivel, r, txt, tipo) => A.push({ nivel, tipo, chave: r ? r.chave : null, grupo: r ? r.grupo : '', item: r ? nome(r) : '', txt });
  for (const r of linhas) {
    if (!r.atividade || /^\(SEM DESCRICAO\)$/.test(norm(r.atividade))) add('erro', r, 'Linha sem descrição' + (r.terminoTxt || r.inicioTxt ? ' (data "' + (r.inicioTxt || r.terminoTxt) + '")' : '') + '.', 'vazia');
    if (r.inicioTxt && !r.inicio) add('erro', r, 'Início "' + r.inicioTxt + '" não é uma data.', 'data');
    if (r.terminoTxt && !r.termino) add('erro', r, 'Término "' + r.terminoTxt + '" não é uma data.', 'data');
    if (r.inicio && r.termino && r.termino < r.inicio) add('erro', r, 'Termina (' + fmtD(r.termino) + ') antes de começar (' + fmtD(r.inicio) + ').', 'inverso');
    // começar e terminar só em dia útil (o período pode ter fim de semana no meio)
    const FDS = { 6: 'sábado', 0: 'domingo' };
    if (r.inicio && FDS[dt(r.inicio).getDay()] != null) add('erro', r, 'Início ' + fmtD(r.inicio) + ' cai num ' + FDS[dt(r.inicio).getDay()] + ': a atividade tem que começar em dia útil; seria ' + fmtD(uIni(r.inicio)) + '?', 'fds');
    if (r.termino && FDS[dt(r.termino).getDay()] != null) add('erro', r, 'Término ' + fmtD(r.termino) + ' cai num ' + FDS[dt(r.termino).getDay()] + ': a atividade tem que terminar em dia útil; seria ' + fmtD(uFim(r.termino)) + '?', 'fds');
  }
  // mesma atividade em vários pavimentos: ano trocado e fora da sequência
  const porAtv = new Map(); linhas.forEach(r => { if (!r.atividade) return; const k = norm(r.grupo) + '|' + norm(r.atividade); if (!porAtv.has(k)) porAtv.set(k, []); porAtv.get(k).push(r); });
  for (const G of porAtv.values()) {
    const ds = G.map(r => r.inicio || r.termino).filter(Boolean).sort(); if (ds.length < 3) continue;
    const med = ds[ds.length >> 1];
    for (const r of G) for (const c of ['inicio', 'termino']) { const d = r[c]; if (!d) continue;
      const off = Math.abs(difDias(med, d)); if (off < 240) continue;
      const y = +d.slice(0, 4), alt = [y - 1, y + 1].map(n => n + d.slice(4)).find(x => Math.abs(difDias(med, x)) < 120);
      if (alt) add('erro', r, (c === 'inicio' ? 'Início' : 'Término') + ' ' + fmtD(d) + ': provável ano errado (as outras ficam perto de ' + fmtD(med) + '; seria ' + fmtD(alt) + '?).', 'ano'); }
    if (G.length >= 4) {
      const v = G.filter(r => r.inicio && !A.some(x => x.chave === r.chave && x.tipo === 'ano'));
      let sobe = 0; for (let i = 1; i < v.length; i++) if (v[i].inicio >= v[i - 1].inicio) sobe++;
      if (v.length >= 4 && sobe / (v.length - 1) >= 0.6) for (let i = 1; i < v.length; i++) if (difDias(v[i].inicio, v[i - 1].inicio) > 14)
        add('atencao', v[i], 'Fora da sequência: começa em ' + fmtD(v[i].inicio) + ', antes de ' + v[i - 1].local + ' (' + fmtD(v[i - 1].inicio) + '), que vem antes na lista.', 'seq');
    }
  }
  // ordem entre serviços no mesmo pavimento
  for (const [pa, pb, estrita] of ORDEM) {
    const As = linhas.filter(r => pa.test(norm(r.atividade)) && !r.concluida), Bs = linhas.filter(r => pb.test(norm(r.atividade)) && !r.concluida);
    for (const b of Bs) { const a = As.find(x => chLocal(x) === chLocal(b)); if (!a || !b.inicio) continue;
      const aIni = a.inicio; if (!aIni) continue;
      if (b.inicio < aIni) add('erro', b, 'Começa (' + fmtD(b.inicio) + ') antes de "' + a.atividade + '" no mesmo local (' + fmtD(aIni) + ').', 'ordem');
      else if (estrita && a.termino && b.inicio <= a.termino) add('atencao', b, 'Começa (' + fmtD(b.inicio) + ') antes de terminar "' + a.atividade + '" (' + fmtD(a.termino) + ').', 'ordem'); }
  }
  // repetida (mesma atividade e local duas vezes)
  const ch = new Map(); linhas.forEach(r => { const k = norm(r.grupo) + '|' + norm(r.atividade) + '|' + norm(r.local); ch.set(k, (ch.get(k) || 0) + 1); });
  for (const [k, n] of ch) if (n > 1) { const r = linhas.find(x => norm(x.grupo) + '|' + norm(x.atividade) + '|' + norm(x.local) === k); add('atencao', r, 'Aparece ' + n + ' vezes no planejamento.', 'dup'); }
  if (ref) for (const r of linhas) for (const c of ['inicio', 'termino']) if (r[c] && difDias(ref, r[c]) > 400 && !A.some(x => x.chave === r.chave && x.tipo === 'ano')) add('atencao', r, 'Data muito distante: ' + fmtD(r[c]) + '.', 'longe');
  return A;
}
// avisos calculados sobre as atividades como estão agora (depois de correções e conclusões no app),
// tirando os que a Engenharia já conferiu ("está certo")
const chaveAviso = x => (x.chave || '') + '|' + x.txt;
let AV_CACHE = null;
function avisosAtuais(todos) {
  if (!AV_CACHE) { const v = ultimaMP(); const at = ATV.filter(a => a.ativa);
    const L2 = verificar(at, v ? v.referencia : null);
    at.filter(a => a.ajuste).forEach(a => L2.push({ nivel: 'ajuste', tipo: 'ajuste', chave: a.chave, grupo: a.grupo, item: rotAtv(a), txt: a.ajuste + ' → ' + datas(a) }));
    AV_CACHE = L2; }
  return todos ? AV_CACHE : AV_CACHE.filter(x => x.nivel === 'ajuste' || !MAPA.aviso[chaveAviso(x)]);
}
const conferidos = () => (AV_CACHE || avisosAtuais(true)) && AV_CACHE.filter(x => x.nivel !== 'ajuste' && MAPA.aviso[chaveAviso(x)]);
const avisosDe = chave => avisosAtuais().filter(x => x.chave === chave);

/* ---------------- ligações: serviço, frentes, modificações, PCP ---------------- */
const frenteDe = (sv, pav) => FRENTES.find(f => f.servico === sv && f.pavimento === pav) || null;
const ciencia = (p, sv) => (p.pers_ciencias || []).find(c => c.servico === sv);
const persDaFrente = (sv, pav) => PERS.filter(p => p.pavimento === pav && ['aprovada', 'executada', 'conferida', 'solicitada'].includes(p.status) && (p.itens || []).some(i => i.servico === sv));
const faltasFrente = (sv, pav) => persDaFrente(sv, pav).filter(p => p.status === 'aprovada' && !ciencia(p, sv));
const atvsDaFrente = (sv, pav) => ATV.filter(a => a.ativa && a.servico === sv && (a.pavimentos || []).includes(pav)).sort((a, b) => String(a.inicio || a.termino || '9').localeCompare(String(b.inicio || b.termino || '9')));
// o que trava ou pede atenção numa atividade (para "o que preparar")
function bandeiras(a) {
  const f = [];
  if (a.servico) for (const pav of a.pavimentos || []) { const fa = faltasFrente(a.servico, pav), fr = frenteDe(a.servico, pav);
    if (fa.length) f.push(['bad', pav + ': falta ciência em ' + nPers(fa.length)]);
    else if (persDaFrente(a.servico, pav).length && !(fr && fr.liberada_em)) f.push(['warn', pav + ': frente a liberar']);
    else if (fr && fr.liberada_em) f.push(['ok', pav + ': frente liberada']); }
  const av = avisosDe(a.chave); if (av.some(x => x.nivel === 'erro')) f.push(['bad', 'erro no planejamento']); else if (av.length) f.push(['warn', 'conferir datas']);
  if (a.n_mudancas) f.push(['info', 'reprogramada ' + a.n_mudancas + '×']);
  if (!a.equipe) f.push(['warn', 'sem equipe']);
  return f;
}
const flagsHtml = a => { const f = bandeiras(a); return f.length ? `<span class="flags">${f.map(([k, t]) => `<span class="fl ${k}">${esc(t)}</span>`).join('')}</span>` : ''; };
// item do PCP → atividade do médio prazo (ligação feita à mão ou sugerida pelo texto, pavimento e semana)
const STOP = new Set(['PARA', 'COM', 'DOS', 'DAS', 'NOS', 'NAS', 'NOS', 'PAVIMENTO', 'ANDAR', 'PAV', 'APTO', 'TODOS', 'TODAS', 'DIAS', 'DIA', 'LADO', 'FACHADA', 'GERAL', 'PAVEI', 'EQUIPE', 'QUE', 'POR', 'SEM', 'AOS', 'UMA', 'TETO', 'PAREDE', 'PAREDES']);
const tokens = s => new Set(norm(s).replace(/[^A-Z0-9 ]/g, ' ').split(' ').filter(w => w.length >= 3 && !/^\d/.test(w) && !STOP.has(w)).map(w => w.replace(/(COES|CAO|MENTO|S)$/, '')));
function ligacaoPCP(it) {
  if (it.ligado === 'nenhum') return null;
  if (it.ligado === 'manual' && it.atividade) { const a = ATV.find(x => x.id === it.atividade); return a ? { a, auto: false } : null; }
  const v = it.v || {}; const ini = v.referencia, fim = v.proxima || (ini && somaDias(ini, 5));
  const pvs = PP.pavimentosNoTexto(it.texto, pavNomes()); const tk = tokens(it.texto + ' ' + it.frente);
  let best = null, bs = 1.5;
  for (const a of ATV) { if (!a.ativa || a.concluida) continue;
    const ai = a.inicio || a.termino, af = a.termino || a.inicio; if (ini && ai && (ai > fim || af < ini)) continue;
    const ta = tokens(a.atividade + ' ' + a.grupo); let s = 0; tk.forEach(w => { if (ta.has(w)) s++; });
    if (pvs.length) { if (!(a.pavimentos || []).some(p => pvs.includes(p))) continue; s += 1.5; }
    if (s > bs) { bs = s; best = a; } }

}

/* ---------------- Semana: a semana toda ou um dia + o que preparar ---------------- */
let DIA = null;   // null = semana toda; 0..4 = segunda..sexta (só os dias úteis)
const UTEIS = [0, 1, 2, 3, 4];
// dias úteis (segunda a sexta) entre duas datas: de a (exclusivo) até b (inclusivo)
// o médio prazo dá um período; o trabalho acontece nos dias úteis dentro dele:
// início no fim de semana → segunda seguinte; término no fim de semana → sexta anterior
const diaSem = d => dt(d).getDay();
const uIni = d => !d ? d : diaSem(d) === 6 ? somaDias(d, 2) : diaSem(d) === 0 ? somaDias(d, 1) : d;
const uFim = d => !d ? d : diaSem(d) === 6 ? somaDias(d, -1) : diaSem(d) === 0 ? somaDias(d, -2) : d;
const duracaoUtil = a => { const i = uIni(a.inicio), f = uFim(a.termino); return i && f && f >= i ? diasUteis(somaDias(i, -1), f) : null; };
function diasUteis(a, b) { let n = 0, d = a; while (d < b) { d = somaDias(d, 1); const w = dt(d).getDay(); if (w >= 1 && w <= 5) n++; } return n; }
function renderSemana() {
  const si = SEM, sf = somaDias(si, 4), sd = somaDias(si, 6), h = hoje(), prox = somaDias(si, 7), proxF = somaDias(si, 11);
  const at = ATV.filter(a => a.ativa && !a.concluida);
  const pcpSem = PCP.filter(i => i.v && i.v.referencia === si);

  const noDia = d => ({ ini: at.filter(a => a.inicio && uIni(a.inicio) === d), fim: at.filter(a => a.termino && uFim(a.termino) === d && !(a.inicio && uIni(a.inicio) === d)),
    and: at.filter(a => ini0(a) && ini0(a) < d && fim0(a) > d) });

  const cont = k => { const x = noDia(somaDias(si, k)); return x.ini.length + x.fim.length; };
  const blocoPCP = its => { const grp = new Map(); its.forEach(i => { const g = i.frente + (i.empresa && i.empresa !== i.frente ? ' · ' + i.empresa : ''); if (!grp.has(g)) grp.set(g, []); grp.get(g).push(i); });
    return [...grp.entries()].map(([g, L2]) => `<details class="box"${ab('pcp:' + g)}><summary>${esc(g)} <small>${plural(L2.length, 'item', 'itens')}</small></summary><div class="lst">${L2.map(pcpHtml).join('')}</div></details>`).join(''); };
  const sec = (cls, tit, L2, linha, vazio, sub) => `<section class="secao"><h3><span class="pt ${cls}"></span>${tit} <small>${L2.length}${sub ? ' · ' + sub : ''}</small></h3>${L2.length ? `<div class="lst">${L2.map(linha).join('')}</div>` : `<span class="vz">${vazio}</span>`}</section>`;
  const dd = d => { const k = difDias(si, d); return (k >= 0 && k <= 4 ? ['Seg', 'Ter', 'Qua', 'Qui', 'Sex'][k] + ' ' : '') + fmtDs(d); };
  let corpo;

    const fim = at.filter(a => a.termino && uFim(a.termino) >= si && uFim(a.termino) <= sf && !(a.inicio && uIni(a.inicio) >= si)).sort((a, b) => uFim(a.termino).localeCompare(uFim(b.termino)));
    const and = at.filter(a => ini0(a) && ini0(a) < si && fim0(a) > sf).sort((a, b) => fim0(a).localeCompare(fim0(b)));
    corpo = sec('ini', 'Começam nesta semana', ini, a => (atrasada(a) ? linhaCk : linhaAtv)(a, mk(a, 'ini', dd(uIni(a.inicio)))), 'Nada começa nesta semana.')
      + sec('and', 'Em execução a semana toda', and, a => linhaCk(a, mk(a, 'and', 'até ' + fmtDs(fim0(a)))), 'Nada em execução a semana toda.')

      + sec('and', 'Em execução', x.and, a => linhaCk(a, mk(a, 'and', 'até ' + fmtDs(fim0(a)))), 'Nada em execução neste dia.')

    ${corpo}

      ${prep.length ? `<div class="lst">${prep.map(a => linhaAtv(a, '<span class="mk ini">' + fmtDs(a.inicio) + '</span>')).join('')}</div>` : '<span class="vz">Nada começa na semana seguinte.</span>'}</details>
    <p class="muted" style="margin:0">Dias úteis de segunda a sexta: o período do médio prazo vale só nesses dias (término no sábado conta como sexta). ${pcpV ? `PCP importado em ${fmtDH(pcpV.criado_em)}.` : `Sem PCP desta semana.${edita() ? ' Importe o PDF do plano semanal para ver as tarefas de cada dia.' : ''}`}</p>`;

/* ---------------- Frentes (serviço × pavimento) ---------------- */
function servicosUsados() {
  const s = new Set(); PERS.forEach(p => p.status !== 'cancelada' && (p.itens || []).forEach(i => i.servico && s.add(i.servico)));
  FRENTES.forEach(f => s.add(f.servico)); ATV.forEach(a => a.ativa && a.servico && (a.pavimentos || []).length && s.add(a.servico)); COLS_EXTRA.forEach(x => s.add(x));
  const ord = ativos('servico'); return [...s].sort((a, b) => (ord.indexOf(a) < 0 ? 999 : ord.indexOf(a)) - (ord.indexOf(b) < 0 ? 999 : ord.indexOf(b)) || a.localeCompare(b));
}
function renderFrentes() {
  const svs = servicosUsados(), pavs = pavNomes().concat([...new Set(PERS.map(p => p.pavimento))].filter(n => !pavNomes().includes(n)));
  const resto = ativos('servico').filter(s => !svs.includes(s));
  if (!svs.length) { $('tabBody').innerHTML = `<div class="vazio"><h3>Nenhuma frente ainda</h3><p class="muted" style="margin:0">As colunas aparecem com os serviços ligados às atividades do planejamento e às modificações. Ligue as atividades aos serviços na importação do médio prazo.</p></div>`; return; }
  const cel = (sv, pav) => {
    const fr = frenteDe(sv, pav), ps = persDaFrente(sv, pav), fa = faltasFrente(sv, pav), as = atvsDaFrente(sv, pav).filter(a => !a.concluida);
    let s;
    if (fr && fr.liberada_em) s = `<span class="s s-lib">Liberada${fr.justificativa ? ' ⚠' : ''}</span><span class="d">${fmtDs(fr.liberada_em)}</span>`;
    else if (fa.length) s = `<span class="s s-falta">Falta ${fa.length} ciência${fa.length > 1 ? 's' : ''}</span>`;
    else if (ps.some(p => p.status !== 'solicitada')) s = `<span class="s s-pronta">Pronta para liberar</span>`;
    else if (ps.length) s = `<span class="s s-sol">Aguardando aprovação</span>`;
    else if (as.length) s = `<span class="s s-nada">${as.some(a => situacao(a)[0] === 'atr') ? '<b style="color:var(--bad)">atrasada</b>' : 'planejada'}</span>`;
    else s = `<span class="s s-nada">—</span>`;
    const a0 = as[0]; const prev = !(fr && fr.liberada_em) ? (a0 ? `<span class="d">${datas(a0)}</span>` : fr && fr.previsto ? `<span class="d">prev. ${fmtDs(fr.previsto)}</span>` : '') : '';
    return `<button type="button" class="fc" data-fr='${esc(JSON.stringify([sv, pav]))}'>${s}${prev}${ps.length ? `<span class="d">${nPers(ps.length)}</span>` : ''}</button>`;
  };
  $('tabBody').innerHTML = `<p class="muted" style="margin:0">Cada célula é um serviço num pavimento. As datas vêm do <b>médio prazo</b> (a 1ª atividade ainda não concluída). A frente só é <b>liberada</b> com o “Estou ciente” de todas as modificações daquele trecho.</p>
    <div class="fr-wrap"><table class="fr"><thead><tr><th>Pavimento</th>${svs.map(s => `<th>${esc(s)}</th>`).join('')}</tr></thead>
    <tbody>${pavs.map(pav => `<tr><td>${esc(pav)}</td>${svs.map(sv => `<td>${cel(sv, pav)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="leg"><span><span class="s s-lib" style="padding:1px 7px;border-radius:10px">Liberada</span> pode começar</span><span><span class="s s-falta" style="padding:1px 7px;border-radius:10px">Falta ciência</span> equipe ainda não confirmou</span><span><span class="s s-pronta" style="padding:1px 7px;border-radius:10px">Pronta</span> tudo confirmado, falta liberar</span><span>⚠ liberada com justificativa</span>
      ${edita() && resto.length ? `<select class="fsel" id="fAdd" style="margin-left:auto"><option value="">+ Acrescentar serviço…</option>${resto.map(s => `<option>${esc(s)}</option>`).join('')}</select>` : ''}</div>`;
  $('tabBody').querySelectorAll('[data-fr]').forEach(b => b.onclick = () => { const [s, p] = JSON.parse(b.dataset.fr); fichaFrente(s, p); });
  if ($('fAdd')) $('fAdd').onchange = e => { if (e.target.value) { COLS_EXTRA.push(e.target.value); renderFrentes(); } };
}
function fichaFrente(sv, pav) {
  const fr = frenteDe(sv, pav), ps = persDaFrente(sv, pav), fa = faltasFrente(sv, pav), lib = fr && fr.liberada_em, as = atvsDaFrente(sv, pav);
  const ST = { solicitada: 'Aguardando aprovação', aprovada: 'Aprovada', executada: 'Executada', conferida: 'Conferida' };
  openSheet(sv + ' · ' + pav, `<div style="display:grid;gap:12px">
    ${lib ? `<div class="alerta" style="background:var(--ok-soft);border-color:var(--ok)"><span class="ic" style="background:var(--ok)">✓</span><span><b>Frente liberada</b> em ${fmtDH(fr.liberada_em)} por ${esc(nomeDe(fr.liberada_por))}${fr.justificativa ? `<small>Liberada com ciência faltando. Justificativa: ${esc(fr.justificativa)}</small>` : ''}</span></div>`
      : fa.length ? `<div class="alerta"><span class="ic">!</span><span><b>Falta a ciência da equipe em ${nPers(fa.length)}.</b><small>Confirme com a equipe antes de liberar a frente.</small></span></div>` : ''}
    <h4 style="margin:0;font:700 1rem var(--f-disp)">No planejamento (${as.length})</h4>
    ${as.length ? as.map(a => { const [k, t] = situacao(a); return linhaAtv(a, `<span class="sit sit-${k}">${t}</span>`); }).join('') : `<div class="fld"><label for="frPrev">Data prevista para começar</label>${edita() && !lib ? `<input type="date" id="frPrev" value="${esc((fr && fr.previsto) || '')}">` : `<span>${fr && fr.previsto ? fmtD(fr.previsto) : '—'}</span>`}
      <span class="muted">Nenhuma atividade do médio prazo ligada a ${esc(sv)} neste pavimento. O aviso aparece ${AVISO_DIAS} dias antes, enquanto houver ciência faltando.</span></div>`}
    <h4 style="margin:0;font:700 1rem var(--f-disp)">Modificações neste trecho (${ps.length})</h4>
    ${ps.length ? ps.sort((a, b) => String(a.unidade).localeCompare(String(b.unidade), 'pt', { numeric: true })).map(p => { const i = (p.itens || []).find(x => x.servico === sv) || {}, c = ciencia(p, sv);
      const k = p.status === 'aprovada' ? (c ? 'ok' : 'falta') : '';
      return `<a class="svc ${k}" href="personalizacoes.html?obra=${encodeURIComponent(OBRA)}&p=${encodeURIComponent(p.id)}" style="text-decoration:none;color:inherit"><span class="h"><b>Apto ${esc(p.unidade)} · ${esc(p.titulo)}</b><span class="st st-${p.status}">${ST[p.status] || p.status}</span></span>
        ${i.instrucao ? `<span class="ins">${esc(i.instrucao)}</span>` : ''}<span class="ci ${k}">${c ? '✓ Ciente: ' + esc(nomeDe(c.por)) + ' · ' + fmtDH(c.em) : p.status === 'aprovada' ? 'Falta a ciência da equipe (' + esc(i.oficio || '') + ')' : p.status === 'solicitada' ? 'Ainda não aprovada' : ''}</span></a>`; }).join('')
      : '<p class="muted" style="margin:0">Nenhuma modificação afeta este serviço neste pavimento.</p>'}
    ${edita() && !lib && fa.length ? `<div class="fld"><label for="frJus">Liberar mesmo assim (justificativa)</label><textarea id="frJus" placeholder="Ex.: equipe avisada por telefone pelo mestre João"></textarea></div>` : ''}</div>`,
    edita() ? `<span class="msg" id="frMsg"></span>${lib ? '<button class="btn ghost danger" id="frDesf" type="button">Desfazer liberação</button>' : (as.length ? '' : '<button class="btn ghost" id="frSalvar" type="button">Salvar data</button>') + '<button class="btn ok" id="frLib" type="button">Liberar a frente</button>'}` : '');
  ligarCliques($('ovlB'));
  const msg = (t, ok) => { $('frMsg').className = 'msg ' + (ok ? 'ok' : 'err'); $('frMsg').textContent = t; };
  if ($('frSalvar')) $('frSalvar').onclick = async () => {
    const v = $('frPrev').value || null; const { error } = await sb.from('frentes').upsert({ obra: OBRA, servico: sv, pavimento: pav, previsto: v, atualizado_em: new Date().toISOString() }, { onConflict: 'obra,servico,pavimento' });
    if (error) { msg('Não foi possível: ' + erroMsg(error)); return; } toast('Data salva.'); closeSheet(); await recarregar(); };
  if ($('frLib')) $('frLib').onclick = async () => {
    const jus = $('frJus') ? $('frJus').value.trim() : '';
    if (fa.length && !jus) { msg('Falta a ciência da equipe. Para liberar mesmo assim, escreva a justificativa.'); $('frJus').focus(); return; }
    const { error } = await sb.rpc('frente_liberar', { p_obra: OBRA, p_servico: sv, p_pavimento: pav, p_justificativa: jus || null });
    if (error) { msg(erroMsg(error)); return; } toast('Frente liberada: ' + sv + ' · ' + pav + '.'); closeSheet(); await recarregar(); };
  if ($('frDesf')) $('frDesf').onclick = async () => { if (!confirm('Desfazer a liberação desta frente?')) return;
    const { error } = await sb.from('frentes').update({ liberada_em: null, liberada_por: null, justificativa: null }).eq('id', fr.id); if (error) { msg('Não foi possível: ' + erroMsg(error)); return; } closeSheet(); await recarregar(); };
}

/* ---------------- Revisar: erros e pontos de atenção ---------------- */
function avisoHtml(x, conf) {
  const a = x.chave && ATV.find(y => y.chave === x.chave);
  const k = encodeURIComponent(chaveAviso(x));
  return `<div class="avw ${conf ? 'ok' : x.nivel}"><p><b>${esc(x.item || x.grupo || '')}</b>${a && grupoUtil(a) ? ` <span class="muted">· ${esc(grupoUtil(a))}</span>` : ''}</p><p>${esc(x.txt)}</p>
    <div class="ac">${a ? `<button class="btn sm ghost" type="button" data-a="${esc(a.id)}">Abrir</button>` : ''}
      ${edita() && a && x.nivel !== 'ajuste' && !conf ? `<button class="btn sm" type="button" data-cor="${esc(a.id)}">Corrigir datas</button><button class="btn sm ghost" type="button" data-okav="${k}">Está certo</button>` : ''}
      ${edita() && conf ? `<button class="btn sm ghost" type="button" data-desav="${k}">Voltar a avisar</button>` : ''}</div></div>`;
}
function ligarAvisos(el) {
  ligarCliques(el);
  el.querySelectorAll('[data-cor]').forEach(b => b.onclick = () => corrigirDatas(b.dataset.cor));
  el.querySelectorAll('[data-okav]').forEach(b => b.onclick = () => marcarAviso(decodeURIComponent(b.dataset.okav), true));
  el.querySelectorAll('[data-desav]').forEach(b => b.onclick = () => marcarAviso(decodeURIComponent(b.dataset.desav), false));
}
async function marcarAviso(k, ok) {
  const r = ok ? await sb.from('plan_mapa').upsert({ obra: OBRA, tipo: 'aviso', origem: k, destino: true, atualizado_em: new Date().toISOString() }, { onConflict: 'obra,tipo,origem' })
    : await sb.from('plan_mapa').delete().eq('obra', OBRA).eq('tipo', 'aviso').eq('origem', k);
  if (r.error) { toast('Não foi possível: ' + erroMsg(r.error)); return; }
  if (ok) MAPA.aviso[k] = true; else delete MAPA.aviso[k];
  render(); toast(ok ? 'Aviso marcado como conferido.' : 'O aviso volta a aparecer.', 5000, ok ? ['Desfazer', () => marcarAviso(k, false)] : null);
}
function corrigirDatas(id) {

  openSheet('Corrigir datas', `<div style="display:grid;gap:12px"><p style="margin:0"><b>${esc(rotAtv(a))}</b><br><span class="muted">${esc(a.grupo || '')}</span></p>
    ${av.map(x => `<div class="nota" style="background:var(--bad-soft);border-color:var(--bad);color:var(--ink)">${esc(x.txt)}</div>`).join('')}
    <div class="fld"><label for="cIni">Início</label><input type="date" id="cIni" value="${esc(a.inicio || '')}"></div>
    <div class="fld"><label for="cFim">Término</label><input type="date" id="cFim" value="${esc(a.termino || '')}"></div>
    <p class="muted" style="margin:0">A correção fica guardada: enquanto o PDF trouxer a mesma data errada, ela continua valendo. Se o PDF mudar a data, vale a do PDF.${a.correcao ? ` No PDF: ${fmtD(a.correcao.pdf_inicio)} → ${fmtD(a.correcao.pdf_termino)}.` : ''}</p></div>`,
    '<span class="msg" id="cMsg"></span><button class="btn ghost" type="button" id="cC">Cancelar</button><button class="btn" type="button" id="cOk">Salvar</button>', true);
  sugs.forEach(x => { const [d, m, y] = x.alt.split('/'); $(x.c).value = y + '-' + m + '-' + d; });   // ano trocado: já sugere a data provável
  $('cC').onclick = () => closeSheet();

    if (ini && fim && fim < ini) { $('cMsg').className = 'msg err'; $('cMsg').textContent = 'O término não pode ser antes do início.'; return; }
    const { error } = await sb.rpc('plan_corrigir', { p_id: a.id, p_inicio: ini, p_termino: fim });
    if (error) { $('cMsg').className = 'msg err'; $('cMsg').textContent = erroMsg(error); return; }

}

/* ---------------- Histórico (versões) ---------------- */
function renderHist() {
  $('tabBody').innerHTML = VERS.map(v => { const r = v.resumo || {};
    return `<button type="button" class="ver" data-v="${esc(v.id)}"><span class="h"><b>${v.tipo === 'mp' ? 'Médio prazo · reunião de ' + fmtD(v.referencia) : 'PCP · semana de ' + fmtDs(v.referencia) + ' a ' + fmtD(v.proxima)}</b><span class="muted">${fmtDH(v.criado_em)} · ${esc(nomeDe(v.criado_por))}</span></span>
      <span class="muted">${v.tipo === 'mp' ? [plural(v.n_linhas, 'atividade'), r.novas ? r.novas.length + ' novas' : '', r.mudou ? r.mudou.length + ' com data mudada' : '', r.sairam ? r.sairam.length + ' saíram' : '', (v.avisos || []).filter(x => x.nivel === 'erro').length + ' erros'].filter(Boolean).join(' · ') : plural(v.n_linhas, 'item', 'itens')}</span></button>`; }).join('') || '<div class="vazio"><h3>Nada importado ainda</h3></div>';

async function abrirPDF(caminho) {
  try { const { data, error } = await sb.storage.from('arquivos').download(caminho); if (error) throw error; window.open(URL.createObjectURL(data), '_blank'); }
  catch (e) { toast('Não foi possível abrir o PDF: ' + (e.message || e)); }
}
function fichaVersao(id) {
  const v = VERS.find(x => x.id === id); if (!v) return; const r = v.resumo || {};
  const lista = (t, L2, f) => L2 && L2.length ? `<h4 style="margin:0;font:700 1rem var(--f-disp)">${t} (${L2.length})</h4><div class="hist">${L2.map(f).join('')}</div>` : '';
  openSheet(v.tipo === 'mp' ? 'Médio prazo de ' + fmtD(v.referencia) : 'PCP de ' + fmtDs(v.referencia) + ' a ' + fmtD(v.proxima), `<dl class="kv"><dt>Importado</dt><dd>${fmtDH(v.criado_em)} por ${esc(nomeDe(v.criado_por))}</dd>
      ${v.tipo === 'mp' ? `<dt>Próxima reunião</dt><dd>${fmtD(v.proxima)}</dd>` : ''}<dt>Linhas</dt><dd>${v.n_linhas}</dd></dl>
    ${lista('Datas que mudaram', r.mudou, x => `<div class="mud"><b>${esc(x.item)}</b><br><span class="d">${esc(x.de)} → ${esc(x.para)}</span></div>`)}
    ${lista('Novas', r.novas, x => `<div>${esc(x)}</div>`)}
    ${lista('Saíram do planejamento', r.sairam, x => `<div>${esc(x)}</div>`)}
    ${v.tipo === 'mp' && (v.gerais || []).length ? `<details><summary class="muted" style="cursor:pointer;font-weight:600">Avisos gerais da reunião</summary><p style="white-space:pre-wrap;font-size:.86rem">${esc(v.gerais.join('\n'))}</p></details>` : ''}`,
    (v.arquivo ? '<button class="btn ghost" type="button" id="vPdf">Abrir o PDF</button>' : '') + (edita() ? (v.tipo === 'pcp' ? '<button class="btn danger" type="button" id="vDel">Excluir este PCP</button>' : v === ultimaMP() ? '<button class="btn danger" type="button" id="vDes">Desfazer esta importação</button>' : '') : ''));
  if ($('vPdf')) $('vPdf').onclick = () => abrirPDF(v.arquivo);
  if ($('vDel')) $('vDel').onclick = async () => { if (!confirm('Excluir o PCP da semana de ' + fmtDs(v.referencia) + '?')) return;
    const { error } = await sb.rpc('plan_excluir_pcp', { p_id: v.id }); if (error) { toast('Não foi possível: ' + erroMsg(error)); return; }
    if (v.arquivo) sb.storage.from('arquivos').remove([v.arquivo]).catch(() => {}); closeSheet(); toast('PCP excluído.'); await recarregar(); };
  if ($('vDes')) $('vDes').onclick = () => desfazerImportacao();
}

/* ---------------- ficha de uma atividade (com histórico) ---------------- */

    ${R.frentes.filter(f => f.itens.length).map(f => `<div class="pcpf"><b>${esc(f.nome)}${f.empresa ? ' · ' + esc(f.empresa) : ''}${f.pessoas ? ' — ' + esc(f.pessoas) : ''}</b>
      ${f.itens.map(i => { const k = itens.findIndex(x => x.frente === f.nome && x.item === i.id); const l = lig[k];
        return `<div class="at" style="cursor:default"><span class="mk pcp">${i.id}</span><b>${esc(i.texto)}</b><span class="diasx">${[0, 1, 2, 3, 4, 5].map(d => `<i class="${i.dias.includes(d) ? 'on' : ''}">${['S', 'T', 'Q', 'Q', 'S', 'S'][d]}</i>`).join('')}</span>${l ? `<small>↔ ${esc(rotAtv(l.a))} (sugestão)</small>` : ''}</div>`; }).join('')}</div>`).join('')}
    <p class="muted" style="margin:0">As ligações com o médio prazo são sugestões; depois de importar, toque num item para corrigir.</p></div>`,
    '<span class="msg" id="rMsg"></span><button class="btn ghost" type="button" id="rC">Cancelar</button><button class="btn" type="button" id="rOk">Importar</button>', true);
  $('rC').onclick = () => closeSheet();
  $('rOk').onclick = async () => { const b = $('rOk'); b.disabled = true;
    try {
      let arquivo = null; const vid = uuid();
      try { const cam = 'planejamento/' + OBRA + '/' + vid + '.pdf'; const { error } = await sb.storage.from('arquivos').upload(cam, new Blob([BUF], { type: 'application/pdf' }), { contentType: 'application/pdf', upsert: false }); if (!error) arquivo = cam; } catch (e) {}
      const { error } = await sb.rpc('plan_importar_pcp', { p_obra: OBRA, p_versao: { titulo: R.titulo, referencia: R.semana.ini, proxima: R.semana.fim, arquivo }, p_itens: itens });
      if (error) throw error;
      closeSheet(); toast('PCP importado: ' + plural(itens.length, 'item', 'itens') + '.'); SEM = R.semana.ini; TAB = 'semana'; await recarregar();
    } catch (e) { b.disabled = false; $('rMsg').className = 'msg err'; $('rMsg').textContent = 'Não foi possível importar: ' + erroMsg(e); } };
}

/* ======================= manutenção (Engenharia) ======================= */
async function desfazerImportacao() {
  const v = ultimaMP(); if (!v) { toast('Não há médio prazo importado.'); return; }
  const ant = VERS.filter(x => x.tipo === 'mp')[1];
  if (!confirm('Desfazer a importação do médio prazo de ' + fmtD(v.referencia) + '?\n\n' + (ant ? 'As atividades voltam ao que eram no médio prazo de ' + fmtD(ant.referencia) + '.' : 'Era a única versão: as atividades do planejamento somem.') + ' As conclusões marcadas no app continuam.')) return;
  const { error } = await sb.rpc('plan_desfazer_mp', { p_obra: OBRA }); if (error) { toast('Não foi possível: ' + erroMsg(error)); return; }
  if (v.arquivo) sb.storage.from('arquivos').remove([v.arquivo]).catch(() => {});
  closeSheet(); toast('Importação desfeita.'); await recarregar();
}
function zerar() {
  openSheet('Zerar o planejamento', `<div style="display:grid;gap:12px">
    <p style="margin:0">Apaga <b>todas as versões</b> importadas (médio prazo e PCP), as atividades, o histórico, as conclusões e as correções feitas no app, e os PDFs guardados desta obra.</p>
    <p class="muted" style="margin:0">As modificações e as frentes de trabalho (inclusive as liberações) continuam.</p>
    <label class="chk"><input type="checkbox" id="zLig"> Apagar também as ligações salvas (atividade → serviço, local → pavimentos)</label>
    <div class="fld"><label for="zConf">Para confirmar, escreva ZERAR</label><input id="zConf" autocomplete="off"></div></div>`,
    '<span class="msg" id="zMsg"></span><button class="btn ghost" type="button" id="zC">Cancelar</button><button class="btn danger" type="button" id="zOk">Zerar</button>', true);
  $('zC').onclick = () => closeSheet();
  $('zOk').onclick = async () => {
    if ($('zConf').value.trim().toUpperCase() !== 'ZERAR') { $('zMsg').className = 'msg err'; $('zMsg').textContent = 'Escreva ZERAR para confirmar.'; return; }
    $('zOk').disabled = true;
    const arqs = VERS.map(v => v.arquivo).filter(Boolean);
    const { error } = await sb.rpc('plan_zerar', { p_obra: OBRA, p_ligacoes: $('zLig').checked });
    if (error) { $('zOk').disabled = false; $('zMsg').className = 'msg err'; $('zMsg').textContent = erroMsg(error); return; }
    if (arqs.length) sb.storage.from('arquivos').remove(arqs).catch(() => {});
    closeSheet(); TAB = 'semana'; toast('Planejamento zerado.'); await recarregar();
  };
}
// ligações salvas: atividade → serviço e local → pavimentos (trocar vale já para as atividades importadas)
function ligacoes() {
  const at = ATV.filter(a => a.ativa);
  const grupos = new Map(); at.forEach(a => { const k = chaveAtv(a.grupo, a.atividade); if (!grupos.has(k)) grupos.set(k, { grupo: a.grupo, atividade: a.atividade, ids: [], sv: a.servico || '' }); grupos.get(k).ids.push(a.id); });
  const locs = new Map(); at.forEach(a => { const k = norm(a.local); if (!locs.has(k)) locs.set(k, { local: a.local, ids: [], pavs: a.pavimentos || [] }); locs.get(k).ids.push(a.id); });
  const opSv = cur => '<option value="">— não ligar —</option>' + ativos('servico').concat(cur && !ativos('servico').includes(cur) ? [cur] : []).map(s => `<option ${s === cur ? 'selected' : ''}>${esc(s)}</option>`).join('');
  const F2 = { q: '' };
  const desenhar = () => { const q = norm(F2.q);
    $('ligL').innerHTML = `<h4 style="margin:0">Atividades → serviço</h4>${[...grupos.entries()].filter(([, x]) => !q || norm(x.grupo + ' ' + x.atividade + ' ' + x.sv).includes(q)).sort((a, b) => (a[1].grupo + a[1].atividade).localeCompare(b[1].grupo + b[1].atividade))
        .map(([k, x]) => `<div class="ln"><b>${esc(x.grupo)} · ${esc(x.atividade)}</b><span class="muted">${plural(x.ids.length, 'atividade')}</span><select data-lsv="${esc(k)}">${opSv(x.sv)}</select></div>`).join('')}
      <h4 style="margin:8px 0 0">Locais → pavimentos</h4>${[...locs.entries()].filter(([, x]) => !q || norm(x.local).includes(q)).map(([k, x]) => `<div class="ln"><b>${esc(x.local || '(sem local)')}</b><span class="muted">${plural(x.ids.length, 'atividade')} · ${x.pavs.length ? '' : 'geral (sem pavimento)'}</span><span class="pvs">${pavNomes().map(p => `<label><input type="checkbox" data-llp="${esc(k)}" value="${esc(p)}" ${x.pavs.includes(p) ? 'checked' : ''}>${esc(p)}</label>`).join('')}</span></div>`).join('')}`;
    $('ligL').querySelectorAll('[data-lsv]').forEach(x => x.onchange = async () => { const g = grupos.get(x.dataset.lsv); x.disabled = true;
      const [r1, r2] = await Promise.all([sb.from('plan_mapa').upsert({ obra: OBRA, tipo: 'servico', origem: x.dataset.lsv, destino: x.value, atualizado_em: new Date().toISOString() }, { onConflict: 'obra,tipo,origem' }),
        sb.rpc('plan_religar', { p_obra: OBRA, p_ids: g.ids, p_servico: x.value, p_pavimentos: null })]);
      x.disabled = false; if (r1.error || r2.error) { toast('Não foi possível: ' + erroMsg(r1.error || r2.error)); return; }
      g.sv = x.value; MAPA.servico[x.dataset.lsv] = x.value; ATV.forEach(a => { if (g.ids.includes(a.id)) a.servico = x.value || null; }); toast('Ligação salva.'); });
    $('ligL').querySelectorAll('[data-llp]').forEach(x => x.onchange = async () => { const k = x.dataset.llp, l = locs.get(k);
      const sel = [...$('ligL').querySelectorAll('[data-llp="' + CSS.escape(k) + '"]:checked')].map(c => c.value);
      const [r1, r2] = await Promise.all([sb.from('plan_mapa').upsert({ obra: OBRA, tipo: 'local', origem: k, destino: { pavs: sel, geral: !sel.length }, atualizado_em: new Date().toISOString() }, { onConflict: 'obra,tipo,origem' }),
        sb.rpc('plan_religar', { p_obra: OBRA, p_ids: l.ids, p_servico: null, p_pavimentos: sel })]);
      if (r1.error || r2.error) { toast('Não foi possível: ' + erroMsg(r1.error || r2.error)); return; }
      l.pavs = sel; ATV.forEach(a => { if (l.ids.includes(a.id)) a.pavimentos = sel; }); toast('Ligação salva.'); });
  };
  openSheet('Ligações do planejamento', `<div class="rev"><p class="muted" style="margin:0">Liga cada atividade a um serviço (para as frentes e as modificações) e cada local aos pavimentos. Vale já e nas próximas importações.</p>
    <label class="busca"><input id="ligQ" type="search" placeholder="Buscar" aria-label="Buscar"></label><div id="ligL" class="rev"></div></div>`, '<button class="btn" type="button" id="ligOk">Pronto</button>');
  desenhar(); $('ligQ').oninput = e => { F2.q = e.target.value; desenhar(); };
  $('ligOk').onclick = async () => { closeSheet(); await recarregar(); };
}

/* ======================= janelas ======================= */
function openSheet(t, body, foot, form) { const o = $('ovl'); $('ovlT').textContent = t; $('ovlB').innerHTML = body; $('ovlF').innerHTML = foot || ''; o.hidden = false; if (form) o.dataset.form = '1'; else delete o.dataset.form; if (!form) $('ovlB').scrollTop = 0; }
function closeSheet() { const o = $('ovl'); o.hidden = true; $('ovlB').innerHTML = ''; $('ovlF').innerHTML = ''; delete o.dataset.form; }
$('ovl').addEventListener('click', ev => { if (ev.target === $('ovl') && !$('ovl').dataset.form) closeSheet(); });
$('ovlX').onclick = () => { if ($('ovl').dataset.form && !confirm('Fechar sem importar?')) return; closeSheet(); };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('ovl').hidden && !$('ovl').dataset.form) closeSheet(); });

/* ======================= início ======================= */
(async function iniciar() {
  NV = await (window.NUVEM_PRONTA || Promise.resolve(null));
  if (!NV) { $('main').innerHTML = '<div class="vazio"><h3>Precisa do banco online</h3><p class="muted" style="margin:0">O planejamento é compartilhado pela equipe e precisa do Supabase configurado no config.js.</p></div>'; return; }
  sb = NV.cliente; OBRA = NV.obraId;
  try { await carregar(); }
  catch (e) {
    if (e.naoTem) { $('main').innerHTML = '<div class="vazio"><h3>Obra não encontrada</h3><a class="btn" href="index.html" style="text-decoration:none">Ver as obras</a></div>'; return; }
    if (e.banco) { $('main').innerHTML = '<div class="vazio"><h3>Falta preparar o banco</h3><p class="muted" style="margin:0">Rode o arquivo <b>banco.sql</b> no Supabase (SQL Editor) e recarregue a página.</p></div>'; return; }
    $('main').innerHTML = `<div class="vazio"><h3>Não foi possível carregar</h3><p class="muted" style="margin:0">${esc(e.message || e)}</p><button class="btn" onclick="location.reload()">Recarregar</button></div>`; return;
  }
  $('obraNome').textContent = OBRA_NOME; document.title = OBRA_NOME + ' · Planejamento';
  const q = new URLSearchParams(location.search);
  if (['semana', 'mp', 'frentes', 'revisar', 'hist'].includes(q.get('aba'))) TAB = q.get('aba');
  render();
  if (edita() && window.AppObra && window.AppObra.itemMenu) {
    window.AppObra.itemMenu('Ligações de serviços e locais…', () => { if (!ATV.length) { toast('Importe um médio prazo primeiro.'); return; } ligacoes(); });
    window.AppObra.itemMenu('Desfazer a última importação…', desfazerImportacao);
    window.AppObra.itemMenu('Zerar o planejamento…', zerar);
  }
  if (q.get('aba')) history.replaceState(null, '', location.pathname + '?obra=' + encodeURIComponent(OBRA));
  try { sb.channel('plan-' + OBRA).on('postgres_changes', { event: '*', schema: 'public', table: 'frentes', filter: 'obra=eq.' + OBRA }, () => { if ($('ovl').hidden) { clearTimeout(iniciar.t); iniciar.t = setTimeout(recarregar, 500); } }).subscribe(); } catch (e) {}
})();
})();
</script>
