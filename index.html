<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Ferramentas de obra sobre o modelo IFC: mapa de risco, mapa de concretagem e outras.">
<title>Ferramentas da Obra</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-apple.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Obra"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icones/principal.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
/* cores e fontes comuns: estilo.css; aqui só as desta página */

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* faixa da marca */
.brand{background:var(--navy);color:var(--brand-ink);position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:min(46%,560px);background:var(--petrol);clip-path:polygon(64px 0,100% 0,100% 100%,0 100%);z-index:0}
.brand-in{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;max-width:1180px;margin:0 auto;padding:12px 16px}
.logo{display:block;color:inherit;text-decoration:none}
.logo img{height:40px;width:40px;display:block}
.ttl{display:grid;border-left:1px solid rgba(255,255,255,.25);padding-left:18px;min-width:0}
.ttl .kick{font:600 .68rem var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-soft)}
.ttl h1{font:700 1.45rem/1.1 var(--f-disp);margin:0}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:6px 11px;font:600 .82rem var(--f-body);display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none}
.hbtn:hover{background:rgba(255,255,255,.2)}
.modechip{font:500 .7rem var(--f-mono);color:#d4e4ee;border:1px dashed rgba(255,255,255,.35);border-radius:12px;padding:2px 8px;white-space:nowrap}

/* conteúdo */
main{max-width:1180px;margin:0 auto;padding:22px 16px 48px;display:grid;gap:18px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem;color:var(--muted)}
.crumbs a{font-weight:600;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.head h2{margin:0;font:700 1.6rem/1.15 var(--f-disp)}
.head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tool{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;color:inherit;text-decoration:none;min-height:190px;position:relative}
a.tool:hover{border-color:var(--accent);box-shadow:0 6px 20px rgba(10,30,45,.08)}
.tool .ic{width:52px;height:52px;display:grid;place-items:center}
.tool .ic img{width:52px;height:52px;display:block}
.tool h3{margin:0;font:700 1.2rem var(--f-disp)}
.tool p{margin:4px 0 0;color:var(--muted);font-size:.9rem;line-height:1.4}
.tool>div{grid-column:1/-1}
.tool .md-ch{align-self:start;color:var(--accent);font:600 1.5rem/1 var(--f-body)}
a.tool:hover .md-ch{transform:translateX(2px)}
.tool{min-height:0!important;transition:border-color .12s,background .12s}
a.tool:hover{background:var(--accent-soft)}
.sec{margin:4px 0 -6px;font:700 1.25rem var(--f-disp)}
.mdl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.9rem}.mdl dt{color:var(--muted)}.mdl dd{margin:0;overflow-wrap:anywhere}
.sheet h4.sub{margin:4px 0 -4px;font:700 .95rem var(--f-disp);border-top:1px solid var(--line);padding-top:12px}
.tool.off{opacity:.62}
.tag{position:absolute;top:14px;right:14px;font:600 .68rem var(--f-body);padding:2px 8px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 11px}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:7px;padding:8px 14px;font:600 .9rem var(--f-body);white-space:nowrap}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.obras{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.obra{display:grid;gap:8px;align-content:start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0 16px 14px}
.obra .ft{display:block;margin:0 -16px 4px;border-radius:var(--r) var(--r) 0 0;aspect-ratio:16/7;background:linear-gradient(135deg,var(--navy),var(--petrol));position:relative;overflow:hidden;text-decoration:none}
.obra .ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.obra .ft span{position:absolute;left:16px;bottom:10px;font:700 1.9rem/1 var(--f-disp);color:rgba(255,255,255,.85);letter-spacing:.04em}
.ft-prev{position:relative;aspect-ratio:16/7;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,var(--navy),var(--petrol))}
.ft-prev img{position:absolute;inset:0;width:100%;height:100%}
.ft-prev span{position:absolute;left:16px;bottom:10px;font:700 1.9rem/1 var(--f-disp);color:rgba(255,255,255,.85)}
.seg2{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:7px;overflow:hidden;width:max-content;max-width:100%}
.seg2 button{background:var(--bg);border:0;padding:7px 12px;font:600 .86rem var(--f-body);color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.aj{display:grid;gap:6px}
.aj label{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:.86rem;color:var(--muted)}
.aj input{accent-color:var(--accent);width:100%}
@media (max-width:640px){.aj label{grid-template-columns:1fr}}
.sheet.larga{width:min(820px,100%)}
.adm{display:grid;gap:8px}
.adm-l{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:4px 12px;align-items:center;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px}
.adm-l.pend{border-color:var(--warn);background:var(--warn-soft)}
.adm-l .nm2{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-width:0}
.adm-l .nm2 input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;flex:1 1 160px;font-weight:600}
.adm-l select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%}
.adm-l small{grid-column:1/-1;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
.adm-add{display:grid;grid-template-columns:minmax(0,1fr) 190px auto;gap:8px;align-items:end}
.adm-add input,.adm-add select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 9px;width:100%;min-width:0}
.adm-l .cg{grid-column:1/-1;display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:7px}
.adm-l .cg label{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:600 .74rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.adm-l .cg label select{width:auto;min-width:170px;text-transform:none;letter-spacing:0;font:500 .9rem var(--f-body);color:var(--ink)}
.dsc{display:flex;flex-wrap:wrap;gap:5px}
.dsc button{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px 10px;font:600 .8rem var(--f-body);color:var(--muted)}
.dsc button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dsc button:disabled{opacity:.4;cursor:default}
.hbtn .cnt{background:#f0a93a;color:#22425c;border-radius:9px;padding:0 6px;font-size:.72rem;font-weight:700}
@media (max-width:640px){.adm-l,.adm-add{grid-template-columns:1fr}}
.obra:hover{border-color:var(--accent)}
.obra a.nm{font:700 1.15rem/1.2 var(--f-disp);color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.obra a.nm::after{content:" →";color:var(--accent)}
.obra a.nm:hover{color:var(--accent)}
/* "Meu dia" */
.md{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 18px;display:grid;gap:12px}
.md-top{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}
.md h2{margin:0;font:700 1.45rem var(--f-disp)}
.md-chips{display:flex;flex-wrap:wrap;gap:6px}
.md-chip{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font:500 .84rem var(--f-body);color:var(--muted);background:none}
.md-chip.on{color:var(--ink);border-color:var(--accent)}
.md-chip.on b{font-family:var(--f-mono);color:var(--accent)}
.md-chip.on:hover,.md-chip[aria-pressed="true"]{background:var(--accent-soft)}
.md-h{display:flex;gap:10px;align-items:center;justify-content:space-between}
.md-h h3{margin:0;font:700 1.12rem var(--f-disp)}
.md-volta{background:none;border:0;color:var(--accent);font:600 .86rem var(--f-body);padding:4px 2px}
.md-o{display:grid;gap:6px}
.md-o h3{margin:0;font:600 .9rem var(--f-body);color:var(--accent)}
.md-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:6px 16px}
.md-c{display:flex;gap:10px;align-items:center;min-height:48px;padding:7px 10px 7px 12px;border:1px solid var(--line);border-radius:7px;color:var(--ink);text-decoration:none;transition:background .12s,border-color .12s}
.md-c:hover,.md-c:focus-visible{background:var(--accent-soft);border-color:var(--accent)}
.md-t{display:grid;gap:1px;min-width:0;flex:1}
.md-t b{font:600 .92rem var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-t small{color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-t small b{font:inherit;font-weight:700}
.md-pri{flex:none;font:600 .74rem var(--f-body);padding:3px 10px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.md-pri.pri-critica{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.md-pri.pri-alta{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.md-ch{flex:none;color:var(--muted);font:600 1.2rem/1 var(--f-body);width:14px;text-align:center}
.md-c:hover .md-ch{color:var(--accent)}
.md-mais{font:600 .84rem var(--f-body);text-decoration:none}
/* nome da obra com a engrenagem */
.nmr{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0}
.engr{position:relative;flex:none}
.engr-b{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--muted)}
.engr-b:hover,.engr-b[aria-expanded="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.engr-m{position:absolute;right:0;top:calc(100% + 4px);z-index:10;min-width:170px;display:grid;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.engr-m button{background:none;border:0;border-radius:5px;padding:8px 11px;text-align:left;font:500 .9rem var(--f-body);color:var(--ink)}
.engr-m button:hover,.engr-m button:focus-visible{background:var(--accent-soft)}
.engr-m button.ruim{color:var(--bad)}
.engr-m button.ruim:hover{background:var(--bad-soft)}
.vers{display:grid;gap:4px;margin-top:6px}
.vers div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.86rem;border-top:1px solid var(--line-2);padding-top:5px}
/* ferramentas da obra: ícones como apps de celular */
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;margin:2px -6px}
.app{display:grid;justify-items:center;gap:5px;padding:6px 2px;border-radius:12px;color:var(--ink);text-decoration:none;min-width:0}
.app:hover,.app:focus-visible{background:var(--accent-soft)}
.app .ap-ic{position:relative;width:60px;height:60px;display:grid;place-items:center;filter:drop-shadow(0 2px 4px rgba(10,30,45,.18))}
.app .ap-ic img{width:60px;height:60px;display:block}
.app:hover .ap-ic{border-color:var(--accent)}
.app .ap-nm{font:600 .74rem/1.15 var(--f-body);letter-spacing:-.01em;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .badge{position:absolute;top:-6px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font:700 .72rem/20px var(--f-body);text-align:center;border:2px solid var(--panel)}
.app .badge.ruim{background:var(--bad)}
.ruim{color:var(--bad)}
.bom{color:var(--ok)}
.tool .rs1{margin:4px 0 0;font:600 .9rem var(--f-body);color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(180px,320px) 1fr;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.hero .hft{aspect-ratio:16/7;border-radius:8px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--navy),var(--petrol))}
.hero .hft img{position:absolute;inset:0;width:100%;height:100%}
.hero .hft span{position:absolute;left:14px;bottom:8px;font:700 1.8rem/1 var(--f-disp);color:rgba(255,255,255,.85)}
.hero .hinfo{display:grid;gap:6px;min-width:0}
.hero h2{margin:0;font:700 2rem/1.15 var(--f-disp);overflow-wrap:anywhere}
.hero .nmr{padding-right:4px}
.hero .acts{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.obra dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:.84rem}
.obra dt{color:var(--muted)} .obra dd{margin:0;min-width:0;overflow-wrap:anywhere}
.obra .acts{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line-2);padding-top:8px}
.pill{font:600 .7rem var(--f-body);padding:1px 7px;border-radius:10px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.vazio{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.vazio h3{margin:0;font:700 1.2rem var(--f-disp)}
.vazio p{margin:0;color:var(--muted);max-width:52ch}
.muted{color:var(--muted);font-size:.88rem}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.9rem}

/* janelas */
.overlay{position:fixed;inset:0;background:rgba(6,20,30,.5);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);max-height:calc(100dvh - 32px);display:grid;grid-template-rows:auto 1fr auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.sheet>header{padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet>header h3{margin:0;font:700 1.25rem var(--f-disp)}
.sheet .body{overflow:auto;padding:14px 16px;display:grid;gap:12px}
.sheet>footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.fld{display:grid;gap:4px}
.fld label{font:600 .7rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%}
.msg{font-size:.84rem;margin-right:auto}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 15px;border-radius:8px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:640px){
  .brand::after{display:none}
  .ttl{border-left:0;padding-left:0}
  .hctl{margin-left:0;width:100%}
  .head h2{font-size:1.35rem}
}
</style>
</head>
<body>
<header class="brand"><div class="brand-in">
  <a class="logo" href="index.html" aria-label="Início"><img src="icones/principal.svg" alt="" width="40" height="40"></a>
  <div class="ttl"><span class="kick">Engenharia e segurança</span><h1>Ferramentas da Obra</h1></div>
  <div class="hctl"><span class="modechip" id="modeChip" hidden>Carregando…</span></div>
</div></header>

<main id="main" aria-live="polite"></main>

<div class="overlay" id="ovl" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ovlT"><header><h3 id="ovlT"></h3></header><div class="body" id="ovlB"></div><footer id="ovlF"></footer></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script src="config.js"></script>
<script src="nuvem.js"></script>
<script src="carga-start.js"></script>
<script>
(function () {
'use strict';
/* Ferramentas disponíveis. Para incluir uma nova: crie a página (ex.: concretagem.html,
   com window.NUVEM_FERRAMENTA='concretagem') e preencha "pagina" aqui. */
const FERRAMENTAS = [
  { id: 'risco', nome: 'Mapa de Risco', curto: 'Riscos', pagina: 'risco.html',
    resumo: 'Consulte os riscos e a sinalização de cada área.',
    desc: 'Áreas de risco por grupo e intensidade (NR-5), símbolos de sinalização, revisões e pranchas em PDF sobre o modelo da obra.',
    icone: '<img src=\"icones/risco.svg\" alt=\"\">' },
  { id: 'concretagem', nome: 'Mapa de Concretagem', curto: 'Concretagens', pagina: 'concretagem.html',
    resumo: 'Acompanhe concretagens, corpos de prova e rompimentos.',
    desc: 'Concretagens por pavimento e por caminhão, áreas e pilares concretados, corpos de prova e pendências de rompimento, sobre o mesmo modelo IFC da obra.',
    icone: '<img src=\"icones/concretagem.svg\" alt=\"\">' },
  { id: 'pendencias', nome: 'Pendências de obra', curto: 'Pendências', pagina: 'pendencias.html', soOnline: true,
    resumo: 'Acompanhe correções, responsáveis e prazos.',
    desc: 'Registro de pendências e retrabalhos com fotos, responsável pela correção, prazos, bloqueios de frentes, histórico e relatórios em PDF. Funciona sem sinal.',
    icone: '<img src=\"icones/pendencias.svg\" alt=\"\">' },
  { id: 'fachada', nome: 'Mapa de Fachadas', curto: 'Fachadas', pagina: 'fachadas.html', soOnline: true,
    resumo: 'Acompanhe as etapas de revestimento e os prazos de cura.',
    desc: 'Chapisco, reboco, textura e pintura desenhados sobre as fachadas (geradas do IFC da arquitetura), com tempo de cura por camada, áreas liberadas, quebras de cura e avisos.',
    icone: '<img src=\"icones/fachadas.svg\" alt=\"\">' },
  { id: 'personalizacao', nome: 'Personalizações', curto: 'Personalizações', pagina: 'personalizacoes.html', soOnline: true,
    resumo: 'Modificações dos compradores, ciência das equipes e liberação das frentes.',

// fachadas: por obra, quantas aplicações terminam a cura hoje e nos próximos 3 dias
async function liberacoesFachada(hoje) {
  const { data, error } = await NV.cliente.from('registros').select('painel,colecao,id,camada:dados->>camada,data:dados->>data,nome:dados->>nome,cura:dados->>cura,ordem:dados->>ordem')
    .like('painel', 'fachada:%').in('colecao', ['camadas', 'aplicacoes']);
  if (error) return [];
  const soma = (d, n) => { const t = new Date(d + 'T12:00:00'); t.setDate(t.getDate() + n); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
  const em3 = soma(hoje, 3), porObra = {};
  for (const r of data || []) { const ob = String(r.painel).split(':')[1]; const o = porObra[ob] || (porObra[ob] = { cam: {}, apl: [] });
    if (r.colecao === 'camadas') o.cam[r.id] = { nome: r.nome, cura: +r.cura || 0, ordem: +r.ordem || 0 }; else o.apl.push(r); }
  const out = [];
  for (const [obra, o] of Object.entries(porObra)) {
    const ord = Object.entries(o.cam).sort((a, b) => a[1].ordem - b[1].ordem); let hojeN = 0, breve = 0, prox = '';
    for (const a of o.apl) { const c = o.cam[a.camada]; if (!c || !c.cura || !/^\d{4}-\d{2}-\d{2}$/.test(String(a.data))) continue;
      const lib = soma(a.data, c.cura);
      if (lib === hoje) { hojeN++; const i = ord.findIndex(x => x[0] === a.camada); if (i >= 0 && ord[i + 1]) prox = ord[i + 1][1].nome; }
      else if (lib > hoje && lib <= em3) breve++; }
    if (hojeN || breve) out.push({ obra, hoje: hojeN, breve, prox });
  }
  return out;
}
const hojeIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtD = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return d + '/' + m + '/' + y; };
async function carregarResumo() {

  const sb = NV.cliente; const hoje = hojeIso();
  PENDS = []; ROMP = []; FACH = [];
  if (NV.podeVer('concretagem')) try { const { data, error } = await sb.rpc('rompimentos_resumo'); if (!error) ROMP = data || []; } catch (e) {}
  if (NV.podeVer('fachada')) try { FACH = await liberacoesFachada(hoje); } catch (e) {}
  try {
    const { data, error } = await sb.from('pendencias').select('*');
    if (!error) PENDS = data || [];
    // funcionário de campo: o que foi escolhido para ele, ou sem ninguém escolhido (não as dos colegas)
    if (!error && NV.perfil === 'campo') { try { const eu = String(NV.usuario.email || '').toLowerCase();
      const fs = await sb.from('pend_funcionarios').select('id,email'); const meus = new Set((fs.data || []).filter(f => String(f.email || '').toLowerCase() === eu).map(f => f.id));
      PENDS = PENDS.filter(p => !p.responsavel || meus.has(p.responsavel)); } catch (e) {} }
    if (!error) for (const p of data || []) { const r = g(p.obra); r.pend = r.pend || { abertas: 0, corrigidas: 0, fechadas: 0, venc: 0, aval: 0 };
      if (p.status === 'aberta' || p.status === 'em_correcao') { r.pend.abertas++; if (p.prazo && p.prazo < hoje) r.pend.venc++; }
      else if (p.status === 'avaliacao') r.pend.aval++;
      else if (p.status === 'corrigida') r.pend.corrigidas++; else r.pend.fechadas++; }
  } catch (e) {}
  // personalizações: faltas de ciência (de todos, para a Engenharia; as dos meus ofícios, para Campo) e frentes previstas
  PERSZ = []; FRENTESZ = [];
  if (NV.podeVer('personalizacao')) try {
    const [lp, lf] = await Promise.all([sb.from('personalizacoes').select('id,obra,numero,pavimento,unidade,titulo,status,itens,pers_ciencias(servico)').in('status', ['solicitada', 'aprovada', 'executada']),
      sb.from('frentes').select('obra,servico,pavimento,previsto,liberada_em').is('liberada_em', null).not('previsto', 'is', null)]);
    if (!lp.error) PERSZ = lp.data || []; if (!lf.error) FRENTESZ = lf.data || [];

    for (const p of PERSZ) { const r = g(p.obra); r.pers = r.pers || { ativas: 0, faltas: 0, sol: 0 }; r.pers.ativas++; if (p.status === 'solicitada') r.pers.sol++;
      if (p.status === 'aprovada' && persFaltas(p).some(i => NV.perfil !== 'campo' || meus.includes(i.oficio))) r.pers.faltas++; }
  } catch (e) {}
  // cerâmicas: pallets e caixas em estoque
  if (NV.podeVer('ceramica')) try {
    const [lp, lm] = await Promise.all([sb.from('cer_pallets').select('id,obra,caixas,cer_produtos(pecas_cx)'), sb.from('cer_movs').select('pallet,tipo,pecas')]);
    if (!lp.error) { const sai = {}; for (const m of lm.data || []) sai[m.pallet] = (sai[m.pallet] || 0) + (m.tipo === 'entrega' || m.tipo === 'quebra' ? m.pecas : -m.pecas);
      for (const p of lp.data || []) { const pc = (p.cer_produtos && p.cer_produtos.pecas_cx) || 6, s = p.caixas * pc - (sai[p.id] || 0); const r = g(p.obra); r.cer = r.cer || { pallets: 0, cx: 0 };
        if (s > 0) { r.cer.pallets++; r.cer.cx += s / pc; } } }
  } catch (e) {}
  if (!['campo', 'almoxarifado'].includes(NV.perfil)) try {
    const { data, error } = await sb.from('registros').select('painel,colecao,id,data:dados->>data,rev:dados->>rev').in('colecao', ['concretagens', 'revisoes', 'areas', 'aplicacoes']);
    if (!error) for (const x of data || []) { const [fe, ob] = String(x.painel).split(':'); if (!ob) continue; const r = g(ob);
      if (fe === 'concretagem' && x.colecao === 'concretagens') { r.conc = r.conc || { n: 0, ultima: '' }; r.conc.n++; if (x.data && x.data > r.conc.ultima) r.conc.ultima = x.data; }
      if (fe === 'fachada' && x.colecao === 'aplicacoes') { r.fach = r.fach || { n: 0, ultima: '' }; r.fach.n++; if (x.data && x.data > r.fach.ultima) r.fach.ultima = x.data; }
      if (fe === 'risco' && x.colecao === 'areas') { r.risco = r.risco || { areas: 0 }; r.risco.areas++; }

  } catch (e) {}
  RESUMO = R;
}

const fmtDia = s => s ? new Date(s).toLocaleDateString('pt-BR') : '';
/* ---------------- IFC: confere, compacta e envia ---------------- */
async function lerIfc(arq) {
  const buf = await arq.arrayBuffer();
  const ini = new TextDecoder('latin1').decode(buf.slice(0, 300));
  if (!/ISO-10303-21/.test(ini)) throw new Error(arq.name + ' não parece ser um arquivo IFC.');
  let gz = null;
  try { gz = await new Response(new Blob([buf]).stream().pipeThrough(new CompressionStream('gzip'))).blob(); } catch (e) { gz = null; }
  const up = gz ? new Blob([gz], { type: 'application/gzip' }) : new Blob([buf], { type: 'application/octet-stream' });
  if (up.size > MAX_UP) throw new Error('O modelo, mesmo compactado, passa de 50 MB.');
  return { up, gz: !!gz, bytes: arq.size, nome: arq.name };
}
async function enviarModelo(obraId, arq, progresso, lido) {
  progresso && progresso('Compactando o modelo…', .25);
  const m = lido || await lerIfc(arq);
  progresso && progresso('Enviando o modelo (' + fmtMB(m.up.size) + ')…', .55);
  const r = await NV.obras.enviarModelo(obraId, m.up);
  return { asset: r.id, nome: m.nome, bytes: m.bytes, gz: m.gz, em: new Date().toISOString() };
}
/* ---------------- foto da obra: reduz para no máximo 1000 px e envia em JPEG ---------------- */
async function prepararFoto(arq) {
  if (!/^image\//.test(arq.type)) throw new Error('escolha uma imagem (JPG, PNG…).');
  const url = URL.createObjectURL(arq); const img = new Image();
  try { await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('não foi possível ler a imagem.')); img.src = url; }); }
  finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
  const sc = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.naturalWidth * sc)); cv.height = Math.max(1, Math.round(img.naturalHeight * sc));
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .85));
  return { blob, proporcao: img.naturalWidth / img.naturalHeight };
}

  return { asset: r.id, em: new Date().toISOString(), modo: proporcao < 1.6 ? 'inteira' : 'cobrir', x: 50, y: 50, zoom: 100 };
}

      <label>Zoom <input type="range" id="fZ" min="100" max="300" step="5"></label>
      <label>Posição horizontal <input type="range" id="fX" min="0" max="100"></label>
      <label>Posição vertical <input type="range" id="fY" min="0" max="100"></label>
    </div>
    <p class="muted" style="margin:0">A prévia mostra o cartão como fica na lista. A imagem é reduzida antes do envio.</p>`,
    `<span class="msg" id="fMsg"></span>${tem ? '<button class="btn danger" id="fRem" style="margin-right:auto">Remover foto</button>' : ''}<button class="btn ghost" id="fC">Cancelar</button><button class="btn" id="fOk">Salvar</button>`);
  const prev = $('fPrev');
  const desenhar = () => {
    $('ovlB').querySelectorAll('[data-modo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.modo === aj.modo)));
    $('fAj').hidden = aj.modo === 'inteira';
    $('fZ').value = aj.zoom; $('fX').value = aj.x; $('fY').value = aj.y;
    prev.style.cssText = fotoEstilo(aj);
    $('fIni').hidden = !prev.hidden;
  };
  $('ovlB').querySelectorAll('[data-modo]').forEach(b => b.onclick = () => { aj.modo = b.dataset.modo; desenhar(); });
  $('fZ').oninput = ev => { aj.zoom = +ev.target.value; desenhar(); };
  $('fX').oninput = ev => { aj.x = +ev.target.value; desenhar(); };
  $('fY').oninput = ev => { aj.y = +ev.target.value; desenhar(); };
  if (tem) NV.blobUrl(o.foto.asset).then(u => { prev.src = u; prev.hidden = false; desenhar(); }).catch(() => {});
  $('fArq').onchange = ev => {
    const a = ev.target.files[0]; if (!a) return;
    if (novoUrl) URL.revokeObjectURL(novoUrl);
    novoArq = a; novoUrl = URL.createObjectURL(a);
    prev.onload = () => { // imagem quadrada ou em pé: começa mostrando inteira
      aj.modo = prev.naturalWidth / prev.naturalHeight < 1.6 ? 'inteira' : 'cobrir'; aj.x = 50; aj.y = 50; aj.zoom = 100; desenhar(); prev.onload = null; };
    prev.src = novoUrl; prev.hidden = false;
  };
  desenhar();
  const fechar = () => { if (novoUrl) URL.revokeObjectURL(novoUrl); closeSheet(); };
  $('fC').onclick = fechar;
  const gravar = async (foto, apagarAntiga) => {
    await NV.obras.alterar(o.id, { foto }, o.atualizado_em);
    if (apagarAntiga && tem) NV.obras.apagarArquivo(o.foto.asset).catch(() => {});
    fechar(); toast(foto ? 'Foto salva.' : 'Foto removida.'); await carregar(); redesenhar();
  };
  if ($('fRem')) $('fRem').onclick = async () => { $('fRem').disabled = true; try { await gravar(null, true); } catch (e) { if (!avisoConflito(e, f)) { $('fRem').disabled = false; $('fMsg').className = 'msg err'; $('fMsg').textContent = msgErro(e); } } };
  $('fOk').onclick = async () => {
    if (!novoArq && !tem) { $('fMsg').className = 'msg err'; $('fMsg').textContent = 'Escolha uma imagem.'; return; }
    $('fOk').disabled = true; $('fMsg').className = 'msg'; $('fMsg').textContent = novoArq ? 'Enviando…' : 'Salvando…';
    const ajuste = { modo: aj.modo, x: aj.x, y: aj.y, zoom: aj.zoom };
    let enviada = null;
    try {
      if (novoArq) { enviada = await enviarFoto(o.id, novoArq); await gravar(Object.assign(enviada, ajuste), true); }
      else await gravar(Object.assign({}, o.foto, ajuste), false);
    } catch (e) { if (enviada) NV.obras.apagarArquivo(enviada.asset).catch(() => {}); if (!avisoConflito(e, f)) { $('fOk').disabled = false; $('fMsg').className = 'msg err'; $('fMsg').textContent = 'Não foi possível salvar: ' + msgErro(e); } }
  };
}
/* ---------------- administração (página admin.html) ---------------- */
async function contarPendentes() {
  const b = $('bAdmin'); if (!b) return;
  try { const l = await NV.administracao.listar(); const n = l.filter(u => u.tem_conta && !(u.perfil || u.papel)).length;
    b.innerHTML = 'Administração' + (n ? ` <span class="cnt" title="${n} aguardando liberação">${n}</span>` : '');
    b.href = 'admin.html' + (n ? '?filtro=aguardando' : ''); } catch (e) {}
}
function formExcluir(f, o) {
  if (!o) return;
  openSheet('Excluir obra', `<p style="margin:0">A obra <b>${esc(o.nome)}</b> sai da lista para todas as pessoas, em <b>todas as ferramentas</b> (modelo IFC, mapas, concretagens, pendências e imagens).</p>
    <p class="muted" style="margin:0">Ela fica 30 dias na lixeira, e o administrador pode restaurá-la em Administração → Dados. Depois disso, é apagada de vez.</p>
    <div class="fld"><label for="xTxt">Para confirmar, digite EXCLUIR</label><input id="xTxt" autocomplete="off" autocapitalize="characters"></div>`,
    `<span class="msg" id="xMsg"></span><button class="btn ghost" id="xC">Cancelar</button><button class="btn danger" id="xOk" disabled>Excluir obra</button>`);
  $('xC').onclick = closeSheet;
  $('xTxt').oninput = () => { $('xOk').disabled = $('xTxt').value.trim().toUpperCase() !== 'EXCLUIR'; };
  $('xOk').onclick = async () => {
    $('xOk').disabled = $('xC').disabled = true; $('xOk').textContent = 'Excluindo…'; ocupado(true);
    try { await NV.obras.apagar(o.id, FERRAMENTAS.map(x => x.id)); ocupado(false); closeSheet(); toast('Obra enviada para a lixeira (30 dias).'); if (obraAtual()) { location.href = 'index.html'; return; } await carregar(); redesenhar(); }
    catch (e) { ocupado(false); $('xC').disabled = false; $('xOk').textContent = 'Excluir obra'; $('xMsg').className = 'msg err'; $('xMsg').textContent = 'Não foi possível excluir: ' + msgErro(e); }
  };
}

/* ---------------- carga inicial: obra Start (carga-start.js) ---------------- */
// Enquanto prepara, mostra uma janela de progresso: assim ninguém abre a obra
// pela metade. A mesma carga também roda ao abrir a obra Start numa ferramenta.
async function cargaStart(f) {
  if (!window.CargaStart || !lista) return;
  if (!(await CargaStart.precisa(NV))) return;
  openSheet('Preparando a obra Start', `<p style="margin:0">Gravando o modelo IFC, o mapa de risco do térreo e as concretagens da obra Start. Leva menos de um minuto. <b>Não feche a página.</b></p>${barraProg}`, '<span class="msg" id="csMsg"></span>');
  ocupado(true);
  try {
    const r = await CargaStart.rodar(NV, prog);
    ocupado(false); closeSheet();
    toast('Obra Start pronta: modelo IFC, mapa de risco do térreo e ' + r.concretagens + ' concretagens.', 7000);
  } catch (e) {
    console.error(e); ocupado(false);
    $('csMsg').className = 'msg err'; $('csMsg').textContent = 'Não foi possível terminar: ' + msgErro(e) + '. Recarregue a página para continuar de onde parou.';
    $('ovlF').insertAdjacentHTML('beforeend', '<button class="btn" onclick="location.reload()">Recarregar</button>');
  }
  await carregar(); redesenhar();
}
/* ---------------- início ---------------- */
(async function () {
  NV = await (window.NUVEM_PRONTA || Promise.resolve(null));
  $('modeChip').textContent = NV ? 'Online' : 'Modo local';
  if (NV && NV.admin) {
    const a = document.createElement('a'); a.className = 'hbtn'; a.id = 'bAdmin'; a.href = 'admin.html'; a.textContent = 'Administração'; a.title = 'Pessoas, perfis, obras de cada um, convites e atividade';
    $('modeChip').after(a); contarPendentes();
  }
  if (!NV) { telaFerramentas(); return; }
  if (obraAtual()) { await Promise.all([carregar(), carregarResumo()]); await telaObra(obraAtual()); }
  else await telaObras();
  NV.obras.aoMudar(async () => { if (!$('ovl').hidden) return; await Promise.all([carregar(), carregarResumo()]); redesenhar(); });
})();
})();
</script>
