<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Cerâmicas: pallets recebidos com os dados da etiqueta, entregas por apartamento lendo o código do pallet e consumo comparado à estimativa.">
<meta name="theme-color" content="#22425c">
<title>Cerâmicas</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-apple.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Obra"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icones/ceramicas.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
/* cores e fontes comuns: estilo.css; aqui só as desta página */
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px var(--f-body);-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* faixa da marca */
.brand{background:var(--navy);color:var(--brand-ink);position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:min(46%,560px);background:var(--petrol);clip-path:polygon(64px 0,100% 0,100% 100%,0 100%);z-index:0}
.brand-in{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1240px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px))}
.logo{display:block;color:inherit}
.logo img{height:40px;width:40px;display:block}
.ttl{display:grid;border-left:1px solid rgba(255,255,255,.25);padding-left:16px;min-width:0}
.ttl h1{font:700 1.35rem/1.1 var(--f-disp);margin:0}
.ttl .obra{font-size:.82rem;color:#d4e4ee}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:6px 11px;font:600 .82rem var(--f-body);display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none}
.hbtn:hover{background:rgba(255,255,255,.2)}

main{max-width:1240px;margin:0 auto;padding:14px 16px 24px;display:grid;gap:14px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.86rem;color:var(--muted)}
.crumbs a{font-weight:600;text-decoration:none;color:var(--accent)} .crumbs a:hover{text-decoration:underline}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:8px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 18px;font:700 .92rem var(--f-body);color:var(--ink)}
.tab:hover{border-color:var(--accent)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab b{font-family:var(--f-body);margin-left:4px;opacity:.85}
.muted{color:var(--muted);font-size:.88rem}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:7px;padding:8px 14px;font:600 .9rem var(--f-body);white-space:nowrap}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--accent);font:600 .88rem var(--f-body);padding:4px 2px}
.lnk:hover{text-decoration:underline}

/* avisos no topo */
.alertas{display:grid;gap:8px}
.alerta{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bad-soft);border:1px solid var(--bad);border-radius:var(--r);padding:10px 12px;color:var(--ink)}
.alerta.info{background:var(--warn-soft);border-color:var(--warn)}
.alerta .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;font:700 .9rem var(--f-body)}
.alerta.info .ic{background:var(--warn)}
.alerta b{font-weight:700}
.alerta small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}

/* filtros */
.filtros{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.busca{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 11px;color:var(--muted);min-height:40px}
.busca input{flex:1;border:0;background:none;outline:0;padding:9px 0;min-width:0;color:var(--ink)}
.fsel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:500 .88rem var(--f-body);min-height:40px;max-width:100%}
.fsel.on{border-color:var(--accent);background:var(--accent-soft)}
.chip{background:none;border:1px solid var(--line);border-radius:16px;padding:6px 11px;font:500 .84rem var(--f-body);color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}

/* lista */
.grupo{display:grid;gap:8px}
.grupo>h2{margin:4px 0 0;font:700 1rem var(--f-disp);color:var(--muted);letter-spacing:.02em}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.card{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%;color:inherit;transition:border-color .12s,background .12s}
.card:hover{border-color:var(--accent);background:var(--accent-soft)}
.card.falta{border-left-color:var(--bad)} .card.ok{border-left-color:var(--ok)} .card.sol{border-left-color:var(--warn)}
.c-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.c-loc{font-size:.8rem;color:var(--muted)}
.c-tit{font:700 1rem/1.25 var(--f-body);overflow-wrap:anywhere}
.st{flex:none;font:600 .74rem var(--f-body);padding:2px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st-solicitada{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.st-aprovada{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.st-executada,.st-conferida{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.st-cancelada{text-decoration:line-through}
.svs{display:flex;flex-wrap:wrap;gap:5px}
.sv{font:600 .76rem var(--f-body);padding:2px 8px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.sv.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sv.falta{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.vazio{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.vazio h3{margin:0;font:700 1.15rem var(--f-disp)}

/* frentes */
.fr-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table.fr{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem}
table.fr th,table.fr td{padding:6px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);text-align:center;vertical-align:middle}
table.fr th{font:700 .8rem var(--f-disp);color:var(--muted);background:var(--panel);position:sticky;top:0}
table.fr th:first-child,table.fr td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);font-weight:600;min-width:120px;z-index:1}
.fc{display:grid;gap:2px;justify-items:center;width:100%;min-width:104px;background:none;border:1px solid transparent;border-radius:7px;padding:6px 4px;color:inherit}
.fc:hover{border-color:var(--accent);background:var(--accent-soft)}
.fc .s{font:600 .76rem var(--f-body);padding:1px 7px;border-radius:10px}
.fc .d{font-size:.74rem;color:var(--muted)}
.s-lib{background:var(--ok-soft);color:var(--ok)} .s-sol{background:var(--warn-soft);color:var(--warn)} .s-falta{background:var(--bad-soft);color:var(--bad)} .s-pronta{background:var(--accent-soft);color:var(--accent)} .s-nada{color:var(--muted)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}

/* botão flutuante */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--accent);color:var(--accent-ink);border:0;border-radius:28px;padding:14px 20px;font:700 1rem var(--f-body);box-shadow:0 8px 24px rgba(0,0,0,.28)}

/* janelas */
.overlay{position:fixed;inset:0;background:rgba(6,20,30,.5);display:grid;place-items:center;padding:12px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:calc(100dvh - 24px);display:grid;grid-template-rows:auto 1fr auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.sheet>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet>header h3{margin:0;font:700 1.2rem var(--f-disp);flex:1}
.sheet>header .x{background:none;border:1px solid var(--line);border-radius:8px;min-width:36px;height:36px;font-size:1.2rem;line-height:1;color:var(--ink)}
.sheet .body{overflow:auto;padding:14px 16px;display:grid;gap:14px;align-content:start}
.sheet>footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.sheet>footer:not(:has(.btn)){display:none}
.fld{display:grid;gap:5px}
.fld>label,.fld>.l{font:600 .72rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.req{color:var(--bad)}
.fld input:not([type=file]):not([type=checkbox]),.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
.fld textarea{min-height:64px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:600 .86rem var(--f-body);color:var(--ink);min-height:36px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.92rem}
.msg{font-size:.86rem;margin-right:auto}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.itens{display:grid;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:start;border:1px solid var(--line);border-radius:9px;padding:8px}
.item textarea{grid-column:1/-1;min-height:46px}
.item select,.item textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:100%;min-width:0}
.arqs{display:flex;flex-wrap:wrap;gap:8px}
.arq{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:var(--muted);text-align:center;padding:4px}
.arq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.arq .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:24px;height:24px;line-height:22px;padding:0}
.addarq{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:8px;padding:9px 13px;font:600 .9rem var(--f-body);color:var(--ink);cursor:pointer}
.addarq input{display:none}
/* ficha */
.fi-tit{margin:0;font:700 1.4rem/1.2 var(--f-disp);overflow-wrap:anywhere}
.fi-loc{margin:0;font:600 .98rem var(--f-body);color:var(--accent)}
.fi-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.86rem;color:var(--muted)}
.fi-desc{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.fi h4{margin:0;font:700 1.02rem var(--f-disp)}
.svc{display:grid;gap:6px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:9px;padding:10px 12px}
.svc.ok{border-left-color:var(--ok)} .svc.falta{border-left-color:var(--bad)}
.svc .h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between}
.svc .h b{font:700 .98rem var(--f-body)}
.svc .ins{margin:0;font-weight:600;white-space:pre-wrap}
.svc .ci{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.svc .ci.ok{color:var(--ok)} .svc .ci.falta{color:var(--bad)}
.viewer .vx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(20,30,40,.72);color:#fff;font:400 1.7rem/1 var(--f-body);display:grid;place-items:center;padding:0 0 3px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.viewer .vx:hover{background:rgba(20,30,40,.92)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:grid;place-items:center;padding:10px}
.viewer img{max-width:calc(100vw - 20px);max-height:calc(100dvh - 20px);object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 15px;border-radius:8px;font-size:.88rem;z-index:50;max-width:calc(100% - 32px)}
@media (max-width:640px){
  .brand::after{display:none}
  .ttl{border-left:0;padding-left:0}
  .hctl{width:auto;margin-left:auto;order:2}
  #bQuem{display:none}
  .lista{grid-template-columns:1fr}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
  .tabs{display:grid}
  .overlay{padding:0;place-items:end stretch}
  .sheet{border-radius:14px 14px 0 0;max-height:94dvh;width:100%}
  .item{grid-template-columns:1fr auto}
  .item select:nth-of-type(2){grid-column:1/2}
}

/* ---------- cerâmicas ---------- */
#tabBody{display:grid;gap:14px;align-content:start}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:2px}
.kpi b{font:700 1.45rem/1.1 var(--f-disp)}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.ruim b{color:var(--bad)} .kpi.bom b{color:var(--ok)}
.prod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.prod>header{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.prod>header h2{margin:0;font:700 1.05rem var(--f-disp)}
.barra{height:8px;border-radius:5px;background:var(--line-2);overflow:hidden;display:flex}
.barra i{display:block;height:100%}
.barra .b-ent{background:var(--accent)} .barra .b-est{background:var(--ok)}
.leg2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.leg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.partida{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.partida>h3{margin:0;padding:8px 10px;background:var(--bg);font:700 .9rem var(--f-body);display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between}
.partida>h3 small{font-weight:600;color:var(--muted)}
.pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line-2);padding:9px 10px;color:inherit}
.pl:hover{background:var(--accent-soft)}
.pl .n{font:700 .92rem var(--f-mono, monospace)}
.pl .d{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.pl .q{font:700 .92rem var(--f-body);text-align:right;white-space:nowrap}
.pl .q small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
.pl.vazio-pl{opacity:.55}
.tag{display:inline-block;font:700 .74rem var(--f-body);padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
/* movimentos */
.dia{display:grid;gap:6px}
.dia>h3{margin:6px 0 0;font:700 .9rem var(--f-disp);color:var(--muted)}
.mv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:9px;padding:9px 11px}
.mv.devolucao{border-left-color:var(--ok)} .mv.quebra{border-left-color:var(--bad)} .mv.ajuste{border-left-color:var(--warn)}
.mv .h{font:700 .82rem var(--f-mono, monospace);color:var(--muted)}
.mv .t{font-weight:600;overflow-wrap:anywhere}
.mv .t small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.mv .q{font:700 .95rem var(--f-body);white-space:nowrap;text-align:right}
.mv .x{background:none;border:0;color:var(--muted);font-size:.8rem;padding:2px 0;text-align:right}
.mv .x:hover{color:var(--bad);text-decoration:underline}
/* apartamentos */
.pav{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:8px}
.pav>h3{margin:0;font:700 .98rem var(--f-disp);display:flex;justify-content:space-between;gap:10px}
.pav>h3 small{font:600 .8rem var(--f-body);color:var(--muted)}
.aps{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.ap{display:grid;gap:1px;text-align:left;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:6px 8px;color:inherit;min-width:0}
.ap:hover{border-color:var(--accent)}
.ap b{font:700 .88rem var(--f-body)} .ap small{font-size:.74rem;color:var(--muted);overflow-wrap:anywhere}
.ap.parcial{border-left-color:var(--warn)} .ap.ok{border-left-color:var(--ok)} .ap.acima{border-left-color:var(--bad)} .ap.mist{box-shadow:inset 0 0 0 2px var(--bad)}
/* estimativa */
.tw{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table.es{border-collapse:collapse;width:100%;font-size:.86rem;min-width:760px}
table.es th,table.es td{padding:6px 8px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
table.es th{font:700 .76rem var(--f-disp);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--bg)}
table.es th.g{text-align:center;border-left:1px solid var(--line)} table.es td.g{border-left:1px solid var(--line)}
table.es td:first-child,table.es th:first-child,table.es td:nth-child(2),table.es th:nth-child(2){text-align:left}
table.es tbody tr{cursor:pointer} table.es tbody tr:hover td{background:var(--accent-soft)}
table.es tfoot td{font-weight:700;background:var(--bg)}
table.es .mut{color:var(--muted);font-size:.78rem}
.partes{display:grid;gap:8px}
.parte{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.8fr) minmax(0,.9fr) auto;gap:6px;align-items:end;border:1px solid var(--line);border-radius:9px;padding:8px}
.parte label{font:600 .68rem var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:grid;gap:3px}
.parte input,.parte select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px;width:100%;min-width:0}
.parte .calc{font:700 .9rem var(--f-body);padding-bottom:8px}
.parte .rm{background:none;border:1px solid var(--line);border-radius:7px;height:36px;width:36px;color:var(--muted)}

<div class="overlay" id="ovl" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ovlT"><header><h3 id="ovlT"></h3><button class="x" id="ovlX" type="button" aria-label="Fechar">×</button></header><div class="body" id="ovlB"></div><footer id="ovlF"></footer></div></div>

  <div class="acoes"><span class="st2" id="scanSt">Abrindo a câmera…</span><label class="btn ghost" style="background:#fff">Tirar foto da etiqueta<input type="file" accept="image/*" capture="environment" id="scanF" hidden></label><button class="btn ghost" style="background:#fff" type="button" id="scanD">Digitar o número</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script src="config.js"></script>
<script>window.NUVEM_FERRAMENTA = 'ceramica';</script>
<script src="nuvem.js"></script>
<script src="listas-comum.js"></script>
<script>
/* =====================================================================
   Cerâmicas
   - Estoque por pallet: os dados da etiqueta (tonalidade, tamanho/calibre,
     lote...). O código quadrado (DataMatrix) da etiqueta traz só a série
     do pallet; por isso o pallet é cadastrado uma vez, ao chegar.
   - Entrega: o almoxarifado lê o código com o celular e diz para quem,
     para qual apartamento/ambiente e quantas caixas. O saldo baixa sozinho.
   - Estimativa por ambiente (piso, parede, rodapé) com margem de perda,
     e o consumo de cada apartamento comparado a ela.
   O saldo é guardado em peças (a tela mostra caixas + peças).
   Regras de acesso no banco (banco.sql, passo 20).
   ===================================================================== */
(function () {
'use strict';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms || 4000); }
const fmtD = s => { if (!s) return '—'; const d = new Date(s); return d.toLocaleDateString('pt-BR'); };
const fmtH = s => new Date(s).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const diaDe = s => { const d = new Date(s); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const n1 = v => (Math.round(v * 10) / 10).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const n2 = v => (+v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const num = v => { const x = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(x) ? x : null; };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const LO = window.ListasObra;
const PAV_PADRAO = ['Térreo', 'Pavimento 02', 'Pavimento 03', 'Pavimento 04', 'Pavimento 05', 'Pavimento 06', 'Cobertura'].map(n => ({ nome: n, unidades: [] }));
// ofícios de quem assenta cerâmica (aparecem primeiro na entrega)
const ASSENTA = ['azulejista', 'ceramista', 'revestimento', 'ladrilheiro', 'assentador'];
const TIPOS = { entrega: 'Entrega', devolucao: 'Devolução', quebra: 'Quebra', ajuste: 'Ajuste' };

let NV = null, sb = null, OBRA = null, OBRA_NOME = '';
let CFG = { pavimentos: [] }, PROD = [], EST = [], PAL = [], MOV = [], FUNC = [];
let TAB = 'entregas';
const ULT = { func: '', pav: '' };   // última pessoa e pavimento escolhidos (entregas em sequência)
const F = { pav: '', func: '', tipo: '' };

/* ---------------- quem pode o quê (o banco confere de novo) ---------------- */
const estoque = () => NV && ['admin', 'engenharia', 'almoxarifado'].includes(NV.perfil);
const edita = () => NV && ['admin', 'engenharia'].includes(NV.perfil);
const nomeDe = e => NV && NV.pessoas ? NV.pessoas.nome(e) : String(e || 'alguém').split('@')[0];
const erroMsg = e => String((e && (e.message || e.error_description)) || e).replace(/^.*?:\s*(?=O pallet|O .+ já recebeu|Informe|Produto)/, '');

/* ---------------- contas ---------------- */
const PROD0 = { nome: '?', larg_cm: 60, comp_cm: 60, pecas_cx: 6, cx_pallet: 40 };
const prodDe = id => PROD.find(p => p.id === id) || PROD0;
const pcx = pal => +prodDe(pal.produto).pecas_cx || 6;
const m2Peca = pr => (+pr.larg_cm || 60) * (+pr.comp_cm || 60) / 10000;
// rendimento do rodapé: a peça cortada em tiras da altura do rodapé
const rendRodape = (pr, h) => { const a = +pr.larg_cm || 60, b = +pr.comp_cm || 60; return Math.max(1, Math.floor(Math.min(a, b) / (+h || 10))) * Math.max(a, b) / 100; };
function pecasCalc(pt, pr) {
  const m = +pt.medida || 0; if (!m) return 0;
  return pt.tipo === 'linear' ? Math.ceil(m / rendRodape(pr, pt.altura_cm) - 1e-9) : Math.ceil(m / m2Peca(pr) - 1e-9);
}
const pecasParte = (pt, pr) => pt.pecas != null && pt.pecas !== '' ? +pt.pecas : pecasCalc(pt, pr);
const baseEst = e => (e.partes || []).reduce((s, pt) => s + pecasParte(pt, prodDe(e.produto)), 0);
const totalEst = e => Math.ceil(baseEst(e) * (1 + (+e.perda || 0) / 100) - 1e-9);   // peças por ambiente, com a perda
const fmtQ = (pc, n) => { const s = pc < 0 ? '−' : '', a = Math.abs(pc), cx = Math.floor(a / n), r = a % n; return s + (cx ? cx + ' cx' : '') + (cx && r ? ' + ' : '') + (r ? r + ' pç' : '') + (!cx && !r ? '0 cx' : ''); };
const fmtCx = (pc, n) => n1(pc / n) + ' cx';
// a entrega é em caixa fechada: o estimado arredondado para caixas inteiras ainda não é "acima"
const limCx = (est, n) => Math.ceil(est / n - 1e-9) * n;
// o que saiu de cada pallet (entregas e quebras menos devoluções e ajustes)
let SAI = {};
function contar() { SAI = {}; for (const m of MOV) SAI[m.pallet] = (SAI[m.pallet] || 0) + (m.tipo === 'entrega' || m.tipo === 'quebra' ? m.pecas : -m.pecas); }
const inicial = p => p.caixas * pcx(p);
const saldo = p => inicial(p) - (SAI[p.id] || 0);
const palDe = id => PAL.find(p => p.id === id) || null;
const partidaTxt = p => [p.tonalidade ? 'TON ' + p.tonalidade : '', p.tamanho ? 'TAM ' + p.tamanho : '', p.lote ? 'Lote ' + p.lote : ''].filter(Boolean).join(' · ') || 'Sem tonalidade/lote';
const partidaK = p => [p.produto, p.qualidade || '', p.tonalidade || '', p.tamanho || '', p.lote || ''].join('|');
const plt = p => p.plt ? 'PLT ' + p.plt : p.serie ? 'Série ' + p.serie : 'Pallet';
// destino de uma entrega
const destK = (pav, un, amb) => [pav || '', un || '', amb || ''].join('|');
const destTxt = m => [m.unidade ? 'Apto ' + m.unidade : m.pavimento, m.unidade ? m.pavimento : '', m.ambiente].filter(Boolean).join(' · ') || 'Sem destino';
const ordPav = n => { const i = CFG.pavimentos.findIndex(x => x.nome === n); return i < 0 ? 999 : i; };
const unidadesDe = pav => ((CFG.pavimentos.find(x => x.nome === pav) || {}).unidades) || [];
const finalDe = u => LO.finalDe(u);
// ambientes da estimativa para um apartamento (pelo final) ou para as áreas do pavimento
function ambientesDe(un, produto) {
  let a = un ? EST.filter(e => e.local === 'apto' && e.final === finalDe(un)) : EST.filter(e => e.local === 'pavimento');
  if (produto && a.some(e => e.produto === produto)) a = a.filter(e => e.produto === produto);
  return a.sort((x, y) => (x.ordem || 0) - (y.ordem || 0));
}
const estDe = (un, amb, produto) => ambientesDe(un, produto).find(e => e.ambiente === amb) || null;
// o que já foi para um destino: peças líquidas e as partidas
function noDestino(pav, un, amb, exceto) {
  const r = { pecas: 0, partidas: new Map(), movs: [] };
  for (const m of MOV) { if (m.id === exceto || destK(m.pavimento, m.unidade, m.ambiente) !== destK(pav, un, amb) || !['entrega', 'devolucao'].includes(m.tipo)) continue;
    r.movs.push(m); r.pecas += m.tipo === 'entrega' ? m.pecas : -m.pecas; const p = palDe(m.pallet); if (p && m.tipo === 'entrega') r.partidas.set(partidaK(p), p); }
  return r;
}

/* ---------------- dados ---------------- */
async function carregar() {
  const [lc, lo, lp, le, lpl, lm, lf] = await Promise.all([
    sb.from('pend_config').select('pavimentos,regras').eq('obra', OBRA).maybeSingle(),
    NV.obras.obter(OBRA),
    sb.from('cer_produtos').select('*').eq('obra', OBRA),
    sb.from('cer_estimativas').select('*').eq('obra', OBRA).order('ordem'),
    sb.from('cer_pallets').select('*').eq('obra', OBRA).order('recebido_em', { ascending: false }),
    sb.from('cer_movs').select('*').eq('obra', OBRA).order('em', { ascending: false }),
    sb.from('pend_funcionarios').select('id,obra,nome,cargos,ativo')
  ]);
  if (lp.error) { const e = new Error(lp.error.message); e.banco = /cer_produtos|relation|schema cache/i.test(lp.error.message || ''); throw e; }
  if (!lo) { const e = new Error('obra não encontrada'); e.naoTem = true; throw e; }
  let cfg = lc; if (cfg.error) cfg = await sb.from('pend_config').select('pavimentos').eq('obra', OBRA).maybeSingle();
  const c = cfg.data || {};
  CFG = { pavimentos: (c.pavimentos && c.pavimentos.length) ? c.pavimentos : PAV_PADRAO, regras: c.regras || {} };
  OBRA_NOME = lo.nome; PROD = lp.data || []; EST = le.data || []; PAL = lpl.data || []; MOV = lm.data || [];
  FUNC = (lf.data || []).filter(f => f.ativo !== false && (!f.obra || f.obra === OBRA));
  contar();
}
async function recarregar() { try { await carregar(); render(); const o = $('ovl'); if (!o.hidden && o.dataset.pal && !o.dataset.form) fichaPallet(o.dataset.pal); } catch (e) { console.warn(e); } }
document.addEventListener('visibilitychange', () => { if (!document.hidden && NV) recarregar(); });

/* ======================= telas ======================= */
function render() {
  const m = $('main'), nEst = PAL.filter(p => saldo(p) > 0).length;
  m.innerHTML = `<nav class="crumbs" aria-label="Caminho"><a href="index.html">Obras</a><span>›</span><a href="index.html?obra=${encodeURIComponent(OBRA)}">${esc(OBRA_NOME)}</a><span>›</span><span>Cerâmicas</span></nav>
    ${TAB === 'estimativa' ? `<div class="tabs" style="justify-content:space-between"><h2 style="margin:0;font:700 1.25rem var(--f-disp)">Estimativa</h2><button type="button" class="btn ghost sm" data-tab="entregas">‹ Voltar às entregas</button></div>`
      : `<div class="tabs"><div class="seg">${[['entregas', 'Entregas'], ['estoque', 'Estoque', nEst], ['aptos', '<span class="lg">Apartamentos</span><span class="sm">Aptos</span>']]
      .map(([k, t, n]) => `<button type="button" class="tab" data-tab="${k}" aria-pressed="${TAB === k}">${t}${n ? '<b>' + n + '</b>' : ''}</button>`).join('')}</div></div>`}
    <div id="tabBody"></div>`;
  m.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { TAB = b.dataset.tab; render(); });
  ({ estoque: renderEstoque, entregas: renderEntregas, aptos: renderAptos, estimativa: renderEstimativa })[TAB]();
  $('fab').hidden = !estoque();
}

/* ---------------- Estoque ---------------- */
function renderEstoque() {
  const B = $('tabBody');
  const totCx = PAL.reduce((s, p) => s + Math.max(0, saldo(p)) / pcx(p), 0);
  const entregue = MOV.filter(m => m.tipo === 'entrega').reduce((s, m) => { const p = palDe(m.pallet); return s + (p ? m.pecas / pcx(p) : 0); }, 0);
  const prods = PROD.filter(pr => PAL.some(p => p.produto === pr.id) || EST.some(e => e.produto === pr.id));
  B.innerHTML = `<div class="resumo">
      <div class="kpi"><b>${Math.floor(totCx).toLocaleString('pt-BR')}</b><span>caixas em estoque</span></div>
      <div class="kpi"><b>${PAL.filter(p => saldo(p) > 0).length}</b><span>pallets com saldo</span></div>
      <div class="kpi"><b>${Math.round(entregue).toLocaleString('pt-BR')}</b><span>caixas entregues</span></div>
    </div>
    ${estoque() ? `<div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn" type="button" id="bReceber">+ Receber pallet</button>${edita() ? '<button class="btn ghost" type="button" id="bProd">Produtos</button>' : ''}</div>` : ''}
    ${prods.length ? prods.map(prodHtml).join('') : `<div class="vazio"><h3>Nenhum pallet recebido</h3><p class="muted" style="margin:0">${estoque() ? 'Quando chegar material, toque em <b>Ler etiqueta</b> ou em <b>+ Receber pallet</b> e preencha os dados da etiqueta (tonalidade, tamanho e lote). Depois, cada entrega é só ler o código do pallet.' : 'Os pallets recebidos aparecem aqui.'}</p></div>`}`;
  if ($('bReceber')) $('bReceber').onclick = () => formPallet(null, {});
  if ($('bProd')) $('bProd').onclick = listaProdutos;
  B.querySelectorAll('[data-pal]').forEach(b => b.onclick = () => fichaPallet(b.dataset.pal));
  B.querySelectorAll('[data-vazios]').forEach(b => b.onclick = () => { b.closest('.partida').querySelectorAll('.vazio-pl').forEach(x => x.hidden = !x.hidden); b.remove(); });
}
function prodHtml(pr) {
  const pals = PAL.filter(p => p.produto === pr.id), n = +pr.pecas_cx || 6;
  const nec = EST.filter(e => e.produto === pr.id).reduce((s, e) => s + totalEst(e) * (+e.qtd || 0), 0);
  const rec = pals.reduce((s, p) => s + inicial(p), 0), sal = pals.reduce((s, p) => s + Math.max(0, saldo(p)), 0), ent = rec - sal;
  const falta = nec - rec;
  // partidas: produto + qualidade + tonalidade + tamanho + lote
  const parts = new Map(); pals.forEach(p => { const k = partidaK(p); if (!parts.has(k)) parts.set(k, []); parts.get(k).push(p); });
  const max = Math.max(nec, rec, 1);
  return `<section class="prod"><header><h2>${esc(pr.nome)}${pr.codigo ? ' <span class="muted">' + esc(pr.codigo) + '</span>' : ''}</h2><span class="muted">${n2(pr.larg_cm)}×${n2(pr.comp_cm)} cm · ${n} pç/cx · ${pr.cx_pallet} cx/pallet</span></header>
    ${nec ? `<div style="display:grid;gap:5px"><div class="barra" title="Recebido ${fmtCx(rec, n)} de ${fmtCx(nec, n)} estimadas"><i class="b-ent" style="width:${ent / max * 100}%"></i><i class="b-est" style="width:${sal / max * 100}%"></i></div>
      <div class="leg2"><span><i style="background:var(--accent)"></i>Entregue ${fmtCx(ent, n)}</span><span><i style="background:var(--ok)"></i>Em estoque ${fmtCx(sal, n)}</span><span>Estimado para a obra: <b>${fmtCx(nec, n)}</b> (${n1(nec / n / (+pr.cx_pallet || 40))} pallets)</span>${falta > 0 ? `<span class="ruim"><b style="color:var(--bad)">Falta receber ${fmtCx(falta, n)}</b></span>` : rec ? '<span style="color:var(--ok)"><b>Recebido tudo o estimado</b></span>' : ''}</div></div>` : ''}
    ${[...parts.values()].map(ps => { const s = ps.reduce((a, p) => a + Math.max(0, saldo(p)), 0), vz = ps.filter(p => saldo(p) <= 0).length;
      return `<div class="partida"><h3><span>${esc(partidaTxt(ps[0]))}${ps[0].qualidade && ps[0].qualidade !== 'A' ? ' <span class="tag warn">Qual ' + esc(ps[0].qualidade) + '</span>' : ''}</span><small>${fmtQ(s, n)} em ${ps.filter(p => saldo(p) > 0).length} pallet(s)</small></h3>
        ${ps.map(p => `<button type="button" class="pl${saldo(p) <= 0 ? ' vazio-pl' : ''}" data-pal="${esc(p.id)}" ${saldo(p) <= 0 ? 'hidden' : ''}><span class="n">${esc(plt(p))}</span><span class="d">${p.posicao ? esc(p.posicao) + ' · ' : ''}recebido ${fmtD(p.recebido_em)}${p.serie ? ' · série ' + esc(p.serie) : ''}</span><span class="q">${fmtQ(Math.max(0, saldo(p)), n)}<small>de ${p.caixas} cx</small></span></button>`).join('')}

/* ---------------- Entregas (movimentos) ---------------- */

  const grupos = []; const porEnt = new Map();
  vis.forEach(m => { if (m.entrega) { if (porEnt.has(m.entrega)) { const g = porEnt.get(m.entrega); g.locais.push(m); g.pecasT += m.pecas; return; } const g = Object.assign({}, m, { locais: [m], pecasT: m.pecas }); porEnt.set(m.entrega, g); grupos.push(g); }
    else grupos.push(Object.assign({}, m, { locais: [m], pecasT: m.pecas })); });

  const locTxt = m => m.locais.length > 1 ? m.locais.length + ' locais: ' + m.locais.map(x => (x.unidade || x.pavimento) + (x.unidade && ambientesDe(x.unidade).length > 1 ? ' ' + String(x.ambiente || '').replace(/^Banheiro\s*/i, '') : '')).join(', ') + ' · ' + [...new Set(m.locais.map(x => x.pavimento))].join(', ') : destTxt(m);
  const podeApagar = m => edita() || (estoque() && String(m.por || '').toLowerCase() === String(NV.usuario.email || '').toLowerCase() && Date.now() - new Date(m.em) < 864e5);

      <select class="fsel${F.pav ? ' on' : ''}" id="fPav" aria-label="Pavimento"><option value="">Todos os pavimentos</option>${pavs.map(n => `<option ${n === F.pav ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <select class="fsel${F.func ? ' on' : ''}" id="fFunc" aria-label="Pessoa"><option value="">Todas as pessoas</option>${pess.map(n => `<option ${n === F.func ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    </div>

        return `<div class="mv ${m.tipo}"><span class="h">${fmtH(m.em)}</span><span class="t">${m.tipo === 'entrega' ? esc(m.funcionario_nome || 'Sem pessoa') + ' · ' + esc(locTxt(m)) : TIPOS[m.tipo] + (m.unidade || m.pavimento ? ' · ' + esc(destTxt(m)) : '')}
          <small>${esc(plt(p))} · ${esc(partidaTxt(p))} · por ${esc(nomeDe(m.por))}${m.obs ? ' · ' + esc(m.obs) : ''}${m.excecao ? ' · <b style="color:var(--bad)">outra partida liberada pela Engenharia: ' + esc(m.excecao) + '</b>' : ''}</small></span>
          <span style="display:grid;justify-items:end"><span class="q">${m.tipo === 'devolucao' ? '+' : ''}${fmtQ(m.pecasT, n)}</span>${podeApagar(m) ? `<button type="button" class="x" data-del="${esc(m.entrega || m.id)}" data-ent="${m.entrega ? 1 : ''}">Desfazer</button>` : ''}</span></div>`; }).join('')}</section>`).join('')

}

/* ---------------- Apartamentos: entregue × estimado ---------------- */
function situacao(pav, un, e) {
  const d = noDestino(pav, un, e.ambiente), est = totalEst(e), lim = limCx(est, pcx({ produto: e.produto }));
  const k = d.pecas <= 0 ? '' : d.pecas > lim ? 'acima' : d.pecas >= est ? 'ok' : 'parcial';
  return { d, est, k, mist: d.partidas.size > 1 };
}

  const html = pavs.map(p => {
    const cel = [];
    for (const u of p.unidades || []) for (const e of ambientesDe(u)) { const s = situacao(p.nome, u, e); nTot++; if (s.k === 'ok') nOk++; else if (s.k === 'parcial') nPar++; else if (s.k === 'acima') nAc++; if (s.mist) nMist++;

    for (const e of ambientesDe(null)) { const s = situacao(p.nome, '', e); nTot++; const np = pcx({ produto: e.produto });
      cel.push(`<button type="button" class="ap ${s.k}${s.mist ? ' mist' : ''}" data-ap='${esc(JSON.stringify([p.nome, '', e.ambiente]))}'><b>${esc(e.ambiente)}</b><small>${s.d.pecas ? fmtQ(s.d.pecas, np) + ' de ' + Math.ceil(s.est / np) + ' cx' : Math.ceil(s.est / np) + ' cx · nada entregue'}</small></button>`); }
    return cel.length ? `<section class="pav"><h3>${esc(p.nome)}</h3><div class="aps">${cel.join('')}</div></section>` : '';
  }).join('');
  // entregas para destinos fora do cadastro (ex.: apartamento digitado)
  B.innerHTML = EST.length ? `<div class="resumo q4"><div class="kpi bom"><b>${nOk}</b><span>ambientes completos</span></div><div class="kpi"><b>${nPar}</b><span>com entrega parcial</span></div>
      <div class="kpi${nAc ? ' ruim' : ''}"><b>${nAc}</b><span>acima do estimado</span></div><div class="kpi${nMist ? ' ruim' : ''}"><b>${nMist}</b><span>com duas partidas (tonalidade/lote)</span></div></div>
    <div class="leg2"><span><i style="background:var(--line)"></i>Nada entregue</span><span><i style="background:var(--warn)"></i>Parcial</span><span><i style="background:var(--ok)"></i>Completo</span><span><i style="background:var(--bad)"></i>Acima do estimado</span></div>
    ${html || '<div class="vazio"><h3>Nenhum apartamento cadastrado</h3><p class="muted" style="margin:0">Os apartamentos de cada pavimento vêm do cadastro das Pendências (Listas e regras → Pavimentos). O ambiente é ligado pelo final do apartamento (ex.: 401 → final 01).</p></div>'}`
    : `<div class="vazio"><h3>Sem estimativa</h3><p class="muted" style="margin:0">Cadastre em <b>Configurações (engrenagem) → Estimativa de cerâmicas</b> quanto vai em cada ambiente para comparar com o que foi entregue.</p></div>`;

function fichaDestino(pav, un, amb) {

/* ---------------- Entrega para um ou vários locais ----------------
   - Uma partida por andar: se o andar já tem outra partida (tonalidade, tamanho ou lote)
     deste produto, os locais dele ficam bloqueados (a Engenharia pode liberar com justificativa).
   - As caixas têm que bater com o que os locais marcados ainda precisam (pela estimativa):
     nem menos (faltaria num local) nem mais (sobraria). */
// partidas deste produto que já estão no andar (entregues menos devolvidas), diferentes da do pallet
function outrasPartidas(pav, p) {
  const net = new Map();
  for (const m of MOV) { if (m.pavimento !== pav || !['entrega', 'devolucao'].includes(m.tipo)) continue; const q = palDe(m.pallet); if (!q || q.produto !== p.produto) continue;
    const k = partidaK(q); if (!net.has(k)) net.set(k, { p: q, v: 0 }); net.get(k).v += m.tipo === 'entrega' ? m.pecas : -m.pecas; }
  return [...net.entries()].filter(([k, o]) => k !== partidaK(p) && o.v > 0).map(([, o]) => o.p);
}
function formEntrega(palId) {

  const precisa = d => { const e = estDe(d.un || null, d.amb, p.produto); if (!e) return null; return Math.max(0, totalEst(e) - noDestino(d.pav, d.un, d.amb).pecas); };
  const rot = d => (d.un ? d.un : 'Pav.') + (ambientesDe(d.un || null, p.produto).length > 1 || !d.un ? ' · ' + (d.un ? d.amb.replace(/^Banheiro\s*/i, '') || d.amb : d.amb) : '');

    let ok = false, aviso = '';
    if (!f.sel.length) aviso = '';
    else if (!N) aviso = 'Os locais marcados já receberam tudo o estimado.';
    else if (q > s) aviso = `O pallet tem só ${fmtQ(s, n)}. Desmarque locais (os marcados precisam de ${fmtQ(N, n)}).`;
    else if (q > limCx(N, n)) aviso = `${fmtQ(q, n)} é mais do que os locais marcados usam (${B} cx). Marque mais locais ou diminua para ${B} cx.`;
    else if (q <= (B - 1) * n) aviso = `${fmtQ(q, n)} não cobre os locais marcados (precisam de ${B} cx). Aumente para ${B} cx ou desmarque um local.`;
    else ok = true;
    const pavAtual = f.pav ? CFG.pavimentos.find(x => x.nome === f.pav) : null, uns = pavAtual ? pavAtual.unidades || [] : [];
    const outras = f.pav ? bloq(f.pav) : [], liberadoPorExc = outras.length && edita() && f.exc.trim();
    const selDoPav = pav => f.sel.filter(d => d.pav === pav).length;
    const chip = d => { const k = K(d), on = f.sel.some(x => K(x) === k), pn = precisa(d), dis = !on && (pn === 0 || pn == null || (outras.length && !liberadoPorExc));

    const locais = [];
    for (const u of uns) for (const e of ambientesDe(u, p.produto)) locais.push({ pav: f.pav, un: u, amb: e.ambiente });
    for (const e of ambientesDe(null, p.produto)) locais.push({ pav: f.pav, un: '', amb: e.ambiente });
    openSheet('Entregar', `
      <div class="palinfo"><b>${esc(plt(p))} · ${esc(pr.nome)}</b><span class="tags"><span class="tag">${esc(partidaTxt(p))}</span>${p.qualidade ? `<span class="tag${p.qualidade !== 'A' ? ' warn' : ''}">Qual ${esc(p.qualidade)}</span>` : ''}</span><span>Saldo do pallet: <b>${fmtQ(s, n)}</b></span></div>
      <div class="fld"><span class="l">Para quem <span class="req">*</span></span><div class="opts">${(f.todos || !assenta.length ? FUNC : assenta).map(x => `<button type="button" class="opt" data-func="${esc(x.id)}" aria-pressed="${f.func === x.id}">${esc(x.nome)}</button>`).join('')}
        ${assenta.length && !f.todos ? '<button type="button" class="opt" data-todos style="border-style:dashed">Outra pessoa…</button>' : ''}</div>${!FUNC.length ? '<span class="muted">Nenhum funcionário cadastrado nesta obra (Listas e regras → Funcionários).</span>' : ''}</div>

      ${f.pav ? `${outras.length ? `<div class="aviso2 bad"><b>${esc(f.pav)} já recebeu outra partida deste produto:</b> ${outras.map(x => esc(partidaTxt(x))).join(' e ')}. Este pallet é <b>${esc(partidaTxt(p))}</b>. Para não misturar tonalidade no mesmo andar, este pallet não pode ir para este andar${edita() ? '.' : '. Use um pallet da mesma partida ou fale com a Engenharia.'}

      ${f.sel.length ? `<div class="tot"><span><b>${f.sel.length} local(is) marcado(s)</b> · precisam de <b>${fmtQ(N, n)}</b> (${N} peças) = <b>${B} cx</b></span>

        ${aviso ? `<div class="aviso2 bad">${aviso}</div>` : ok ? `<span class="muted" style="color:var(--ok)">✓ ${fmtQ(q, n)} fecha com os locais marcados.</span>` : '<span class="muted">Marque os locais: a quantidade é calculada pela estimativa de cada um.</span>'}</div>
      <div class="fld"><label for="mObs">Observação (opcional)</label><input id="mObs" value="${esc(f.obs)}"></div>`,
      `<span class="msg" id="mMsg"></span><button class="btn" type="button" id="mOk" ${ok && f.func ? '' : 'aria-disabled="true"'}>Registrar entrega</button>`, true);
    const Bx = $('ovlB');
    const ler = () => { f.obs = $('mObs').value.trim(); if ($('eExc')) f.exc = $('eExc').value; const c = $('mCx').value === '' ? null : Math.max(0, parseInt($('mCx').value, 10) || 0), pc = Math.max(0, Math.min(n - 1, parseInt(($('mPc') || {}).value, 10) || 0));
      if (c !== f.cx || pc !== (f.pc || 0)) { f.cx = c; f.pc = pc; f.cxMao = true; } };
    const re = () => { const y = $('ovlB').scrollTop; desenhar(); $('ovlB').scrollTop = y; };
    Bx.querySelectorAll('[data-func]').forEach(b => b.onclick = () => { ler(); f.func = b.dataset.func; re(); });
    Bx.querySelectorAll('[data-todos]').forEach(b => b.onclick = () => { ler(); f.todos = true; re(); });
    Bx.querySelectorAll('[data-pav]').forEach(b => b.onclick = () => { ler(); f.pav = b.dataset.pav; re(); });
    Bx.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { ler(); const d = JSON.parse(b.dataset.sel), k = K(d), i = f.sel.findIndex(x => K(x) === k); if (i >= 0) f.sel.splice(i, 1); else f.sel.push(d); f.cxMao = false; re(); });

/* ---------------- Devolução e quebra (e entrega antiga, de um local) ---------------- */
function formMov(palId, tipo) {
  if (tipo === 'entrega') return formEntrega(palId);
  const p = palDe(palId); if (!p) return;
  const pr = prodDe(p.produto), n = pcx(p);
  const f = { func: tipo === 'entrega' ? ULT.func : '', pav: tipo !== 'quebra' ? ULT.pav : '', un: '', amb: '', cx: null, pc: 0, obs: '', todos: false, texto: '' };
  const assenta = FUNC.filter(x => (x.cargos || []).some(c => ASSENTA.includes(String(c).toLowerCase())));
  const desenhar = () => {
    const s = saldo(p), uns = f.pav ? unidadesDe(f.pav) : [], ambs = f.pav ? ambientesDe(f.un || null, p.produto) : [];
    if (f.pav && ambs.length === 1 && (f.un || !uns.length)) f.amb = ambs[0].ambiente;
    const e = f.amb ? estDe(f.un || null, f.amb, p.produto) : null, d = f.pav && (f.amb || !ambs.length) ? noDestino(f.pav, f.un, f.amb) : null;
    const est = e ? totalEst(e) : 0, falta = e ? Math.max(0, est - (d ? d.pecas : 0)) : 0;
    if (f.cx == null && tipo === 'entrega' && e) f.cx = Math.min(Math.floor(s / n), Math.ceil(falta / n)) || null;
    const qt = (f.cx || 0) * n + (f.pc || 0);
    const outras = d ? [...d.partidas.values()].filter(x => partidaK(x) !== partidaK(p)) : [];
    const pessoas = f.todos || !assenta.length ? FUNC : assenta;
    const titulo = { entrega: 'Entregar', devolucao: 'Devolução ao estoque', quebra: 'Registrar quebra' }[tipo];
    openSheet(titulo, `
      <div class="palinfo"><b>${esc(plt(p))} · ${esc(pr.nome)}</b><span class="tags"><span class="tag">${esc(partidaTxt(p))}</span>${p.qualidade ? `<span class="tag${p.qualidade !== 'A' ? ' warn' : ''}">Qual ${esc(p.qualidade)}</span>` : ''}</span><span>Saldo do pallet: <b>${fmtQ(s, n)}</b></span></div>
      ${tipo === 'entrega' ? `<div class="fld"><span class="l">Para quem <span class="req">*</span></span><div class="opts">${pessoas.map(x => `<button type="button" class="opt" data-func="${esc(x.id)}" aria-pressed="${f.func === x.id}">${esc(x.nome)}</button>`).join('')}

        ${f.pav ? (uns.length ? `<div class="fld"><span class="l">Apartamento</span><div class="opts">${uns.map(u => `<button type="button" class="opt" data-un="${esc(u)}" aria-pressed="${f.un === u}">${esc(u)}</button>`).join('')}${ambientesDe(null, p.produto).length ? `<button type="button" class="opt" data-un="" aria-pressed="${!f.un && !!f.amb}">Áreas do pavimento</button>` : ''}</div></div>`
          : `<div class="fld"><label for="mUn">Apartamento</label><input id="mUn" inputmode="numeric" placeholder="Ex.: 201" value="${esc(f.un)}"></div>`) : ''}
        ${f.pav && ambs.length > 1 && (f.un || !uns.length || f.amb) ? `<div class="fld"><span class="l">Qual ambiente <span class="req">*</span></span><div class="opts">${ambs.map(a => `<button type="button" class="opt" data-amb="${esc(a.ambiente)}" aria-pressed="${f.amb === a.ambiente}">${esc(a.ambiente)}</button>`).join('')}</div></div>` : ''}` : ''}

    B.querySelectorAll('[data-amb]').forEach(b => b.onclick = () => { ler(); f.amb = b.dataset.amb; if (tipo === 'entrega') f.cx = null; redesenhar(); });

    $('mMenos').onclick = () => { ler(); f.cx = Math.max(0, (f.cx || 0) - 1); redesenhar(); };

    $('mCx').onchange = () => { ler(); redesenhar(); }; if ($('mPc')) $('mPc').onchange = () => { ler(); redesenhar(); };

      ler(); const q = (f.cx || 0) * n + (f.pc || 0), ms = $('mMsg'); const erro = t => { ms.className = 'msg err'; ms.textContent = t; };
      if (tipo === 'entrega' && !f.func) return erro('Escolha para quem.');

      if (tipo === 'entrega' && uns.length && !f.un && !f.amb) return erro('Escolha o apartamento.');
      if (f.pav && ambs.length > 1 && !f.amb && (f.un || tipo === 'entrega')) return erro('Escolha o ambiente.');

// no iPhone (e onde não houver) usa a biblioteca zxing-wasm.
const ZX = 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/iife/reader/index.js';
const ZX_WASM = 'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/reader/zxing_reader.wasm';
let detectorP = null;
function carregarScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('sem internet para carregar o leitor')); document.head.appendChild(s); }); }
function detector() {
  if (detectorP) return detectorP;
  detectorP = (async () => {
    if ('BarcodeDetector' in window) try {
      const fs = await window.BarcodeDetector.getSupportedFormats();
      if (fs.includes('data_matrix')) { const d = new window.BarcodeDetector({ formats: ['data_matrix', 'qr_code'] }); return async cv => { const r = await d.detect(cv); return r[0] ? r[0].rawValue : null; }; }
    } catch (e) {}
    if (!window.ZXingWASM) await carregarScript(ZX);
    window.ZXingWASM.setZXingModuleOverrides({ locateFile: (f, pre) => f.endsWith('.wasm') ? ZX_WASM : pre + f });
    return async cv => { const id = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height);
      const r = await window.ZXingWASM.readBarcodes(id, { formats: ['DataMatrix', 'QRCode'], tryHarder: true, maxNumberOfSymbols: 1 }); return r[0] && r[0].isValid !== false ? r[0].text : null; };
  })();
  detectorP.catch(() => { detectorP = null; });
  return detectorP;
}
const limpar = t => String(t || '').trim();
async function decodificarArquivo(arq) {
  const url = URL.createObjectURL(arq); const img = new Image();
  try { await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; }); } finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
  const det = await detector();
  for (const lado of [1600, 2400, 1000]) {
    const sc = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight)); const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const t = await det(cv).catch(() => null); cv.width = cv.height = 0; if (t) return limpar(t);
  }
  return null;
}
// abre a câmera e devolve o texto do código (ou null se cancelar)
function lerCodigo(dica) {
  return new Promise(resolve => {
    const box = $('scan'), v = $('scanV'), st = $('scanSt'); let fim = false, stream = null, t = null;
    box.querySelector('.dica').textContent = dica || 'Aponte para o código quadrado da etiqueta do pallet';
    const acabar = val => { if (fim) return; fim = true; clearTimeout(t); if (stream) stream.getTracks().forEach(x => x.stop()); v.srcObject = null; box.hidden = true; $('scanF').value = ''; resolve(val ? limpar(val) : null); };
    box.hidden = false; st.textContent = 'Abrindo a câmera…';
    $('scanX').onclick = () => acabar(null);
    $('scanD').onclick = () => { const x = prompt('Número embaixo do código (ex.: 1006107494):'); if (x && x.trim()) acabar(x); };
    $('scanF').onchange = async ev => { const a = ev.target.files && ev.target.files[0]; if (!a) return; st.textContent = 'Lendo a foto…';
      const c = await decodificarArquivo(a).catch(e => { st.textContent = 'Não foi possível: ' + (e.message || e); return null; });
      if (c) acabar(c); else if (!fim) st.textContent = 'Não achei o código na foto. Tente mais perto, com a etiqueta inteira e sem reflexo, ou digite o número.'; };
    const cv = document.createElement('canvas');
    const ciclo = async det => {
      if (fim) return;
      if (v.readyState >= 2 && v.videoWidth) {
        const sc = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight)); cv.width = Math.round(v.videoWidth * sc); cv.height = Math.round(v.videoHeight * sc);
        cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
        try { const c = await det(cv); if (c) { if (navigator.vibrate) navigator.vibrate(80); acabar(c); return; } } catch (e) {}
      }
      t = setTimeout(() => ciclo(det), 220);
    };
    (async () => {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('câmera indisponível neste navegador');
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
        if (fim) { stream.getTracks().forEach(x => x.stop()); return; }
        v.srcObject = stream; await v.play().catch(() => {});
        st.textContent = 'Procurando o código…';
        const det = await detector(); ciclo(det);
      } catch (e) { if (!fim) st.textContent = 'Sem câmera ao vivo (' + (e.message || e.name || e) + '). Use "Tirar foto da etiqueta" ou digite o número.'; }
    })();
  });
}
// botão principal: lê a etiqueta e abre a entrega (ou o recebimento, se o pallet ainda não existe)
async function lerEtiqueta() {
  const c = await lerCodigo(); if (!c) return;
  const p = PAL.find(x => x.serie === c || (x.serie && c.includes(x.serie)));
  if (!p) {
    openSheet('Pallet não cadastrado', `<p style="margin:0">O código <b>${esc(c)}</b> ainda não está no estoque.</p><p class="muted" style="margin:0">Se o pallet acabou de chegar, registre o recebimento com os dados da etiqueta. Da próxima vez, ler este código já abre a entrega.</p>`,
      '<button class="btn ghost" type="button" id="nlOutro">Ler outro</button><button class="btn" type="button" id="nlRec">Receber este pallet</button>');
    $('nlOutro').onclick = () => { closeSheet(); lerEtiqueta(); };
    $('nlRec').onclick = () => formPallet(null, { serie: c });
    return;
  }
  if (saldo(p) <= 0) { toast(plt(p) + ' está vazio (já saiu tudo). Para devolver peças a ele, abra o pallet no Estoque.', 6000); fichaPallet(p.id); return; }
  formMov(p.id, 'entrega');
}

/* ---------------- janelas ---------------- */
function openSheet(t, body, foot, form) { const o = $('ovl'); delete o.dataset.pal; $('ovlT').textContent = t; $('ovlB').innerHTML = body; $('ovlF').innerHTML = foot || ''; o.hidden = false; if (form) o.dataset.form = '1'; else delete o.dataset.form; $('ovlB').scrollTop = 0; }
function closeSheet() { const o = $('ovl'); o.hidden = true; $('ovlB').innerHTML = ''; $('ovlF').innerHTML = ''; delete o.dataset.form; delete o.dataset.pal; render(); }
$('ovl').addEventListener('click', ev => { if (ev.target === $('ovl') && !$('ovl').dataset.form) closeSheet(); });
$('ovlX').onclick = () => { if ($('ovl').dataset.form && !confirm('Fechar sem salvar?')) return; closeSheet(); };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if (!$('viewer').hidden) { $('viewer').hidden = true; return; } if (!$('ovl').hidden && !$('ovl').dataset.form) closeSheet(); } });
$('viewer').onclick = () => { $('viewer').hidden = true; };
$('viewerX').onclick = ev => { ev.stopPropagation(); $('viewer').hidden = true; };
document.addEventListener('click', ev => { const img = ev.target.closest('img.etq'); if (!img || !img.src) return; $('viewerImg').src = img.src; $('viewer').hidden = false; });

async function comprimir(arq) {
  const url = URL.createObjectURL(arq); const img = new Image();
  try { await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('não foi possível ler a imagem')); img.src = url; }); }
  finally { setTimeout(() => URL.revokeObjectURL(url), 2000); }
  for (const lado of [1600, 1200, 900]) {
    const sc = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.naturalWidth * sc)); cv.height = Math.max(1, Math.round(img.naturalHeight * sc));
    const ctx = cv.getContext('2d'); if (!ctx) continue;
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const b = await new Promise(r => { try { cv.toBlob(r, 'image/jpeg', .8); } catch (e) { r(null); } });
    cv.width = cv.height = 0;
    if (b && b.size) return b;
  }
  if (/jpe?g/i.test(arq.type) && arq.size < 8e6) return arq;
  throw new Error('não foi possível reduzir a foto');
}

/* ======================= início ======================= */
(async function iniciar() {
  NV = await (window.NUVEM_PRONTA || Promise.resolve(null));
  if (!NV) { $('main').innerHTML = '<div class="vazio"><h3>Precisa do banco online</h3><p class="muted" style="margin:0">O estoque de cerâmicas é compartilhado pela equipe e precisa do Supabase configurado no config.js.</p></div>'; return; }
  sb = NV.cliente; OBRA = NV.obraId;
  try { await carregar(); }
  catch (e) {
    if (e.naoTem) { $('main').innerHTML = '<div class="vazio"><h3>Obra não encontrada</h3><a class="btn" href="index.html" style="text-decoration:none">Ver as obras</a></div>'; return; }
    if (e.banco) { $('main').innerHTML = '<div class="vazio"><h3>Falta preparar o banco</h3><p class="muted" style="margin:0">Rode o arquivo <b>banco.sql</b> no Supabase (SQL Editor) e recarregue a página.</p></div>'; return; }
    $('main').innerHTML = `<div class="vazio"><h3>Não foi possível carregar</h3><p class="muted" style="margin:0">${esc(e.message || e)}</p><button class="btn" onclick="location.reload()">Recarregar</button></div>`; return;
  }
  $('obraNome').textContent = OBRA_NOME; document.title = OBRA_NOME + ' · Cerâmicas';
  $('fab').onclick = lerEtiqueta;
  $('bEst').onclick = () => { TAB = 'estimativa'; render(); window.scrollTo(0, 0); };
  const q = new URLSearchParams(location.search);
  if (['estoque', 'entregas', 'aptos', 'estimativa'].includes(q.get('aba'))) TAB = q.get('aba');
  render();
  // carrega o leitor em segundo plano (a primeira leitura fica rápida)
  if (estoque()) setTimeout(() => detector().catch(() => {}), 1500);
  try { sb.channel('cer-' + OBRA).on('postgres_changes', { event: '*', schema: 'public', table: 'cer_movs', filter: 'obra=eq.' + OBRA }, () => { clearTimeout(iniciar.t); iniciar.t = setTimeout(recarregar, 500); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'cer_pallets', filter: 'obra=eq.' + OBRA }, () => { clearTimeout(iniciar.t); iniciar.t = setTimeout(recarregar, 500); }).subscribe(); } catch (e) {}
})();
})();
