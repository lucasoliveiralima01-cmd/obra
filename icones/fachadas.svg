 <path d="M769 703 C769 644 821 614 861 650 C913 696 850 774 823 812 C796 777 769 741 769 703 Z" fill="url(#orange)" stroke="#0D2D46" stroke-width="14"/>
 <circle cx="824" cy="696" r="24" fill="#E6F1F4"/>
