  <rect x="286" y="339" width="150" height="88" rx="9"/>
  <rect x="539" y="339" width="171" height="88" rx="9"/>
  <rect x="286" y="499" width="150" height="87" rx="9"/>
  <rect x="539" y="499" width="171" height="87" rx="9"/>
  <rect x="286" y="664" width="150" height="88" rx="9"/>
  <rect x="539" y="664" width="171" height="88" rx="9"/>
 </g>
 <path d="M310 351 V406 M561 351 V406 M310 512 V565 M561 512 V565 M310 677 V730 M561 677 V730" stroke="#6F95AC" stroke-width="12" opacity=".65"/>
</g>
<!-- Survey highlight: orange dashed zone & four scan corners -->
<rect x="267" y="474" width="465" height="142" rx="13" fill="#FFA52A" fill-opacity=".10" stroke="#FFA52A" stroke-width="14" stroke-dasharray="26 17"/>
<g stroke="#FFAB32" stroke-width="25" fill="none" stroke-linecap="round" stroke-linejoin="round">
