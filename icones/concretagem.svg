<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#244A66"/><stop offset="0.52" stop-color="#163852"/><stop offset="1" stop-color="#102B43"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8F9"/><stop offset="1" stop-color="#CBDDE6"/></linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC04F"/><stop offset="1" stop-color="#F18A20"/></linearGradient>
<linearGradient id="concrete" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDE8EE"/><stop offset=".55" stop-color="#9EB4C1"/><stop offset="1" stop-color="#6A8394"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FC7563"/><stop offset="1" stop-color="#DB4141"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#041D2E" flood-opacity="0.23"/></filter>
</defs>
<rect x="65" y="65" width="894" height="894" rx="190" fill="url(#tile)"/>
<rect x="82" y="82" width="860" height="860" rx="176" fill="none" stroke="#52748B" stroke-width="9" opacity=".65"/>
<path d="M182 250 C245 168 341 150 460 150" fill="none" stroke="#8EB1C4" stroke-opacity=".11" stroke-width="13" stroke-linecap="round"/>

<!-- Pouring bucket and rising structural frame -->
<g stroke-linejoin="round" stroke-linecap="round">
 <!-- slab formwork bottom, big shape to stay readable at 32px -->
 <path d="M167 645 L485 550 L858 660 L538 787 Z" fill="url(#concrete)" stroke="#0D2D46" stroke-width="25"/>
 <path d="M167 645 V740 L538 866 V787 Z" fill="#A66A2F" stroke="#0D2D46" stroke-width="23"/>
 <path d="M538 787 L858 660 V758 L538 866 Z" fill="#C38A43" stroke="#0D2D46" stroke-width="23"/>
 <path d="M208 714 L537 823 L811 714" fill="none" stroke="#EE9F3A" stroke-width="21"/>
 <!-- rebar grids at back left -->
 <path d="M289 550 V351 M350 535 V340 M411 519 V355" stroke="#143B55" stroke-width="21"/>
 <path d="M283 420 H418 M286 481 H421" stroke="#6E91A3" stroke-width="16"/>
 <!-- slab inspection grid line -->
 <path d="M371 626 L691 725 M471 588 L792 690" fill="none" stroke="#7695A5" stroke-width="10" opacity=".7"/>
</g>
<!-- crane concrete bucket suspended, with short chute -->
<g filter="url(#shadow)" stroke-linejoin="round" stroke-linecap="round">
 <path d="M596 205 V279" stroke="#BBD0DB" stroke-width="16"/>
 <path d="M544 292 L594 237 L646 292" fill="none" stroke="#FFAC37" stroke-width="18"/>
 <path d="M486 295 H702 L653 451 Q644 474 623 474 H560 Q535 474 528 451 Z" fill="url(#orange)" stroke="#0D2D46" stroke-width="22"/>
 <path d="M503 329 H685" stroke="#FFF1D3" stroke-width="14" opacity=".65"/>
 <rect x="566" y="471" width="59" height="37" rx="10" fill="#1C435D"/>
</g>
<!-- Concrete flow stays centrally legible -->
<path d="M581 498 C591 550 559 561 579 607 C587 630 591 647 581 668" fill="none" stroke="#0D2D46" stroke-width="58" stroke-linecap="round"/>
<path d="M581 498 C591 550 559 561 579 607 C587 630 591 647 581 668" fill="none" stroke="#A8BAC5" stroke-width="40" stroke-linecap="round"/>
<path d="M550 668 Q576 624 612 663 Q640 686 608 702 H537 Q505 691 550 668" fill="#8FA7B5" stroke="#0D2D46" stroke-width="13"/>
<!-- location dot as gentle motif of mapping, not bigger than slab -->
<circle cx="756" cy="522" r="33" fill="url(#orange)" stroke="#103650" stroke-width="12"/>
<circle cx="756" cy="522" r="12" fill="#F0F6F8"/>

</svg>