<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#244A66"/>
    <stop offset="0.52" stop-color="#163852"/>
    <stop offset="1" stop-color="#102B43"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F4F8F9"/>
    <stop offset="1" stop-color="#CBDDE6"/>
  </linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFC04F"/>
    <stop offset="1" stop-color="#F18A20"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#041D2E" flood-opacity="0.22"/>
  </filter>
</defs>
