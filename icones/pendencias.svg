 <rect x="404" y="175" width="177" height="86" rx="23" fill="#0C2940"/>
 <rect x="417" y="187" width="151" height="59" rx="15" fill="url(#orange)"/>
 <circle cx="493" cy="206" r="12" fill="#183C56"/>
</g>
