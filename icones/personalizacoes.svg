<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#244A66"/><stop offset="0.52" stop-color="#163852"/><stop offset="1" stop-color="#102B43"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8F9"/><stop offset="1" stop-color="#CBDDE6"/></linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC04F"/><stop offset="1" stop-color="#F18A20"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5FD08A"/><stop offset="1" stop-color="#2E9E57"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#041D2E" flood-opacity="0.23"/></filter>
</defs>
<rect x="65" y="65" width="894" height="894" rx="190" fill="url(#tile)"/>
<rect x="82" y="82" width="860" height="860" rx="176" fill="none" stroke="#52748B" stroke-width="9" opacity=".65"/>
<path d="M182 250 C245 168 341 150 460 150" fill="none" stroke="#8EB1C4" stroke-opacity=".11" stroke-width="13" stroke-linecap="round"/>
<!-- planta do apartamento -->
<g filter="url(#shadow)">
  <rect x="210" y="230" width="604" height="564" rx="34" fill="url(#paper)"/>
  <g fill="none" stroke="#244A66" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 282 H762 V742 H262 Z"/>
    <path d="M500 282 V430"/>
    <path d="M500 560 V742"/>
    <path d="M262 520 H380"/>
    <path d="M620 520 H762"/>
  </g>
  <!-- porta original (cinza) e a modificação (laranja) -->
  <path d="M380 520 A120 120 0 0 1 500 400" fill="none" stroke="#8EA6B5" stroke-width="16" stroke-dasharray="4 26" stroke-linecap="round"/>
  <path d="M500 430 V560" fill="none" stroke="url(#orange)" stroke-width="38" stroke-linecap="round"/>
  <path d="M620 520 A120 120 0 0 0 500 640" fill="none" stroke="#244A66" stroke-width="16" stroke-linecap="round" opacity=".55"/>
</g>
<!-- selo de ciência -->
<g filter="url(#shadow)">
  <circle cx="742" cy="742" r="128" fill="url(#green)" stroke="#F4F8F9" stroke-width="18"/>
  <path d="M686 744 L728 786 L804 704" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
