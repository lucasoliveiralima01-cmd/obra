<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Conferência de serviços (FVQ) por voz: o celular pergunta cada item, entende a resposta falada, fotografa e abre a pendência.">
<meta name="theme-color" content="#22425c">
<title>Conferências</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-apple.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Obra"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icones/conferencia.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
/* cores e fontes comuns: estilo.css; aqui só as desta página */
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px var(--f-body);-webkit-tap-highlight-color:transparent;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* faixa da marca */
.brand{background:var(--navy);color:var(--brand-ink);position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:min(46%,560px);background:var(--petrol);clip-path:polygon(64px 0,100% 0,100% 100%,0 100%);z-index:0}
.brand-in{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1240px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px))}
.logo{display:block;color:inherit}
.logo img{height:40px;width:40px;display:block}
.ttl{display:grid;border-left:1px solid rgba(255,255,255,.25);padding-left:16px;min-width:0}
.ttl h1{font:700 1.35rem/1.1 var(--f-disp);margin:0}
.ttl .obra{font-size:.82rem;color:#d4e4ee}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:6px 11px;font:600 .82rem var(--f-body);display:inline-flex;gap:6px;align-items:center;white-space:nowrap;text-decoration:none}
.hbtn:hover{background:rgba(255,255,255,.2)}

main{max-width:1240px;margin:0 auto;padding:14px 16px 24px;display:grid;gap:14px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.86rem;color:var(--muted)}
.crumbs a{font-weight:600;text-decoration:none;color:var(--accent)} .crumbs a:hover{text-decoration:underline}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:8px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 18px;font:700 .92rem var(--f-body);color:var(--ink)}
.tab:hover{border-color:var(--accent)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab b{font-family:var(--f-body);margin-left:4px;opacity:.85}
.muted{color:var(--muted);font-size:.88rem}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:7px;padding:8px 14px;font:600 .9rem var(--f-body);white-space:nowrap}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--accent);font:600 .88rem var(--f-body);padding:4px 2px}
.lnk:hover{text-decoration:underline}

/* avisos no topo */
.alertas{display:grid;gap:8px}
.alerta{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bad-soft);border:1px solid var(--bad);border-radius:var(--r);padding:10px 12px;color:var(--ink)}
.alerta.info{background:var(--warn-soft);border-color:var(--warn)}
.alerta .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;font:700 .9rem var(--f-body)}
.alerta.info .ic{background:var(--warn)}
.alerta b{font-weight:700}
.alerta small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}

/* filtros */
.filtros{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.busca{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 11px;color:var(--muted);min-height:40px}
.busca input{flex:1;border:0;background:none;outline:0;padding:9px 0;min-width:0;color:var(--ink)}
.fsel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:500 .88rem var(--f-body);min-height:40px;max-width:100%}
.fsel.on{border-color:var(--accent);background:var(--accent-soft)}
.chip{background:none;border:1px solid var(--line);border-radius:16px;padding:6px 11px;font:500 .84rem var(--f-body);color:var(--ink);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}

/* lista */
.grupo{display:grid;gap:8px}
.grupo>h2{margin:4px 0 0;font:700 1rem var(--f-disp);color:var(--muted);letter-spacing:.02em}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.card{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;width:100%;color:inherit;transition:border-color .12s,background .12s}
.card:hover{border-color:var(--accent);background:var(--accent-soft)}
.card.falta{border-left-color:var(--bad)} .card.ok{border-left-color:var(--ok)} .card.sol{border-left-color:var(--warn)}
.c-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.c-loc{font-size:.8rem;color:var(--muted)}
.c-tit{font:700 1rem/1.25 var(--f-body);overflow-wrap:anywhere}
.st{flex:none;font:600 .74rem var(--f-body);padding:2px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st-solicitada{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.st-aprovada{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.st-executada,.st-conferida{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.st-cancelada{text-decoration:line-through}
.svs{display:flex;flex-wrap:wrap;gap:5px}
.sv{font:600 .76rem var(--f-body);padding:2px 8px;border-radius:12px;border:1px solid var(--line);color:var(--muted)}
.sv.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sv.falta{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.vazio{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:grid;gap:8px;justify-items:center}
.vazio h3{margin:0;font:700 1.15rem var(--f-disp)}

/* frentes */
.fr-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table.fr{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem}
table.fr th,table.fr td{padding:6px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);text-align:center;vertical-align:middle}
table.fr th{font:700 .8rem var(--f-disp);color:var(--muted);background:var(--panel);position:sticky;top:0}
table.fr th:first-child,table.fr td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);font-weight:600;min-width:120px;z-index:1}
.fc{display:grid;gap:2px;justify-items:center;width:100%;min-width:104px;background:none;border:1px solid transparent;border-radius:7px;padding:6px 4px;color:inherit}
.fc:hover{border-color:var(--accent);background:var(--accent-soft)}
.fc .s{font:600 .76rem var(--f-body);padding:1px 7px;border-radius:10px}
.fc .d{font-size:.74rem;color:var(--muted)}
.s-lib{background:var(--ok-soft);color:var(--ok)} .s-sol{background:var(--warn-soft);color:var(--warn)} .s-falta{background:var(--bad-soft);color:var(--bad)} .s-pronta{background:var(--accent-soft);color:var(--accent)} .s-nada{color:var(--muted)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}

/* botão flutuante */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--accent);color:var(--accent-ink);border:0;border-radius:28px;padding:14px 20px;font:700 1rem var(--f-body);box-shadow:0 8px 24px rgba(0,0,0,.28)}

/* janelas */
.overlay{position:fixed;inset:0;background:rgba(6,20,30,.5);display:grid;place-items:center;padding:12px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:calc(100dvh - 24px);display:grid;grid-template-rows:auto 1fr auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.sheet>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet>header h3{margin:0;font:700 1.2rem var(--f-disp);flex:1}
.sheet>header .x{background:none;border:1px solid var(--line);border-radius:8px;min-width:36px;height:36px;font-size:1.2rem;line-height:1;color:var(--ink)}
.sheet .body{overflow:auto;padding:14px 16px;display:grid;gap:14px;align-content:start}
.sheet>footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.sheet>footer:not(:has(.btn)){display:none}
.fld{display:grid;gap:5px}
.fld>label,.fld>.l{font:600 .72rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.req{color:var(--bad)}
.fld input:not([type=file]):not([type=checkbox]),.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
.fld textarea{min-height:64px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font:600 .86rem var(--f-body);color:var(--ink);min-height:36px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.92rem}
.msg{font-size:.86rem;margin-right:auto}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.itens{display:grid;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:start;border:1px solid var(--line);border-radius:9px;padding:8px}
.item textarea{grid-column:1/-1;min-height:46px}
.item select,.item textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:100%;min-width:0}
.arqs{display:flex;flex-wrap:wrap;gap:8px}
.arq{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:var(--muted);text-align:center;padding:4px}
.arq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.arq .rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:24px;height:24px;line-height:22px;padding:0}
.addarq{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:8px;padding:9px 13px;font:600 .9rem var(--f-body);color:var(--ink);cursor:pointer}
.addarq input{display:none}
/* ficha */
.fi-tit{margin:0;font:700 1.4rem/1.2 var(--f-disp);overflow-wrap:anywhere}
.fi-loc{margin:0;font:600 .98rem var(--f-body);color:var(--accent)}
.fi-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.86rem;color:var(--muted)}
.fi-desc{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.fi h4{margin:0;font:700 1.02rem var(--f-disp)}
.svc{display:grid;gap:6px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:9px;padding:10px 12px}
.svc.ok{border-left-color:var(--ok)} .svc.falta{border-left-color:var(--bad)}
.svc .h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;justify-content:space-between}
.svc .h b{font:700 .98rem var(--f-body)}
.svc .ins{margin:0;font-weight:600;white-space:pre-wrap}
.svc .ci{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.svc .ci.ok{color:var(--ok)} .svc .ci.falta{color:var(--bad)}
.viewer .vx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(20,30,40,.72);color:#fff;font:400 1.7rem/1 var(--f-body);display:grid;place-items:center;padding:0 0 3px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.viewer .vx:hover{background:rgba(20,30,40,.92)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:grid;place-items:center;padding:10px}
.viewer img{max-width:calc(100vw - 20px);max-height:calc(100dvh - 20px);object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 15px;border-radius:8px;font-size:.88rem;z-index:50;max-width:calc(100% - 32px)}
@media (max-width:640px){
  .brand::after{display:none}
  .ttl{border-left:0;padding-left:0}
  .hctl{width:auto;margin-left:auto;order:2}
  #bQuem{display:none}
  .lista{grid-template-columns:1fr}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%}
  .tabs{display:grid}
  .overlay{padding:0;place-items:end stretch}
  .sheet{border-radius:14px 14px 0 0;max-height:94dvh;width:100%}
  .item{grid-template-columns:1fr auto}
  .item select:nth-of-type(2){grid-column:1/2}
}
/* conferência por voz */
main>*{min-width:0}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mod{display:grid;gap:4px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);padding:12px;color:inherit}
.mod[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mod b{font:700 1rem var(--f-disp)} .mod small{color:var(--muted)}
.cfg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.cfg .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.go{display:flex;flex-wrap:wrap;gap:8px}
.go .btn{flex:1 1 200px;padding:14px;font-size:1.02rem}
.conv{display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-height:calc(100dvh - 190px)}
.barra{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.barra .t{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.barra .t b{font:700 1rem var(--f-disp)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.prog .ok{background:var(--ok)} .prog .nc{background:var(--bad)} .prog .na{background:var(--muted)}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
.ctl button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:600 .82rem var(--f-body);color:var(--ink)}
.ctl button[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.chat{display:flex;flex-direction:column;gap:8px;overflow:auto;padding:4px 2px;max-height:46dvh}
.bal{max-width:85%;padding:9px 12px;border-radius:14px;font-size:.95rem;line-height:1.35;overflow-wrap:break-word}
.bal.a{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bal.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bal.s{align-self:center;background:none;color:var(--muted);font-size:.8rem;padding:2px}
.bal.u.int{opacity:.6}
.atual{background:var(--panel);border:2px solid var(--accent);border-radius:var(--r);padding:12px;display:grid;gap:10px;position:sticky;bottom:0}
.atual .q{font:700 1.05rem/1.3 var(--f-body)}
.atual .meta{font-size:.8rem;color:var(--muted)}
.bts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.bts button{border-radius:10px;padding:13px 10px;font:700 .98rem var(--f-body);border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.bts .b-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.bts .b-nc{background:var(--bad);border-color:var(--bad);color:#fff}
.bts .b-pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.num{display:flex;gap:8px}
.num input{flex:1;min-width:0;font-size:1.2rem;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.mic{display:flex;align-items:center;gap:8px;font:600 .86rem var(--f-body);color:var(--muted)}
.mic .d{width:12px;height:12px;border-radius:50%;background:var(--line)}
.mic.ouv .d{background:var(--bad);animation:pul 1s infinite} .mic.fal .d{background:var(--accent)}
@keyframes pul{50%{transform:scale(1.5);opacity:.5}}
.digitar{display:flex;gap:6px}
.digitar input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.cam{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:40dvh}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.fts{display:flex;gap:6px;flex-wrap:wrap}
.fts img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.res{display:grid;gap:6px}
.ri{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:9px;padding:8px 10px}
.ri.ok{border-left-color:var(--ok)} .ri.nc{border-left-color:var(--bad)} .ri.na{border-left-color:var(--muted)} .ri.vz{border-left-color:var(--warn)}
.ri .ic{font:700 1rem var(--f-body);width:22px;text-align:center}
.ri.ok .ic{color:var(--ok)} .ri.nc .ic{color:var(--bad)}
.ri small{grid-column:2;color:var(--muted);font-size:.82rem}
.hist{display:grid;gap:6px}
.hi{display:grid;gap:2px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:inherit}
.hi .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dica{background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:9px 11px;font-size:.86rem}
</style>
<body>
<header class="brand"><div class="brand-in">
  <a class="logo" href="index.html" title="Início: ferramentas e obras" aria-label="Início"><img src="icones/conferencia.svg" alt="" width="40" height="40"></a>
  <div class="ttl"><h1>Conferências</h1><span class="obra" id="obraNome">Carregando…</span></div>
  <div class="hctl"></div>
</div></header>

<main id="main"><p class="muted">Carregando…</p></main>
<div class="overlay" id="ovl" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ovlT"><header><h3 id="ovlT"></h3><button class="x" id="ovlX" type="button" aria-label="Fechar">×</button></header><div class="body" id="ovlB"></div><footer id="ovlF"></footer></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<script src="config.js"></script>
<script>window.NUVEM_FERRAMENTA = 'conferencia';</script>
<script src="nuvem.js"></script>
<script src="listas-comum.js"></script>
<script src="fvq-modelos.js"></script>
<script src="fvq-voz.js"></script>
<script>
/* =====================================================================
   Conferência de serviços (FVQ) por voz, sem IA e sem custo
   - O celular lê cada item em voz alta (voz do próprio aparelho) e escuta a
     resposta (reconhecimento de voz do navegador). Tudo também funciona
     tocando nos botões ou digitando.
   - Entende sim/não de vários jeitos, medidas faladas ("noventa e dois",
     "3 milímetros"), várias respostas numa frase ("sim, e o alçapão também"),
     e comandos: pula, volta, repete, não se aplica, quanto falta, pausa,
     "o resto tá tudo ok", encerrar.
   - Não conforme: pergunta o que está errado, abre a câmera ("tira" fotografa)
     e abre a pendência já preenchida.
   Fichas: fvq-modelos.js. Entendedor: fvq-voz.js. Banco: passo 25.
   ===================================================================== */
(function () {
'use strict';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t, ms) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, ms || 4000); }
const fmtDH = s => { if (!s) return '—'; const d = new Date(s); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
const V = window.FVQVoz, MODELOS = window.FVQ_MODELOS || [], LO = window.ListasObra;
const fala = V.sorteio();
const num = v => String(Math.round(v * 10) / 10).replace('.', ',');
const PAV_PADRAO = ['Térreo', 'Pavimento 02', 'Pavimento 03', 'Pavimento 04', 'Pavimento 05', 'Pavimento 06', 'Cobertura'].map(n => ({ nome: n, unidades: [] }));
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

let NV = null, sb = null, OBRA = null, OBRA_NOME = '';
let CFG = { pavimentos: [] }, L = { comodo: [] }, HIST = [];
const edita = () => NV && ['admin', 'engenharia'].includes(NV.perfil);
const SEL = { modelo: MODELOS[0] ? MODELOS[0].id : null, pav: '', un: '', comodo: '' };

/* ======================= dados ======================= */
async function carregar() {
  const [lp, lc, lo, lh] = await Promise.all([
    sb.from('pend_listas').select('tipo,valor,ordem,extra').order('ordem'),
    sb.from('pend_config').select('pavimentos,listas').eq('obra', OBRA).maybeSingle(),
    NV.obras.obter(OBRA),
    sb.from('fvq_conferencias').select('*').eq('obra', OBRA).order('inicio', { ascending: false }).limit(40)
  ]);
  if (!lo) { const e = new Error('obra não encontrada'); e.naoTem = true; throw e; }
  const c = (lc && lc.data) || {};
  L = LO.efetivas(LO.deTabela(lp.data || []), c.listas || null);
  CFG = { pavimentos: (c.pavimentos && c.pavimentos.length) ? c.pavimentos : PAV_PADRAO };
  OBRA_NOME = lo.nome; HIST = lh.error ? null : (lh.data || []);
}
const comodos = () => LO.ativos(L.comodo || []).map(x => x.valor);

/* ======================= tela inicial ======================= */
function inicio() {
  pararTudo();
  const m = $('main'), pav = CFG.pavimentos.find(p => p.nome === SEL.pav), uns = pav ? (pav.unidades || []) : [];
  m.innerHTML = `<nav class="crumbs" aria-label="Caminho"><a href="index.html">Obras</a><span>›</span><a href="index.html?obra=${encodeURIComponent(OBRA)}">${esc(OBRA_NOME)}</a><span>›</span><span>Conferências</span></nav>
    ${edita() ? `<section class="secao" style="display:grid;gap:10px"><h3 style="margin:0;font:700 1.05rem var(--f-disp)">Nova conferência</h3>
      <div class="mods">${MODELOS.map(md => `<button type="button" class="mod" data-m="${esc(md.id)}" aria-pressed="${SEL.modelo === md.id}"><b>${esc(md.nome)}</b><small>${md.itens.length} itens · ${esc(md.oficio)}</small></button>`).join('')}</div>
      <div class="cfg"><div class="row">
        <div class="fld"><label for="cPav">Pavimento</label><select id="cPav"><option value="">Escolha…</option>${CFG.pavimentos.map(p => `<option ${p.nome === SEL.pav ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></div>
        <div class="fld"><label for="cUn">Apartamento</label><select id="cUn"><option value="">Área comum / todo o pavimento</option>${uns.map(u => `<option ${u === SEL.un ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></div>
        <div class="fld"><label for="cCo">Cômodo (opcional)</label><select id="cCo"><option value="">Todos</option>${comodos().map(x => `<option ${x === SEL.comodo ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      </div>
      <div class="go"><button class="btn" type="button" id="cVoz">🎙 Começar por voz</button><button class="btn ghost" type="button" id="cTela">Conferir na tela</button></div>
      ${SR ? '' : '<div class="dica">Este navegador não reconhece voz. A conferência funciona tocando nos botões; para falar, use o Chrome no Android ou o Safari no iPhone.</div>'}
      <details class="cfg" id="cVozCfg"><summary style="cursor:pointer;font-weight:700">🔊 Voz do assistente</summary>
        <div class="row" style="margin-top:8px">
          <div class="fld"><label for="vVoz">Voz</label><select id="vVoz"></select></div>
          <div class="fld"><label for="vVel">Velocidade: <span id="vVelT">${String(PREF.vel).replace('.', ',')}×</span></label><input type="range" id="vVel" min="0.9" max="1.7" step="0.05" value="${PREF.vel}"></div>
        </div>
        <label class="chk"><input type="checkbox" id="vBip" ${PREF.bip ? 'checked' : ''}> Confirmar com um bip (mais rápido: não fala “Beleza, próximo”)</label>
        <button class="btn ghost" type="button" id="vTeste">▶ Ouvir esta voz</button>
        <span class="muted">As vozes são as instaladas no celular. No Android dá para baixar outras em Configurações → Idiomas → Saída de texto para fala (Google).</span></details>
      <div class="dica"><b>Dicas para falar:</b> responda do seu jeito (“tá ok”, “tá torto”, “deu 3 milímetros”). Dá para responder vários itens de uma vez (“esperas ok e o alçapão também”) e usar: <i>pula</i>, <i>volta</i>, <i>repete</i>, <i>não se aplica</i>, <i>quanto falta</i>, <i>pausa</i>, <i>o resto tá tudo ok</i>, <i>encerrar</i>. No não conforme, diga o que está errado e <i>tira</i> para fotografar. Com fone com microfone funciona melhor no barulho.</div></div></section>` : ''}
    <section class="secao" style="display:grid;gap:8px"><h3 style="margin:0;font:700 1.05rem var(--f-disp)">Conferências feitas</h3>
      ${HIST === null ? '<div class="dica">Falta preparar o banco para guardar as conferências: rode o <b>banco.sql</b> no Supabase. Dá para testar mesmo assim (as pendências são criadas normalmente).</div>'
        : HIST.length ? `<div class="hist">${HIST.map(h => { const r = h.resumo || {}; return `<button type="button" class="hi" data-h="${esc(h.id)}"><span class="h"><b>${esc(h.modelo_nome)} · ${esc([h.pavimento, h.unidade ? 'Apto ' + h.unidade : '', h.comodo].filter(Boolean).join(' · '))}</b><span class="muted">${fmtDH(h.inicio)}</span></span><span class="muted">${r.ok || 0} conformes · ${r.nc || 0} não conformes · ${r.na || 0} não se aplica${r.vz ? ' · ' + r.vz + ' sem resposta' : ''}${h.status === 'andamento' ? ' · em andamento' : ''} · ${esc(nomeDe(h.por))}</span></button>`; }).join('')}</div>`
        : '<p class="muted" style="margin:0">Nenhuma ainda.</p>'}</section>`;
  m.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { SEL.modelo = b.dataset.m; inicio(); });
  if ($('cPav')) $('cPav').onchange = e => { SEL.pav = e.target.value; SEL.un = ''; inicio(); };
  if ($('cUn')) $('cUn').onchange = e => { SEL.un = e.target.value; };
  if ($('cCo')) $('cCo').onchange = e => { SEL.comodo = e.target.value; };
  const comecar = voz => { if (!SEL.pav) { toast('Escolha o pavimento.'); return; } iniciarConferencia(voz); };
  if ($('cVoz')) $('cVoz').onclick = () => comecar(true);
  ajustesVoz();
  if ($('cTela')) $('cTela').onclick = () => comecar(false);
  m.querySelectorAll('[data-h]').forEach(b => b.onclick = () => verHist(b.dataset.h));
}
function ajustesVoz() {
  const sel = $('vVoz'); if (!sel) return;
  const encher = () => { const L2 = vozesPt(), at = vozPt();
    sel.innerHTML = L2.length ? L2.map(v => `<option value="${esc(v.voiceURI || v.name)}" ${at && (v.voiceURI || v.name) === (at.voiceURI || at.name) ? 'selected' : ''}>${esc(v.name.replace(/^Google\s*/i, 'Google · '))}${/pt[-_]PT/i.test(v.lang) ? ' (Portugal)' : ''}${v.localService ? '' : ' · online'}</option>`).join('') : '<option>Voz padrão do aparelho</option>'; };
  encher(); if ('speechSynthesis' in window) speechSynthesis.addEventListener('voiceschanged', encher);
  sel.onchange = () => { PREF.voz = sel.value; guardarPref(); testar(); };
  $('vVel').oninput = e => { PREF.vel = +e.target.value; $('vVelT').textContent = String(PREF.vel).replace('.', ',') + '×'; };
  $('vVel').onchange = () => { guardarPref(); testar(); };
  $('vBip').onchange = e => { PREF.bip = e.target.checked; guardarPref(); if (PREF.bip) bip(); };
  const testar = () => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance('Os montantes e as guias estão inteiros?'); u.lang = 'pt-BR'; const v = vozPt(); if (v) u.voice = v; u.rate = PREF.vel; speechSynthesis.speak(u); } catch (e) {} };
  $('vTeste').onclick = testar;
}
const nomeDe = e => NV && NV.pessoas ? NV.pessoas.nome(e) : String(e || '').split('@')[0];

/* ======================= a conferência ======================= */
let C = null;          // conferência em andamento
window.paginaOcupada = () => !!C && MODO !== 'fim';
let MODO = 'pergunta'; // pergunta | descricao | foto | confirmaPend | confirmaResto | confirmaEncerrar | medidaExata | foraTol | pausa | fim
let NC = null;         // não conforme em registro: {item, desc, fotos:[{blob,url}], valor}
let ERROS = 0;         // respostas que não entendi seguidas
const VOZ = { falar: true, ouvir: true };
// voz escolhida, velocidade e "confirmar com bip" (ficam neste aparelho)
const PREF = (() => { const d = { voz: '', vel: 1.2, bip: true }; try { return Object.assign(d, JSON.parse(localStorage.getItem('conf_voz') || '{}')); } catch (e) { return d; } })();
const guardarPref = () => { try { localStorage.setItem('conf_voz', JSON.stringify(PREF)); } catch (e) {} };
// bip curto de "anotado" (no lugar de falar "Beleza. Próximo:")
let AUDIO = null;
function bip(tipo) {
  try {
    if (!AUDIO) AUDIO = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AUDIO.currentTime, g = AUDIO.createGain(); g.connect(AUDIO.destination);
    const notas = tipo === 'nc' ? [523, 392] : [880, 1320];
    notas.forEach((f, i) => { const o = AUDIO.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(g); o.start(t0 + i * 0.09); o.stop(t0 + i * 0.09 + 0.08); });
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
  } catch (e) {}
}

function localTxt(c) {
  const u = c.unidade ? (c.comodo ? 'da ' + c.comodo.toLowerCase() + ' do ' + c.unidade : 'do ' + c.unidade) : (c.comodo ? 'da ' + c.comodo.toLowerCase() + ', ' + c.pavimento : 'do ' + c.pavimento);
  return u;
}
function iniciarConferencia(voz) {
  const md = MODELOS.find(x => x.id === SEL.modelo); if (!md) return;
  C = { id: uuid(), modelo: md, pavimento: SEL.pav, unidade: SEL.un || null, comodo: SEL.comodo || null, res: {}, pulados: [], cursor: 0, inicio: new Date().toISOString(), hist: [] };
  VOZ.falar = voz; VOZ.ouvir = voz && !!SR; MODO = 'pergunta'; NC = null; ERROS = 0;
  telaConversa();
  pedirTelaLigada();
  const intro = md.intro[Math.floor(Math.random() * md.intro.length)].replace('{local}', localTxt(C));
  const h = new Date().getHours(); const saud = h < 12 ? 'Bom dia!' : h < 18 ? 'Boa tarde!' : 'Boa noite!';
  if (PREF.bip) bip();   // libera o som no celular (precisa de um toque, que é o "Começar")
  dizer(saud + ' ' + intro + ' ' + md.itens.length + ' itens.', () => perguntar());
  salvar();
}
const itens = () => C.modelo.itens;
const resp = it => C.res[it.id];
const respondido = it => !!(resp(it) && resp(it).st);
const atual = () => itens()[C.cursor];
function proximo() {
  // próximo sem resposta a partir do cursor; depois os pulados
  const L2 = itens();
  for (let k = C.cursor; k < L2.length; k++) if (!respondido(L2[k]) && !C.pulados.includes(L2[k].id)) return k;
  for (let k = 0; k < L2.length; k++) if (!respondido(L2[k]) && !C.pulados.includes(L2[k].id)) return k;
  return -1;
}
function contagem() { const r = { ok: 0, nc: 0, na: 0, vz: 0 }; itens().forEach(it => { const x = resp(it); r[x && x.st ? x.st : 'vz']++; }); return r; }

// texto da pergunta do item, variando
function perguntaDe(it, outra) {
  const ps = it.perguntas && it.perguntas.length ? it.perguntas : [it.txt + '?'];
  let i = Math.floor(Math.random() * ps.length); if (outra && ps.length > 1 && i === it._ult) i = (i + 1) % ps.length; it._ult = i;
  return ps[i];
}
function perguntar(prefixo) {
  let k = proximo();
  if (k < 0 && C.pulados.length) {   // só sobraram os pulados
    const pend = itens().filter(it => !respondido(it) && C.pulados.includes(it.id));
    C.pulados = [];
    if (pend.length) { dizer((prefixo || '') + 'Ficaram ' + (pend.length === 1 ? 'um item pulado' : pend.length + ' itens pulados') + '. Vamos neles.', () => perguntar()); return; }
    k = proximo();
  }
  if (k < 0) { finalizar(prefixo); return; }
  C.cursor = k; MODO = 'pergunta'; ERROS = 0;
  const it = atual(), c = contagem(), feitos = c.ok + c.nc + c.na, falta = itens().length - feitos;
  let pre = prefixo || '';
  const TRANS = /\s*(Agora: |Próximo: |E |Seguindo: |Vamos lá: )\s*$/;
  const extra = (it.secao && C.modelo.secoes && it.secao !== C.secao) || falta === 1 || (feitos === Math.ceil(itens().length / 2) && !C.disseMetade);
  if (extra) pre = pre.replace(TRANS, ' ');
  if (it.secao && C.modelo.secoes && it.secao !== C.secao) { const ss = C.modelo.secoes[it.secao]; C.secao = it.secao; if (ss && ss.length) pre += ss[Math.floor(Math.random() * ss.length)] + ' '; }
  if (falta === 1) pre += fala('ultimo');
  else if (feitos === Math.ceil(itens().length / 2) && !C.disseMetade) { C.disseMetade = true; pre += fala('metade'); }
  if (pre && !/[:.!?] ?$/.test(pre)) pre += ' ';
  let q = perguntaDe(it);
  if (PREF.bip && VOZ.falar) {   // "Beleza. Próximo:" vira um bip; o que informa (etapa, pulado, pendência…) continua falado
    const curto = new RegExp('^\\s*(' + V.FALAS.ok.concat(V.FALAS.transicao.filter(Boolean)).map(x => x.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')\\s*', 'g');
    let ant; do { ant = pre; pre = pre.replace(curto, ''); } while (pre !== ant);
    if (prefixo && pre.length < prefixo.length) bip();
  }
  if (/(^|\s)E\s*$/.test(pre)) q = q.charAt(0).toLowerCase() + q.slice(1);
  dizer(pre + q, ouvir);
}

/* ---------- entender a resposta ---------- */
function processar(txt, origem) {
  txt = String(txt || '').trim(); if (!txt || !C || MODO === 'fim') return;
  pararOuvir();
  balao('u', txt);
  const e = V.entender(txt);
  // comandos que valem em qualquer momento
  if (MODO === 'pausa') { if (e.cmds.includes('continuar') || e.pol === 'sim') { dizer(fala('voltei'), () => repetirAtual()); } else ouvir(); return; }
  if (e.cmds.includes('encerrar') && MODO !== 'confirmaEncerrar') { const c = contagem(); MODO = 'confirmaEncerrar'; dizer('Quer encerrar agora?' + (c.vz ? ' ' + (c.vz === 1 ? 'Um item fica' : c.vz + ' itens ficam') + ' sem resposta.' : ''), ouvir); return; }
  if (e.cmds.includes('pausa') && MODO !== 'descricao') { MODO = 'pausa'; dizer(fala('pausa'), ouvir); return; }
  if (e.cmds.includes('status') && MODO !== 'descricao') { const c = contagem(); dizer('Já foram ' + (c.ok + c.nc + c.na) + ' de ' + itens().length + '. ' + c.ok + ' conforme' + (c.ok === 1 ? '' : 's') + (c.nc ? ', ' + c.nc + ' não conforme' + (c.nc > 1 ? 's' : '') : '') + '.', () => repetirAtual()); return; }
  if (e.cmds.includes('repetir') && !['descricao'].includes(MODO)) { repetirAtual(true); return; }
  if (e.cmds.includes('voltar') && ['pergunta', 'medidaExata'].includes(MODO)) { voltar(); return; }
  ({ pergunta: emPergunta, medidaExata: emMedidaExata, foraTol: emForaTol, descricao: emDescricao, foto: emFoto, confirmaPend: emConfirmaPend, confirmaResto: emConfirmaResto, confirmaEncerrar: emConfirmaEncerrar }[MODO] || emPergunta)(e, txt);
}
function repetirAtual(outra) {
  if (MODO === 'pausa') MODO = 'pergunta';
  const it = atual();
  if (MODO === 'pergunta' || !it) { if (!it) { perguntar(); return; } dizer(perguntaDe(it, outra), ouvir); }
  else if (MODO === 'descricao') dizer(fala('oQueErrado'), ouvir);
  else if (MODO === 'foto') dizer('Diga "tira" para fotografar, ou "pronto".', ouvir);
  else if (MODO === 'confirmaPend') perguntarPendencia();
  else if (MODO === 'medidaExata') dizer(fala('pedeNumero'), ouvir);
  else dizer(perguntaDe(it, outra), ouvir);
}
function voltar() {
  // volta ao último item respondido (desfaz a resposta)
  const L2 = C.hist.slice(); const ult = L2.pop();
  if (!ult) { dizer('Ainda não tem nada pra voltar.', ouvir); return; }
  C.hist = L2; delete C.res[ult]; C.cursor = itens().findIndex(x => x.id === ult); MODO = 'pergunta'; desenharAtual(); salvar();
  dizer('Ok, voltando. ' + perguntaDe(atual(), true), ouvir);
}
function marcar(it, st, extra) {
  C.res[it.id] = Object.assign({ st, em: new Date().toISOString() }, extra || {});
  C.pulados = C.pulados.filter(x => x !== it.id);
  C.hist = C.hist.filter(x => x !== it.id).concat(it.id);
  desenharAtual(); salvar();
}
function naoEntendi() {
  ERROS++;
  if (ERROS >= 3) { ERROS = 0; dizer('Tá difícil de ouvir aqui. Pode tocar nos botões da tela, ou tentar de novo.', ouvir); return; }
  dizer(MODO === 'pergunta' && atual().tipo === 'medida' ? 'Não peguei a medida. ' + fala('pedeNumero') : fala('naoEntendi'), ouvir);
}

// resposta ao item atual (e a outros citados na mesma frase)
function emPergunta(e, txt) {
  const it = atual();
  if (e.cmds.includes('na')) { marcar(it, 'na'); perguntar(fala('na') + ' '); return; }
  if (e.cmds.includes('pular')) { C.pulados.push(it.id); C.cursor = Math.min(C.cursor + 1, itens().length); perguntar(fala('pulei') + ' '); return; }
  if (e.cmds.includes('restotudo')) { pedirResto(it, e); return; }
  if ((e.cmds.includes('camera') || e.cmds.includes('foto')) && e.pol !== 'sim') { iniciarNC(it, ''); return; }
  // outros itens citados (respondidos junto, ou "vamos pro nível")
  const extras = []; let doAtual = null;
  for (const p of V.pedacos(txt)) {
    const ep = V.entender(p);
    const doItem = V.itensCitados(p, [it]).length > 0;
    const cit = doItem ? [] : V.itensCitados(p, itens()).filter(x => x !== it);
    if (!cit.length) { if (ep.pol || ep.num) doAtual = doAtual || ep; continue; }
    for (const x of cit) {
      if (respondido(x)) continue;
      const pol = ep.pol || (/\btambem\b/.test(p) ? (doAtual && doAtual.pol) || e.pol : null);
      if (x.tipo === 'medida' && ep.num && !ep.num.vago) { const v = V.converte(ep.num.valor, ep.num.unidade || x.unidade, x.unidade); if (dentro(x, v)) { marcar(x, 'ok', { valor: v }); extras.push(x.txt.split(/[(,]/)[0].trim() + ' ' + num(v) + ' ' + x.unidade); } }
      else if (x.tipo !== 'medida' && pol === 'sim') { marcar(x, 'ok'); extras.push(x.txt.split(/[(,]/)[0].trim()); }
    }
  }
  const resto = extras.length ? ' ' + (extras.length === 1 ? 'Também marquei: ' : 'Também marquei: ') + extras.join(', ') + '.' : '';
  const e2 = doAtual || e;
  // só citou outro item, sem responder: pula para ele
  if (!e2.pol && !e2.num && !extras.length) {
    const cit = V.itensCitados(txt, itens()).filter(x => x !== it && !respondido(x));

  h += `<div class="digitar"><input id="dTxt" placeholder="Ou digite como falaria…" autocomplete="off" aria-label="Digitar resposta"><button class="btn ghost" type="button" id="dEnv">Enviar</button></div>`;
  el.innerHTML = h;
  el.querySelectorAll('[data-f]').forEach(x => x.onclick = () => { if (x.dataset.f === 'tira' && MODO === 'foto') { pararOuvir(); balao('u', '📷'); tirarFoto(); return; } processar(x.dataset.f, 'botao'); });
  if ($('nOk')) $('nOk').onclick = () => { const v = $('nVal').value; if (v) processar(v + ' ' + atual().unidade, 'botao'); };
  if ($('dOk')) $('dOk').onclick = () => { const v = $('dDesc').value.trim(); if (v) processar(v, 'botao'); };
  const env = () => { const v = $('dTxt').value.trim(); if (v) { $('dTxt').value = ''; processar(v, 'digitado'); } };
  $('dEnv').onclick = env; $('dTxt').onkeydown = ev => { if (ev.key === 'Enter') env(); };
  if (MODO === 'foto' && STREAM) { const v = el.querySelector('video'); if (v) { v.srcObject = STREAM; v.play().catch(() => {}); } }
}

/* ======================= voz: falar e ouvir ======================= */
let VOZES = null, FALANDO = false;
function vozesPt() {
  if (!('speechSynthesis' in window)) return [];
  if (!VOZES || !VOZES.length) VOZES = speechSynthesis.getVoices();
  const pt = VOZES.filter(v => /^pt[-_]BR/i.test(v.lang)); return pt.length ? pt.concat(VOZES.filter(v => /^pt[-_]PT/i.test(v.lang))) : VOZES.filter(v => /^pt/i.test(v.lang));
}
function vozPt() {
  const L2 = vozesPt(); if (!L2.length) return null;
  return L2.find(v => v.voiceURI === PREF.voz || v.name === PREF.voz) || L2.find(v => /google|luciana|francisca|natural|online/i.test(v.name)) || L2[0];
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { VOZES = speechSynthesis.getVoices(); };
// fala o texto (e escreve no chat); depois chama "depois"
function dizer(txt, depois) {
  txt = String(txt || '').replace(/\s+/g, ' ').trim(); if (!txt) { if (depois) depois(); return; }
  pararOuvir(); balao('a', txt); desenharAtual();
  const fim = () => { FALANDO = false; micEstado(); if (depois) setTimeout(depois, 120); };
  if (!VOZ.falar || !('speechSynthesis' in window)) { fim(); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt.replace(/\bmm\b/g, 'milímetros').replace(/\bcm\b/g, 'centímetros').replace(/#/g, 'número '));
    u.lang = 'pt-BR'; const v = vozPt(); if (v) u.voice = v; u.rate = PREF.vel || 1.2; u.pitch = 1;
    let feito = false; const ok = () => { if (feito) return; feito = true; clearTimeout(t); fim(); };
    u.onend = ok; u.onerror = ok;
    const t = setTimeout(ok, 2500 + txt.length * 85 / (PREF.vel || 1));   // alguns aparelhos não avisam o fim da fala
    FALANDO = true; micEstado(); speechSynthesis.speak(u);
  } catch (e) { fim(); }
}
let REC = null, OUVINDO = false, TENTATIVAS = 0;
function ouvir() {
  if (!C || MODO === 'fim' || !VOZ.ouvir || !SR || FALANDO) { micEstado(); return; }
  pararOuvir();
  try {
    const r = new SR(); REC = r; r.lang = 'pt-BR'; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
    let final = false, ultimoInterino = '', tCurto = null;
    const usar = txt => { if (final || REC !== r) return; final = true; TENTATIVAS = 0; clearTimeout(tCurto); REC = null; OUVINDO = false; try { r.abort(); } catch (e) {} processar(txt, 'voz'); };
    r.onresult = ev => {
      let txt = '', fin = false; const alts = [];
      for (let i = 0; i < ev.results.length; i++) { txt += ev.results[i][0].transcript; if (ev.results[i].isFinal) { fin = true; for (let k = 0; k < ev.results[i].length; k++) alts.push(ev.results[i][k].transcript); } }
      if (!fin) {
        interino(txt); ultimoInterino = txt;
        // resposta curta e clara ("sim", "ok", "conforme", "pula"): segue sem esperar o celular fechar a frase
        clearTimeout(tCurto);
        if (respostaCurta(txt)) tCurto = setTimeout(() => usar(ultimoInterino), 450);
        return;
      }
      // entre as alternativas, a primeira que faz sentido para o momento
      usar(alts.find(a => { const e = V.entender(a); return e.pol || e.cmds.length || e.num; }) || alts[0] || txt);
    };
    r.onerror = ev => { if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') { VOZ.ouvir = false; micTxt('Microfone bloqueado: libere nas permissões do navegador, ou use os botões'); const b = $('tOuvir'); if (b) b.setAttribute('aria-pressed', 'false'); } };
    r.onend = () => { if (REC !== r) return;
      // no Android, resposta curta às vezes termina sem o resultado "final": usa o que já tinha ouvido
      if (!final && ultimoInterino.trim()) { usar(ultimoInterino); return; }
      REC = null; OUVINDO = false; micEstado();
      // não ouviu nada: volta a escutar (com limite, para não gastar bateria à toa)
      if (!final && C && MODO !== 'fim' && VOZ.ouvir && !FALANDO) { TENTATIVAS++; if (TENTATIVAS <= 6) setTimeout(ouvir, 250); else { TENTATIVAS = 0; micTxt('Toque em 🎙 Microfone para voltar a ouvir'); } } };
    r.start(); OUVINDO = true; micEstado();
  } catch (e) { OUVINDO = false; micEstado(); }
}
// só uma ou duas palavras, com sentido claro e sem número (número e descrição esperam a frase inteira)
function respostaCurta(txt) {
  const n = V.norm(txt); if (!n || n.split(' ').length > 2 || /\d/.test(n)) return false;
  if (MODO === 'descricao' || (MODO === 'pergunta' && atual() && atual().tipo === 'medida' && !atual().aceitaSim)) return false;
  const e = V.entender(n);
  return (e.pol === 'sim' && /^(sim|ok|okay|conforme|certo|beleza|blz|positivo|isso|correto|perfeito|show|pronto|tranquilo|confere|aham|uhum|ta ok|ta certo|ta bom|tudo certo|tudo ok|pode passar|esta conforme|ta conforme)$/.test(n))
    || (e.cmds.length === 1 && ['pular', 'repetir', 'voltar', 'foto', 'semfoto', 'continuar'].includes(e.cmds[0]) && /^(pula|pular|repete|volta|tira|bate|sem foto|continua|continuar)$/.test(n));
}
function pararOuvir() { const r = REC; REC = null; OUVINDO = false; if (r) { try { r.abort(); } catch (e) {} } }
function micTxt(t) { const el = $('micT'); if (el) el.textContent = t; }
function micEstado() { const m = $('mic'); if (!m) return; m.className = 'mic' + (OUVINDO ? ' ouv' : FALANDO ? ' fal' : '');
  micTxt(FALANDO ? 'Falando…' : OUVINDO ? 'Ouvindo… pode falar' : VOZ.ouvir ? 'Microfone pronto' : 'Microfone desligado: responda pelos botões'); }
function pararTudo() { pararOuvir(); try { speechSynthesis.cancel(); } catch (e) {} desligarCamera(); liberarTela(); }

/* ---------- câmera (foto por voz: não precisa tocar) ---------- */
let STREAM = null;
async function ligarCamera() {
  if (STREAM) return true;
  try { STREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false }); desenharAtual(); return true; }
  catch (e) { STREAM = null; return false; }
}
function desligarCamera() { if (STREAM) { STREAM.getTracks().forEach(t => t.stop()); STREAM = null; } }
// tela sempre ligada durante a conferência
let TRAVA = null;
async function pedirTelaLigada() { try { if (navigator.wakeLock) TRAVA = await navigator.wakeLock.request('screen'); } catch (e) {} }
function liberarTela() { try { if (TRAVA) TRAVA.release(); } catch (e) {} TRAVA = null; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && C && MODO !== 'fim') pedirTelaLigada(); });

/* ---------- conferência guardada ---------- */
function verHist(id) {
  const h = (HIST || []).find(x => x.id === id); if (!h) return;
  openSheet(h.modelo_nome, `<p class="muted" style="margin:0">${esc([h.pavimento, h.unidade ? 'Apto ' + h.unidade : '', h.comodo].filter(Boolean).join(' · '))} · ${fmtDH(h.inicio)} · ${esc(nomeDe(h.por))} · ${h.modo === 'voz' ? 'por voz' : 'na tela'}</p>
    <div class="res">${(h.itens || []).map(x => { const st = x.st || 'vz'; return `<div class="ri ${st}"><span class="ic">${{ ok: '✓', nc: '✗', na: '—', vz: '?' }[st]}</span><span>${esc(x.txt)}</span><small>${st === 'ok' ? (x.valor != null ? num(x.valor) + ' ' + (x.unidade || '') + ' · ' : '') + 'conforme' + (x.lote ? ' (no “resto tudo ok”)' : '') : st === 'na' ? 'não se aplica' : st === 'nc' ? esc(x.desc || '') + (x.pnum ? ' · pendência #' + x.pnum : ' · só anotado') : 'sem resposta'}</small></div>`; }).join('')}</div>`);
}
function openSheet(t, body, foot) { const o = $('ovl'); $('ovlT').textContent = t; $('ovlB').innerHTML = body; $('ovlF').innerHTML = foot || ''; o.hidden = false; }
function closeSheet() { $('ovl').hidden = true; $('ovlB').innerHTML = ''; }
$('ovl').addEventListener('click', ev => { if (ev.target === $('ovl')) closeSheet(); });
$('ovlX').onclick = closeSheet;
window.addEventListener('beforeunload', ev => { if (C && MODO !== 'fim') { salvar(true); } });

/* ======================= início ======================= */
(async function iniciar() {
  NV = await (window.NUVEM_PRONTA || Promise.resolve(null));
  if (!NV) { $('main').innerHTML = '<div class="vazio"><h3>Precisa do banco online</h3></div>'; return; }
  sb = NV.cliente; OBRA = NV.obraId;
  try { await carregar(); }
  catch (e) {
    if (e.naoTem) { $('main').innerHTML = '<div class="vazio"><h3>Obra não encontrada</h3><a class="btn" href="index.html" style="text-decoration:none">Ver as obras</a></div>'; return; }
    $('main').innerHTML = `<div class="vazio"><h3>Não foi possível carregar</h3><p class="muted" style="margin:0">${esc(e.message || e)}</p><button class="btn" onclick="location.reload()">Recarregar</button></div>`; return;
  }
  $('obraNome').textContent = OBRA_NOME; document.title = OBRA_NOME + ' · Conferências';
  inicio();
  window.__CONF = { processar, estado: () => ({ MODO, C, NC }) };   // para testes
})();
})();
</script>
