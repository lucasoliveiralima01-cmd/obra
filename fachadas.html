<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mapa de Fachadas</title>
<meta name="theme-color" content="#22425c">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icone-apple.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Obra"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2322425c'/%3E%3Crect x='7' y='5' width='18' height='23' rx='1.5' fill='%23e9e5dc'/%3E%3Crect x='7' y='5' width='18' height='8' fill='%232f9a59'/%3E%3Crect x='7' y='13' width='18' height='7' fill='%23e39b1c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: faixa da marca · fachada à esquerda · avisos, ficha, aplicações e andamento à direita; no celular tudo empilha */
:root{
  --navy:#22425c; --petrol:#074669; --brand-ink:#ffffff; --brand-soft:#9fc3d6;
  --bg:#eef2f5; --panel:#ffffff; --ink:#14222e; --muted:#5a6b78; --line:#d3dce3; --line-2:#e4eaef;
  --accent:#074669; --accent-ink:#ffffff; --accent-soft:#dcebf2; --canvas-bg:#e3e9ee;
  --ok:#23804a; --ok-soft:#dcf0e3; --bad:#c23b2f; --bad-soft:#f8e0dc; --warn:#b86e00; --warn-soft:#fbecd2; --wait:#5b7287; --wait-soft:#e2e9ef;
  --f-disp:"Titillium Web","Segoe UI",Arial,sans-serif; --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1720; --panel:#14212c; --ink:#e3eaf0; --muted:#93a5b3; --line:#27394a; --line-2:#1d2d3a;
  --accent:#62aed3; --accent-ink:#06202e; --accent-soft:#163445; --canvas-bg:#0f1a23;
  --ok:#53c07f; --ok-soft:#163a26; --bad:#f07a6c; --bad-soft:#41201c; --warn:#f0a93a; --warn-soft:#3d2c10; --wait:#93a9bd; --wait-soft:#1c2b38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1720; --panel:#14212c; --ink:#e3eaf0; --muted:#93a5b3; --line:#27394a; --line-2:#1d2d3a;
  --accent:#62aed3; --accent-ink:#06202e; --accent-soft:#163445; --canvas-bg:#0f1a23;
  --ok:#53c07f; --ok-soft:#163a26; --bad:#f07a6c; --bad-soft:#41201c; --warn:#f0a93a; --warn-soft:#3d2c10; --wait:#93a9bd; --wait-soft:#1c2b38; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;margin:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:0}
/* faixa da marca */
.brand{background:var(--navy);color:var(--brand-ink);position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.brand::after{content:"";position:absolute;right:-40px;top:0;bottom:0;width:min(46%,560px);background:var(--petrol);clip-path:polygon(64px 0,100% 0,100% 100%,0 100%);z-index:0}
.brand-in{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:grid;color:inherit;text-decoration:none}
.ttl{display:grid;gap:0;border-left:1px solid rgba(255,255,255,.25);padding-left:18px;min-width:0}
.ttl .kick{font:600 .68rem var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-soft)}
.ttl h1{font:700 1.45rem/1.1 var(--f-disp);margin:0;letter-spacing:.01em}
.ttl .obra{font-size:.8rem;color:#d4e4ee;background:none;border:0;padding:0;text-align:left;border-bottom:1px dashed rgba(255,255,255,.35);justify-self:start}
.hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:6px 11px;font:600 .82rem var(--f-body);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.2)}
a.hbtn{text-decoration:none}
.hbtn.solid{background:#fff;color:var(--navy);border-color:#fff}
.hbtn.alerta{background:#f07a6c;color:#2b0700;border-color:#f07a6c}
.modechip{font:500 .7rem var(--f-mono);color:#d4e4ee;border:1px dashed rgba(255,255,255,.35);border-radius:12px;padding:2px 8px;white-space:nowrap}
/* principal */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;min-height:0;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.stage{display:grid;grid-template-rows:auto 1fr;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.lbl{font:600 .66rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fgrp{display:inline-flex;gap:6px;align-items:center;min-width:0}
.sel{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:600 .84rem var(--f-body);max-width:100%;min-width:0}
.views{position:relative;min-height:0;background:var(--canvas-bg)}
.views canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;z-index:2}
.card-ov{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 10px rgba(10,30,45,.08)}
.legend{left:10px;bottom:10px;padding:7px 9px;font-size:.76rem;display:flex;flex-wrap:wrap;gap:4px 10px;max-width:calc(100% - 20px);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.legend i.hach{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.75) 0 2px,transparent 2px 5px)}
.vbtns{right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font:600 .76rem var(--f-body);color:var(--ink);white-space:nowrap}
.ibtn:hover{border-color:var(--accent)}
.ibtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tip{pointer-events:none;background:var(--ink);color:var(--panel);font:500 .74rem var(--f-mono);padding:2px 7px;border-radius:4px;white-space:nowrap;transform:translate(12px,-26px)}
.center{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));padding:16px;display:grid;gap:10px}
.center h3{margin:0;font:700 1.15rem var(--f-disp)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent)}
.drawbar{left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px 10px;border:2px solid var(--accent);width:max-content;max-width:calc(100% - 20px)}
.drawbar .who{font:600 .82rem var(--f-body);display:flex;gap:6px;align-items:center;width:100%;justify-content:center;text-align:center}
.drawbar .who .sw{width:14px;height:14px;border-radius:3px;flex:none}
.drawbar .info{font-size:.78rem;color:var(--muted);width:100%;text-align:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.seg button{background:none;border:0;padding:6px 12px;font:600 .82rem var(--f-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* coluna lateral */
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-bottom:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card h2{font:700 .82rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card.alerta{border-color:var(--bad);background:linear-gradient(90deg,var(--bad) 0 4px,var(--panel) 4px)}
.card.alerta h2{color:var(--bad)}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:7px 12px;font:600 .84rem var(--f-body);white-space:nowrap;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:.78rem}
.btn.danger{background:none;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:.86rem}
.mono{font-family:var(--f-mono);font-size:.84em}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font:600 .68rem var(--f-body);padding:2px 7px;border-radius:10px;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.pend{background:var(--warn-soft);color:var(--warn)} .pill.wait{background:var(--wait-soft);color:var(--wait)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.15)}
.al{display:grid;gap:4px}
.ai{display:grid;grid-template-columns:auto 1fr;gap:2px 9px;align-items:start;padding:7px 8px;border:1px solid var(--line-2);border-radius:6px;background:none;text-align:left;width:100%;color:var(--ink);font-size:.84rem;line-height:1.3}
.ai:hover{border-color:var(--accent)}
.ai small{display:block;color:var(--muted);font-size:.76rem}
.ai .ic{font:700 .74rem var(--f-mono);border-radius:4px;padding:2px 6px;text-align:center;min-width:34px}
.ai .ic.bad{background:var(--bad-soft);color:var(--bad)} .ai .ic.ok{background:var(--ok-soft);color:var(--ok)} .ai .ic.pend{background:var(--warn-soft);color:var(--warn)}
.sub{font:700 .7rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.sub:first-child{margin-top:0}
.ap{display:grid;grid-template-columns:auto 1fr auto;gap:2px 9px;align-items:center;padding:7px 8px;border-top:1px solid var(--line-2);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--ink)}
.ap:first-child{border-top:0}
.ap:hover,.ap[aria-current="true"]{background:var(--accent-soft)}
.ap .m{font-size:.86rem;min-width:0;line-height:1.25}
.ap .m small{display:block;color:var(--muted);font-size:.76rem}
.fhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.fhead .sw{width:30px;height:30px;border-radius:6px}
.fhead h3{margin:0;font:700 1.15rem/1.1 var(--f-disp)}
.fhead small{display:block;color:var(--muted);font-size:.8rem}
dl.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;margin:0;font-size:.86rem}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.nota{border-radius:6px;padding:7px 9px;font-size:.84rem;margin-top:8px;line-height:1.35}
.nota.ok{background:var(--ok-soft);color:var(--ok)} .nota.pend{background:var(--warn-soft);color:var(--warn)} .nota.bad{background:var(--bad-soft);color:var(--bad)}
.rs{display:grid;gap:9px}
.rs .l{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;align-items:center}
.rs .l b{display:flex;gap:6px;align-items:center;font-weight:600}
.rs .l span{font:500 .74rem var(--f-mono);color:var(--muted);text-align:right}
.rb{height:9px;background:var(--line-2);border-radius:5px;overflow:hidden;display:flex;margin-top:3px}
.rb i{display:block;height:100%}
/* folhas */
.overlay{position:fixed;inset:0;background:rgba(6,20,30,.5);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(720px,100%);max-height:calc(100dvh - 32px);display:grid;grid-template-rows:auto 1fr auto;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.sheet.larga{width:min(1040px,100%)}
.sheet>header{padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet>header h3{margin:0;font:700 1.25rem var(--f-disp)}
.sheet .body{overflow:auto;padding:14px 16px;min-height:0}
.sheet>footer{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.fg .full{grid-column:1/-1}
.fld{display:grid;gap:3px;min-width:0}
.fld label,.fld .l{font:600 .7rem var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 9px;min-width:0;width:100%;font-size:.95rem}
.fld textarea{min-height:56px;resize:vertical}
.fld small{color:var(--muted);font-size:.76rem}
.msg{font-size:.82rem;margin-right:auto}.msg.err{color:var(--bad)}
.camt{display:grid;gap:8px}
.camr{display:grid;grid-template-columns:38px minmax(0,1.1fr) minmax(0,1.6fr) 74px auto;gap:6px;align-items:end;padding:8px;border:1px solid var(--line-2);border-radius:8px}
.camr .fld input{padding:7px 8px}
.camr input[type=color]{width:38px;height:36px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.camr .bt{display:flex;gap:4px}
.camr .bt button{width:32px;height:34px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0}
.camr .n{grid-column:1/-1;font-size:.74rem;color:var(--muted);margin-top:-2px}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vc{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px;align-content:start}
.vc .pv{background:#fff;border-radius:4px;display:grid;place-items:center;height:170px;overflow:hidden}
.vc canvas,.vc img{max-width:100%;max-height:170px}
.vc label.chk{display:flex;gap:6px;align-items:center;font-size:.86rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 15px;border-radius:8px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:1000px){
  html,body{height:auto}.app{height:auto}
  .main{grid-template-columns:1fr}
  .stage{height:min(74vh,700px);height:min(74dvh,700px)}
  .side{overflow:visible}
  .brand::after{width:38%}
}
@media (max-width:640px){
  .ttl{border-left:0;padding-left:0;width:100%}
  .ttl h1{font-size:1.25rem}
  .hctl{margin-left:0;width:100%}
  .hbtn{padding:6px 9px;font-size:.78rem}
  .brand::after{display:none}
  .fg{grid-template-columns:1fr}
  .stage{height:70vh;height:70dvh}
  .legend{font-size:.7rem;padding:5px 7px;gap:3px 7px}
  .sbar{gap:6px 10px;padding:6px 8px}
  .camr{grid-template-columns:38px minmax(0,1fr) 74px}
  .camr .mat{grid-column:1/-1}
  .camr .bt{grid-column:1/-1;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<div class="app">
<header class="brand"><div class="brand-in">
  <a class="logo" href="index.html" title="Início: ferramentas e obras" aria-label="Início"><svg viewBox="0 0 40 40" style="height:34px" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="8" fill="none" stroke="currentColor" stroke-opacity=".35"/><rect x="10" y="7" width="20" height="26" rx="1.5" fill="#e9e5dc"/><rect x="10" y="7" width="20" height="9" fill="#2f9a59"/><rect x="10" y="16" width="20" height="8" fill="#e39b1c"/><rect x="14" y="10" width="4" height="4" fill="#9fc3d6"/><rect x="22" y="10" width="4" height="4" fill="#9fc3d6"/><rect x="14" y="18" width="4" height="4" fill="#9fc3d6"/><rect x="22" y="18" width="4" height="4" fill="#9fc3d6"/></svg></a>
  <div class="ttl"><span class="kick">Revestimento e pintura</span><h1>Mapa de Fachadas</h1><button class="obra" id="obraNome" title="Trocar de obra">Obra</button></div>
  <div class="hctl">
    <button class="hbtn alerta" id="hQueb" hidden></button>

    <button class="hbtn solid" id="bCam" title="Camadas do revestimento: nome, material e tempo de cura">Camadas</button>

    <button class="hbtn" id="bImgF" data-menu>Adicionar fachada por imagem</button>
    <button class="hbtn" id="bFach" data-menu>Renomear ou excluir fachadas</button>

</div></header>

<div class="main">
  <section class="stage" aria-label="Fachada">
    <div class="sbar">
      <div class="fgrp"><span class="lbl">Fachada</span><select class="sel" id="selF" aria-label="Fachada"></select></div>

</div>
</div>

<script>
(function () {
'use strict';
/* ======================= utilidades ======================= */
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      R.vistas.forEach((v, i) => { const box = $('gRes').querySelector(`[data-pv="${i}"]`); const sc = Math.min(1, 400 / Math.max(v.W, v.H)); const c = document.createElement('canvas'); c.width = Math.round(v.W * sc); c.height = Math.round(v.H * sc); c.getContext('2d').drawImage(v.previa, 0, 0, c.width, c.height); box.appendChild(c); });
      $('gOk').disabled = false;
    } catch (e) { console.error(e); $('gMsg').textContent = 'Não foi possível gerar: ' + (e && e.message || e); $('gMsg').className = 'msg err'; $('gF').disabled = false; }
    delete $('ovl').dataset.ocupado;
  };
  $('gOk').onclick = async () => {
    if (!R) return; const msg = $('gMsg');
    const usar = R.vistas.map((v, i) => ({ v, i })).filter(x => $('gRes').querySelector(`[data-inc="${x.i}"]`).checked);

    try {
      const novas = [], velhos = [];
      for (const { v, i } of usar) {
        const id = 'f' + v.az; const ex = S.fach.find(f => f.id === id);
        const img = await enviarArquivo(v.img), mask = await enviarArquivo(v.mask);
        if (ex) { if (ex.img) velhos.push(ex.img); if (ex.mask) velhos.push(ex.mask); }
        novas.push({ id, nome: $('gRes').querySelector(`[data-nome="${i}"]`).value.trim() || v.nome, fonte: 'ifc', modelo: nomeArq, img, mask, u0: v.u0, z1: v.z1, px: v.px, W: v.W, H: v.H, az: v.az, niveis: R.niveis, gerada: new Date().toISOString() });
      }
      if (!await gravarFachadas(novas, velhos)) throw new Error('não foi possível salvar');
      delete $('ovl').dataset.ocupado; closeSheet(); S.fid = novas[0].id; fitted = null; depoisDados(); toast(novas.length + ' fachada(s) salva(s).');
    } catch (e) { console.error(e); delete $('ovl').dataset.ocupado; msg.textContent = 'Erro ao enviar: ' + (e && e.message || e); msg.className = 'msg err'; $('gOk').disabled = false; }
  };
}
function formImagem() {
  if (S.ro) return;
  openSheet('Adicionar fachada por imagem', `<p style="margin-top:0">Use a imagem (PNG ou JPG) da prancha da fachada, sem margens. Para as áreas saírem em m², informe a largura real que a imagem mostra.</p>
    <form class="fg" id="fI" autocomplete="off"><div class="fld full"><label for="iF">Imagem da fachada</label><input type="file" id="iF" accept="image/png,image/jpeg,image/webp"><small>Se tiver só o PDF, exporte a página como imagem antes.</small></div>
    <div class="fld"><label for="iN">Nome</label><input id="iN" placeholder="Ex.: Fachada frontal"></div>
    <div class="fld"><label for="iW">Largura real da imagem (m)</label><input id="iW" type="number" min="1" step="0.01" inputmode="decimal" placeholder="Ex.: 26,80"></div>
    <div class="fld"><label for="iZ">Cota da base da imagem (m)</label><input id="iZ" type="number" step="0.01" inputmode="decimal" value="0"><small>Opcional: altura do pé da imagem.</small></div></form>`,
    `<span class="msg" id="iMsg"></span><button class="btn ghost" id="iCan">Cancelar</button><button class="btn" id="iOk">Salvar</button>`);
  $('iCan').onclick = closeSheet;
  $('iOk').onclick = async () => {
    const msg = t => { $('iMsg').textContent = t; $('iMsg').className = 'msg err'; };
    const file = $('iF').files[0]; const nome = $('iN').value.trim(); const wm = parseFloat(String($('iW').value).replace(',', '.')); const zb = parseFloat(String($('iZ').value || '0').replace(',', '.')) || 0;
    if (!file) return msg('Escolha a imagem.'); if (!nome) return msg('Dê um nome para a fachada.'); if (!(wm > 0)) return msg('Informe a largura real em metros.');
    $('iOk').disabled = true; $('ovl').dataset.ocupado = '1';
    try {
      const im = await abrirImagem(URL.createObjectURL(file));
      const sc = Math.min(1, 3000 / Math.max(im.naturalWidth, im.naturalHeight)); const W = Math.round(im.naturalWidth * sc), H = Math.round(im.naturalHeight * sc);
      let blob = file; if (sc < 1 || file.size > 3e6) { const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(im, 0, 0, W, H); blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.88)) || await new Promise(r => c.toBlob(r, 'image/png')); }
      const px = wm / W; const img = await enviarArquivo(blob);
      const f = { id: uid('fi-'), nome, fonte: 'imagem', img, mask: null, u0: 0, z1: +(zb + H * px).toFixed(3), px, W, H, niveis: [], gerada: new Date().toISOString() };
      if (!await gravarFachadas([f])) throw new Error('não foi possível salvar');
      delete $('ovl').dataset.ocupado; closeSheet(); S.fid = f.id; fitted = null; depoisDados(); toast('Fachada adicionada.');
    } catch (e) { console.error(e); delete $('ovl').dataset.ocupado; msg('Erro: ' + (e && e.message || e)); $('iOk').disabled = false; }
  };
}
function formFachadas() {
  if (S.ro) return; if (!S.fach.length) { toast('Nenhuma fachada cadastrada.'); return; }
  const n = id => S.apl.filter(a => a.fachada === id).length;
  openSheet('Fachadas da obra', `<div class="camt">${S.fach.map((f, i) => `<div class="camr" style="grid-template-columns:minmax(0,1fr) auto"><div class="fld"><label>${f.fonte === 'imagem' ? 'Por imagem' : 'Do IFC' + (f.modelo ? ' · ' + esc(f.modelo) : '')}</label><input data-n="${i}" value="${esc(f.nome)}"></div>
      <div class="bt"><button type="button" data-x="${i}" title="Excluir" aria-label="Excluir ${esc(f.nome)}">✕</button></div><div class="n">${n(f.id)} aplicação(ões) · ${f0(f.W * f.px)} × ${f0(f.H * f.px)} m</div></div>`).join('')}</div>`,
    `<span class="msg" id="fMsg"></span><button class="btn ghost" id="fCan">Cancelar</button><button class="btn" id="fOk">Salvar nomes</button>`);
  $('fCan').onclick = closeSheet;
  $('ovlB').querySelectorAll('[data-x]').forEach(b => b.onclick = () => { const f = S.fach[+b.dataset.x]; const k = n(f.id);
    confirmSheet('Excluir a ' + f.nome + '?', k ? `As ${k} aplicação(ões) desenhadas nesta fachada também serão apagadas.` : 'A imagem da fachada será apagada.', 'Excluir', async () => {
      for (const a of S.apl.filter(x => x.fachada === f.id)) { if (await apagar('aplicacoes/' + a.id)) S.apl = S.apl.filter(x => x.id !== a.id); }
      S.fach = S.fach.filter(x => x.id !== f.id); if (await salvarConfig()) { for (const id of [f.img, f.mask]) if (id) NV.assets.delete(id).catch(() => {}); }
      IMG.delete(f.id); mudou(); depoisDados(); toast('Fachada excluída.'); }); });
  $('fOk').onclick = async () => { $('ovlB').querySelectorAll('[data-n]').forEach(inp => { const v = inp.value.trim(); if (v) S.fach[+inp.dataset.n].nome = v; });
    if (await salvarConfig()) { mudou(); closeSheet(); depoisDados(); toast('Nomes salvos.'); } };
}

/* ---------- exportar ---------- */
async function exportarPng() {
  const f = fachAtual(); if (!f) { toast('Nenhuma fachada.'); return; }
  const I = IMG.get(f.id); if (!I || !I.img) { toast('A imagem da fachada ainda está carregando.'); return; }
  const k = Math.min(2, 3000 / Math.max(f.W, f.H)); const g = Math.max(1, Math.round(f.W * k) / 1200);   // g: escala das letras
  const ml = Math.round(130 * g); const W = Math.round(f.W * k) + ml + 20, Hd = Math.round(f.H * k);
  const camsL = S.modo === 'sit' ? camsOrd() : [camById(S.modo)].filter(Boolean); const lh = Math.round(24 * g); const legH = Math.round(60 * g) + lh * camsL.length + Math.round(30 * g);
  const c = document.createElement('canvas'); c.width = W; c.height = Hd + 40 + legH; const x = c.getContext('2d');
  // imagem a partir de x = ml (espaço para os nomes dos pavimentos) e y = 20
  const s = k / f.px; const v = { s, cu: f.u0 + (W / 2 - ml) / s, cz: f.z1 - (Hd / 2) / s };
  const sel = S.sel; S.sel = null; FS = g; try { desenhar(x, W, Hd + 40, 1, v, false); } finally { FS = 1; S.sel = sel; }
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'destination-over'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.globalCompositeOperation = 'source-over';
  let y = Hd + 40 + Math.round(34 * g);
  x.fillStyle = '#14222e'; x.font = '700 ' + Math.round(22 * g) + 'px "Titillium Web",sans-serif'; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.fillText((S.obra ? S.obra.nome + ' · ' : '') + f.nome + ' · ' + (S.modo === 'sit' ? 'situação geral' : camById(S.modo).nome) + ' em ' + fmtD(S.ref), 20, y);
  y += Math.round(30 * g); x.font = '500 ' + Math.round(15 * g) + 'px "Source Sans 3",sans-serif';
  camsL.forEach((cm, i) => { const cy = y + i * lh; const q = Math.round(14 * g); x.fillStyle = S.modo === 'sit' ? corCam(cm) : '#23804a'; x.fillRect(20, cy - q + 2, q, q); x.fillStyle = '#14222e'; x.fillText(cm.nome + ' (cura ' + nDias(curaDe(cm)) + ')' + (cm.material ? ' · ' + cm.material : ''), 20 + q + 8, cy + 1); });
  x.fillStyle = '#5a6b78'; x.font = '400 ' + Math.round(13 * g) + 'px "Source Sans 3",sans-serif'; x.fillText('Hachurado: em cura · vermelho: quebra de cura · gerado em ' + new Date().toLocaleString('pt-BR'), 20, c.height - Math.round(12 * g));
  const b = await new Promise(r => c.toBlob(r, 'image/png')); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u;
  a.download = (f.nome + '_' + S.ref).replace(/[^\wÀ-ú-]+/g, '_') + '.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function exportarCsv() {
  const fn = id => (S.fach.find(f => f.id === id) || {}).nome || id;
  const Q = quebras(); const rows = [['Fachada', 'Camada', 'Material', 'Data aplicação', 'Cura (dias)', 'Liberação', 'Situação em ' + fmtD(S.ref), 'Área (m²)', 'Área desenhada (m²)', 'Equipe', 'Observação', 'Quebra de cura', 'Registrado por']];
  for (const a of S.apl.slice().sort((p, q) => (fn(p.fachada) + p.data).localeCompare(fn(q.fachada) + q.data))) { const c = camById(a.camada); if (!c) continue; const e = estado(a);
    const qb = Q.filter(q => q.B.id === a.id).map(q => 'sobre ' + q.cA.nome + ' de ' + fmtD(q.A.data) + (q.tipo === 'ordem' ? ' (antes dela)' : ' (' + q.falta + ' d antes)')).join('; ');
    rows.push([fn(a.fachada), c.nome, c.material || '', fmtD(a.data), curaDe(c), fmtD(e.lib), e.st === 'lib' ? 'Liberada' : e.st === 'cura' ? 'Em cura (faltam ' + e.faltam + ' d)' : 'Futura', f1(areaDe(a)), f1(a.areaBruta != null ? a.areaBruta : areaDe(a)), a.equipe || '', a.obs || '', qb, quem(a.por)]); }
  const csv = '﻿' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
  const u = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); const l = document.createElement('a'); l.href = u; l.download = 'Fachadas_' + (S.obra ? S.obra.nome.replace(/[^\wÀ-ú]+/g, '_') + '_' : '') + S.ref + '.csv'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000);
}

(async function boot() {

  ]);
  setLoading(false); aplicarRO(); resize(); depoisDados();
